   lucide UMD exposes each icon at window.lucide[Name] as [tagName, attrs, children].
   Attrs use SVG kebab-case (stroke-width, stroke-linecap, …) which React needs as camelCase. */
function kebabToCamelProps(obj) {
  const out = {};
  for (const k of Object.keys(obj || {})) {
    const ck = k.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    out[ck] = obj[k];
  }
  return out;
}
function makeLucideIcon(name) {
  return function LucideIconWrap({ size = 24, color, strokeWidth, className = '', style, ...rest }) {
    const src = window.lucide || {};
    const node = (src.icons && src.icons[name]) || src[name] || null;
    if (!node) return null;
    const [tag, attrs, children = []] = node;
    const svgProps = {
      ...kebabToCamelProps(attrs),
      width: size,
      height: size,
      ...(color != null ? { stroke: color } : {}),
      ...(strokeWidth != null ? { strokeWidth } : {}),
      className,
      style,
      ...rest,
    };
    return React.createElement(
      tag,
      svgProps,
      children.map(([t, a], i) =>
        React.createElement(t, { key: i, ...kebabToCamelProps(a) })
      )
    );
  };
}

    .term-meta-value svg { color: var(--color-neutral-dark-2); flex-shrink: 0; }

    /* ── SCHEDULE TABLE ──────────────────── */
    .sched-table-wrap {
      margin: 16px 20px 20px;
      background: #FFFFFF;
      border: 1px solid var(--color-neutral-dark-5);
      border-radius: 8px;
      overflow: auto;
    }
    .sched-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }
    .sched-table thead th {
      font-size: 10px;
      line-height: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-neutral-dark-3);
      text-align: center;
      padding: 16px 12px;
      vertical-align: middle;
      background: #F7F8FB;
      border-bottom: 1px solid var(--color-neutral-dark-5);
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .sched-table tbody td {
      padding: 14px 12px;
      border-bottom: 1px solid var(--color-neutral-dark-6);
      vertical-align: middle;
      background: #FFFFFF;
    }
    .sched-table tbody tr:last-child td { border-bottom: none; }
    .sched-table tbody tr.row-error td {
      background: #FFFAFA;
    }
    .sched-table tbody tr.row-pending td {
      background: #F9FAFF;
    }
    .sched-table tbody tr.row-scheduled td {
      background: #F3FBF6;
    }
    .sched-table tbody tr.row-processing td {
      background: #FFF9EC;
    }
    .sched-table tbody tr.row-creating td {
      background: #F6F4FB;
    }

    /* Row error banner */
    .row-error-banner {
      padding: 10px 12px;
      background: var(--color-error-5);
      border-left: 3px solid var(--color-error-1);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .row-error-text {
      font-size: 12px;
      line-height: 16px;
      color: var(--color-error-2);
      font-weight: 500;
    }

    /* ── GROUP HEAD (subject banner) ────── */
    .group-head-row td.group-head-cell {
      padding: 0;
      background: transparent;
      border-bottom: none;
    }
    .group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px;
      background: linear-gradient(180deg, rgba(34, 54, 106, 0.09) 0%, rgba(34, 54, 106, 0.05) 100%);
      border-left: 3px solid var(--color-primary);
      border-top: 1px solid rgba(34, 54, 106, 0.14);
      border-bottom: 1px solid rgba(34, 54, 106, 0.14);
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
      margin: 0 0 0 0;
    }
    .group-head-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .group-head-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 0.005em;
      line-height: 1.25;
    }
    .group-head-tags {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .group-head-meta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--color-neutral-dark-2);
      padding-left: 2px;
      white-space: nowrap;
      font-weight: 500;
    }

    /* ── GROUP BODY ROWS ─────────────────── */
    .group-body-row td {
      background: #FFFFFF;
      border-bottom: 1px solid var(--color-neutral-dark-6);
      border-left: 3px solid transparent;
    }
    .group-body-row td:first-child {
      border-left: 3px solid var(--color-primary-2);
    }
    .group-body-row.group-last td {
      border-bottom: 1px solid var(--color-neutral-dark-5);
    }
    .group-body-row.group-last td:first-child {
      border-bottom-left-radius: 6px;
    }
    .group-body-row.group-last td:last-child {
      border-bottom-right-radius: 6px;
    }

    /* Status-specific row tinting — keep the left border accent */
    .group-body-row.row-error td      { background: #FFFAFA; }
    .group-body-row.row-processing td { background: #FFF9EC; }
    .group-body-row.row-creating td   { background: #F6F4FB; }
    .group-body-row.row-scheduled td  { background: #F3FBF6; }
    .group-body-row.row-scheduled td:first-child  { border-left-color: var(--color-success-1); }
    .group-body-row.row-error td:first-child      { border-left-color: var(--color-error-1); }
    .group-body-row.row-processing td:first-child { border-left-color: var(--color-warning-1); }
    .group-body-row.row-creating td:first-child   { border-left-color: var(--color-accent-b-2); }
    .group-body-row.row-pending td    { background: #F9FAFF; }

    /* Spacer row between groups */
    .group-spacer td {
      padding: 0;
      height: 12px;
      background: transparent;
      border-bottom: none;
    }

    /* ── SECTION CELL (inside a group) ───── */
    .section-cell {
      vertical-align: middle !important;
    }
    .section-pill {
      display: inline-flex;
      flex-direction: column;
      gap: 2px;
      padding: 6px 10px;
      background: var(--color-primary-3);
      border-radius: 4px;
      border: 1px solid rgba(34, 54, 106, 0.08);
      min-width: 140px;
    }
    .section-pill-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    /* The small "Section A" breadcrumb shown above a group label on the section head */
    .section-pill-context {
      font-size: 10px;
      font-weight: 600;
      color: var(--color-neutral-dark-3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      line-height: 1.2;
    }
    /* Tree-glyph leading a group label, e.g. "└ Group 2" */
    .section-group-glyph {
      color: var(--color-primary-2);
      font-weight: 400;
      font-size: 13px;
      opacity: 0.75;
    }
    .section-pill-sub {
      font-size: 11px;
      color: var(--color-neutral-dark-3);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .sched-ext-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .sched-ext-link {
      display: inline-flex;
      align-items: center;
      color: var(--color-primary-2);
      text-decoration: none;
      transition: color 0.12s;
      line-height: 1;
    }
    .sched-ext-link:hover { color: var(--color-primary); }
    .sched-ext-tooltip {
      display: none;
      position: absolute;
      bottom: calc(100% + 5px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--color-primary-4);
      color: #fff;
      font-size: 11px;
      font-weight: 400;
      white-space: nowrap;
      padding: 4px 8px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 200;
    }
    .sched-ext-wrap:hover .sched-ext-tooltip { display: block; }

    /* Rows that belong to a group family — subtler pill, indented */
    .group-body-row.is-group-row .section-cell {
      padding-left: 28px !important;
    }
    .group-body-row.is-group-row .section-pill {
      background: #FFFFFF;
      border-color: rgba(65, 50, 114, 0.20);
    }
    .group-body-row.is-group-row .section-pill-label {
      color: var(--color-accent-b-2);
      font-weight: 600;
    }
    /* Child rows (non-head groups) get a lighter left-border accent */
    .group-body-row.is-group-child td:first-child {
      border-left: 3px solid rgba(34, 54, 106, 0.15);
    }

    /* ── GROUPS STEPPER ──────────────────── */
    .groups-stepper {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      padding: 3px 6px 3px 8px;
      background: #FFFFFF;
      border: 1px solid var(--color-neutral-dark-5);
      border-radius: 18px;
      width: fit-content;
    }
    .groups-stepper-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-neutral-dark-2);
      padding-right: 4px;
      border-right: 1px solid var(--color-neutral-dark-6);
      margin-right: 2px;
      letter-spacing: 0.02em;
    }
    .groups-stepper-count {
      font-size: 12px;
      font-weight: 700;
      color: var(--color-primary);
      min-width: 14px;
      text-align: center;
    }
    .groups-stepper-btn {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      background: var(--color-primary-3);
      color: var(--color-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.12s ease, color 0.12s ease;
      font-family: inherit;
      padding: 0;
    }
    .groups-stepper-btn:hover:not(:disabled) {
      background: var(--color-primary);
      color: #FFFFFF;
    }
    .groups-stepper-btn:active:not(:disabled) {
      background: var(--color-primary-4);
      color: #FFFFFF;
    }
    .groups-stepper-btn:disabled {
      background: transparent;
      color: var(--color-neutral-dark-4);
      cursor: not-allowed;
    }

    /* ── DAYS MULTI-SELECT ───────────────── */
    .days-ms-wrap {
      position: relative;
      width: 100%;
    }

    /* ── TIME PICKER ─────────────────────── */
    .tp-wrap {
      display: inline-flex;
      align-items: center;
      gap: 0;
      border: 1px solid var(--color-neutral-dark-5);
      border-radius: 4px;
      background: #fff;
      width: 100%;
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .tp-wrap:focus-within {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(34,54,106,0.08);
    }
    .tp-wrap.tp-error { border-color: var(--color-error-1); background: #FFFAFA; }
    .tp-wrap.tp-disabled { opacity: 0.5; background: var(--color-neutral-dark-6); pointer-events: none; }
    .tp-seg {
      flex: 1;
      padding: 6px 4px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      text-align: center;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--color-neutral-dark-1);
      border-radius: 0;
      min-width: 28px;
      letter-spacing: 0.02em;
      transition: background 0.1s;
    }
    .tp-seg:focus { outline: none; background: var(--color-primary-3); color: var(--color-primary); }
    .tp-seg.tp-seg-focused { background: var(--color-primary-3); color: var(--color-primary); }
    .tp-seg.tp-seg-empty { color: var(--color-neutral-dark-3); }
    .tp-colon {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-neutral-dark-2);
      padding: 0 1px;
      user-select: none;
    }
    .tp-steppers {
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--color-neutral-dark-6);
      flex-shrink: 0;
    }
    .tp-step {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 15px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 8px;
      color: var(--color-neutral-dark-3);
      padding: 0;
      line-height: 1;
      transition: background 0.1s, color 0.1s;
    }
    .tp-step:hover { background: var(--color-neutral-dark-6); color: var(--color-primary); }
    .tp-step:first-child { border-bottom: 1px solid var(--color-neutral-dark-6); }
    .days-ms-panel {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 100%;
      min-width: 180px;
      background: #FFFFFF;
      border: 1px solid var(--color-neutral-dark-5);
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(12, 12, 12, 0.10), 0 2px 4px rgba(12, 12, 12, 0.04);
      z-index: 40;
      overflow: hidden;
      animation: dmsPop 0.12s ease;
    }
    @keyframes dmsPop {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .days-ms-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-bottom: 1px solid var(--color-neutral-dark-6);
      background: #FAFBFC;
    }
    .days-ms-actions .btn-text-14 {
      padding: 2px 0;
    }
    .days-ms-list {
      display: flex;
      flex-direction: column;
      max-height: 240px;
      overflow-y: auto;
    }
    .days-ms-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.1s ease;
      color: var(--color-neutral-dark-1);
    }
    .days-ms-option:hover {
      background-color: var(--color-primary-3);
    }
    .cascader-trigger.open {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(34, 54, 106, 0.08);
    }

    /* Progress bar */
    .progress-bar {
      height: 4px;
      background: var(--color-neutral-dark-6);
      border-radius: 2px;
      overflow: hidden;
      flex: 1;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--color-primary) 0%, var(--color-primary-5) 100%);
      transition: width 0.4s ease;
    }

    /* Empty state for missing term */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 32px;
      text-align: center;
      gap: 12px;
    }
    .empty-state-icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--color-warning-5);
      color: var(--color-warning-2);
      display: inline-flex;
      align-items: center; justify-content: center;
    }
    .empty-state-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-neutral-dark-1);
    }
    .empty-state-desc {
      font-size: 13px;
      color: var(--color-neutral-dark-2);
      max-width: 400px;
    }

    /* Success screen */
    .success-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 32px;
      text-align: center;
      gap: 16px;
      flex: 1;
    }
    .success-icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--color-success-5);
      color: var(--color-success-2);
      display: inline-flex;
      align-items: center; justify-content: center;
    }
    .success-title { font-size: 22px; font-weight: 700; color: var(--color-neutral-dark-1); }
    .success-desc  { font-size: 14px; color: var(--color-neutral-dark-2); max-width: 520px; }

    /* Launcher (demo page) — two-column layout matching screenshot */
    .demo-page {
      min-height: 100vh;
      background: #F5F6FA;
      padding: 24px 32px 32px;
      font-family: 'Public Sans', sans-serif;
      color: var(--color-neutral-dark-1);
    }
    .demo-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-left: 4px;
    }
    .demo-brand-logo {
      font-family: 'Public Sans', sans-serif;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--color-primary);
    }

    .demo-layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      align-items: start;
    }

    /* LEFT RAIL ---------------------------- */
    .demo-rail {
      background: #FFFFFF;
      border-radius: 10px;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(12, 12, 12, 0.04);
    }
    .demo-rail-tabs {
      display: flex;
      padding: 0 24px;
      border-bottom: 1px solid var(--color-neutral-dark-5);
    }
    .demo-rail-tab {
      padding: 16px 4px;
      margin-right: 28px;
      font-size: 15px;
      font-weight: 500;
      color: var(--color-neutral-dark-3);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .demo-rail-tab:hover { color: var(--color-neutral-dark-2); }
    .demo-rail-tab.active {
      color: var(--color-primary);
      font-weight: 700;
      border-bottom-color: var(--color-primary);
    }

    .demo-rail-body {
      padding: 24px;
    }
    .demo-rail-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--color-neutral-dark-1);
      margin: 0 0 12px;
      letter-spacing: -0.01em;
    }
    .demo-rail-desc {
      font-size: 14px;
      line-height: 22px;
      color: var(--color-neutral-dark-2);
      margin: 0 0 24px;
    }
    .demo-rail-divider {
      height: 1px;
      background: var(--color-neutral-dark-5);
      margin: 0 0 20px;
    }
    .demo-rail-label {
      display: block;
      font-size: 13px;
      color: var(--color-neutral-dark-2);
      margin-bottom: 6px;
    }
    .demo-rail-label .req { color: var(--color-error-1); }

    .demo-rail-campus {
      padding: 10px 14px;
      font-size: 14px;
      min-height: 42px;
      margin-bottom: 20px;
      width: 100%;
    }
    .demo-rail-cta {
      width: 100%;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .demo-rail-import-btn {
      width: 100%;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .demo-rail-note {
      background: #E4F1FC;
      border-radius: 4px;
      padding: 12px 14px;
      font-size: 12.5px;
      line-height: 18px;
      color: var(--color-neutral-dark-2);
    }
    .demo-rail-note strong {
      display: block;
      color: var(--color-neutral-dark-1);
      font-weight: 700;
      margin-bottom: 3px;
    }

    /* RIGHT CALENDAR ----------------------- */
    .demo-cal {
      background: #FFFFFF;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(12, 12, 12, 0.04);
    }
    .demo-cal-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      gap: 16px;
    }
    .demo-cal-toolbar-left,
    .demo-cal-toolbar-right {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .demo-cal-schedule-btn {
      padding: 10px 18px;
      background: var(--color-primary);
      color: #FFFFFF;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
    }
    .demo-cal-schedule-btn:hover { background: var(--color-primary-5); }
    .demo-cal-nav {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .demo-cal-nav-btn {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: none;
      background: var(--color-neutral-dark-6);
      color: var(--color-neutral-dark-2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .demo-cal-nav-btn:hover { background: var(--color-neutral-dark-5); }
    .demo-cal-range {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-neutral-dark-1);
      letter-spacing: 0.01em;
    }
    .demo-cal-pill {
      padding: 6px 14px;
      font-size: 13px;
      color: var(--color-neutral-dark-2);
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-family: inherit;
    }
    .demo-cal-pill:hover { background: var(--color-neutral-dark-6); }
    .demo-cal-select {
      padding: 6px 10px;
      font-size: 13px;
      border: none;
      background: none;
      color: var(--color-neutral-dark-2);
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%230C0C0C' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 4px center;
      padding-right: 20px;
      font-family: inherit;
    }

    /* Week grid */
    .demo-cal-grid {
      display: grid;
      grid-template-columns: 50px repeat(7, 1fr);
      border-top: 1px solid var(--color-neutral-dark-6);
    }
    .demo-cal-dayhead {
      padding: 14px 12px 18px;
      border-right: 1px solid var(--color-neutral-dark-6);
      border-bottom: 1px solid var(--color-neutral-dark-5);
      text-align: center;
    }
    .demo-cal-dayhead:last-child { border-right: none; }
    .demo-cal-dayhead.is-sunday { background: #FAFBFC; }
    .demo-cal-dayhead.is-today .demo-cal-daynum {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--color-primary);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center; justify-content: center;
    }
    .demo-cal-dayhead.is-sunday .demo-cal-dayname,
    .demo-cal-dayhead.is-sunday .demo-cal-daynum {
      color: var(--color-neutral-dark-3);
    }
    .demo-cal-dayname {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--color-neutral-dark-3);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .demo-cal-daynum {
      font-size: 20px;
      font-weight: 400;

    .demo-cal-timehead {

    }
    .demo-cal-timecell {
      padding: 22px 8px 0 0;
      text-align: right;
      font-size: 11px;
      color: var(--color-neutral-dark-3);
      border-right: 1px solid var(--color-neutral-dark-6);
      border-bottom: 1px solid var(--color-neutral-dark-6);
      min-height: 72px;
      box-sizing: border-box;
    }
    .demo-cal-slot {
      border-right: 1px solid var(--color-neutral-dark-6);
      border-bottom: 1px solid var(--color-neutral-dark-6);
      min-height: 72px;
      position: relative;

    .demo-cal-slot:last-child { border-right: none; }
    .demo-cal-slot.is-sunday { background: #FAFBFC; }

    /* Current-time red indicator line */
    .demo-cal-now {
      position: absolute;
      left: 0; right: 0;
      top: 28%;
      height: 1px;
      background: var(--color-error-1);
      pointer-events: none;
      z-index: 1;
    }
    .demo-cal-now::before {
      content: "";
      position: absolute;
      left: -6px;
      top: -5px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--color-error-1);
    }
    .demo-cal-now-continue::before {
      display: none;
    }

    /* Scrollbar refinement */
    .drawer-body::-webkit-scrollbar,
    .drawer-tabs::-webkit-scrollbar { height: 6px; width: 6px; }

    .drawer-tabs::-webkit-scrollbar-thumb {
      background: var(--color-neutral-dark-4);
      border-radius: 3px;
    }

    /* tab error dot */
    .tab-error-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--color-error-1);
    }
    .tab-done-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--color-success-1);
    }

    /* tooltip on hover (row error) */
    .cell-error { color: var(--color-error-2); font-weight: 600; }

    /* ── IMPORT STEP ──────────────────────── */
    .import-step { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
    .import-dropzone {
      border: 2px dashed var(--color-neutral-dark-4);
      border-radius: 8px; padding: 40px 24px; text-align: center; cursor: pointer;
      transition: border-color 0.15s, background 0.15s; background: var(--color-primary-3);

    .import-dropzone-title { font-size: 15px; font-weight: 600; color: var(--color-neutral-dark-1); margin-bottom: 4px; }
    .import-dropzone-sub { font-size: 13px; color: var(--color-neutral-dark-2); }
    .import-summary-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .import-summary-table th {
      text-align: left; padding: 8px 12px; font-weight: 600; color: var(--color-neutral-dark-2);
      border-bottom: 1px solid var(--color-neutral-dark-5); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .import-summary-table td {
      padding: 8px 12px; border-bottom: 1px solid var(--color-neutral-dark-6);
      color: var(--color-neutral-dark-1); vertical-align: middle;

    .import-summary-table tr:last-child td { border-bottom: none; }
    .import-step-title { font-size: 15px; font-weight: 700; color: var(--color-neutral-dark-1); }

      padding: 10px 14px; background: var(--color-neutral-dark-6);
      cursor: pointer; user-select: none;

    .diff-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .diff-table th {
      text-align: left; padding: 6px 10px; font-size: 10px; font-weight: 700;

      border-bottom: 1px solid var(--color-neutral-dark-5); white-space: nowrap;

    .diff-table td { padding: 7px 10px; border-bottom: 1px solid var(--color-neutral-dark-6); vertical-align: middle; }
    .diff-table tr:last-child td { border-bottom: none; }
    .diff-row-new td { background: #f0faf3; }
    .diff-subject { font-weight: 600; color: var(--color-neutral-dark-1); max-width: 140px; }
    .diff-sec { color: var(--color-neutral-dark-2); white-space: nowrap; }

    /* ── TEMPLATE CONFIG MODAL ───────────────── */

      position: fixed; inset: 0; background: rgba(12,12,12,0.55);
      z-index: 200; display: flex; align-items: center; justify-content: center;
      animation: fadeIn 0.15s ease;

    .tpl-modal {
      background: #fff; border-radius: 10px; width: min(560px, 96vw);

    .tpl-modal-header {
      display: flex; align-items: center; justify-content: space-between;

    .tpl-modal-title { font-size: 16px; font-weight: 700; color: var(--color-neutral-dark-1); }

      border: 1px solid #d0d4ef;

    }
    .tpl-per-program-toggle {

      padding: 10px 12px; border-radius: 6px;
      background: var(--color-neutral-dark-6); cursor: pointer; user-select: none;

    .tpl-toggle-switch {

      background: #fff; width: 90px;

    .tpl-slot-time-input:focus { outline: none; border-color: var(--color-primary); }

    .import-mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .import-mode-card {
      display: flex; flex-direction: column; gap: 8px;
      padding: 14px; border-radius: 8px; cursor: pointer;
      border: 2px solid var(--color-neutral-dark-5);

    .import-mode-desc { font-size: 12px; color: var(--color-neutral-dark-2); line-height: 16px; }

    .bulk-sched-actions { display: flex; gap: 6px; margin-top: 8px; }

/** All faculty across all campuses — keyed by id for quick lookup */
const ALL_FACULTY = (() => {
  const out = {};
  for (const c of CAMPUS_DATA.campuses) {
    for (const f of c.faculty) out[f.id] = f;
  }
  return out;
})();

/** Get the faculty list for a campus (for the Faculty dropdown options) */
function getFacultyForCampus(campusId) {
  const c = CAMPUS_DATA.campuses.find((x) => x.id === campusId);
  return c ? c.faculty.map((f) => ({ id: f.id, name: (f.name || "").trim() || `Faculty ${f.id}` })) : [];
}

/**
 * Suggest faculty ordering for a subject within a campus: put the faculty
 * already mapped to any section of this subject at the top, then the rest.
 * This mirrors how Academic Management's mapping would feed the dropdown.
 */
function facultySuggestionsForSubject(campusId, subjectId) {
  const c = CAMPUS_DATA.campuses.find((x) => x.id === campusId);
  if (!c) return [];
  const mappedIds = new Set();
  for (const p of c.programs) {
    for (const t of p.terms || []) {
      for (const s of t.subjects) {
        if (s.id !== subjectId) continue;
        for (const sec of s.sections) {
          if (sec.primary_faculty_id) mappedIds.add(sec.primary_faculty_id);
          if (sec.secondary_faculty_id) mappedIds.add(sec.secondary_faculty_id);
        }
      }
    }
  }
  const ordered = [];
  for (const fid of mappedIds) {
    const f = ALL_FACULTY[fid];
    if (f) ordered.push({ id: f.id, name: (f.name || "").trim() || `Faculty ${f.id}` });
  }
  for (const f of c.faculty) {
    if (!mappedIds.has(f.id)) ordered.push({ id: f.id, name: (f.name || "").trim() || `Faculty ${f.id}` });
  }
  return ordered;
}

    s.toLowerCase().replace(/^(mr\.|mrs\.|ms\.|dr\.|prof\.)\s*/i, "").replace(/\s+/g, " ").trim();
  const target = strip(rawName);
  let f = facultyList.find((x) => strip(x.name) === target);
  if (!f) f = facultyList.find((x) => { const n = strip(x.name); return n.includes(target) || target.includes(n); });
  return f ? String(f.id) : "";
}

function parseXlsxTimetable(workbook) {
  const sheetMeta = {};
  const idxWs = workbook.Sheets["Index"];
  if (idxWs) {
    const rows = XLSX.utils.sheet_to_json(idxWs, { header: 1, defval: null });
    for (const row of rows) {
      if (!row[0] || row[0] === "Sheet") continue;
      const [name, program, batch, offering] = row;
      if (typeof name === "string" && program)
        sheetMeta[name] = { program: String(program), batch: String(batch), offering: String(offering) };
    }
  }

  const parsed = {};
  for (const sheetName of workbook.SheetNames) {
    if (sheetName === "Index") continue;
    const ws = workbook.Sheets[sheetName];
    if (!ws) continue;
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
    if (rows.length < 4) continue;

    let termStart = "", termEnd = "";
    const hdr = String(rows[0]?.[0] || "");
    const dm = hdr.match(/(\d{4}-\d{2}-\d{2})\s*[→\-]\s*(\d{4}-\d{2}-\d{2})/);
    if (dm) { termStart = dm[1]; termEnd = dm[2]; }

    /* Row 1 = slot labels (Slot 1, Slot 2, …, Lunch, …)
       Row 2 = slot timings (08:30–09:20, …) */
    const labelRow  = rows[1] || [];
    const timingRow = rows[2] || [];
    const slotCols = [];
    for (let c = 2; c < timingRow.length; c++) {
      const label = String(labelRow[c] || "");
      if (/lunch/i.test(label)) continue;
      const t = String(timingRow[c] || "");
      const m = t.match(/(\d{1,2}:\d{2})[–\-](\d{1,2}:\d{2})/);
      if (m) slotCols.push({ colIdx: c, startTime: m[1], endTime: m[2] });
    }

    let refStart = -1;
    for (let r = 3; r < rows.length; r++) {
      const c0 = String(rows[r]?.[0] || "").trim();
      if (c0 === "#" || /Subject Reference/i.test(c0)) { refStart = r; break; }
    }
    const tblEnd = refStart > -1 ? refStart : rows.length;

    const timetableEntries = [];
    let curDay = "";
    for (let r = 3; r < tblEnd; r++) {
      const row = rows[r] || [];
      const dayCell = String(row[0] || "").trim().toUpperCase().substring(0, 3);
      const secCell = String(row[1] || "").trim();
      if (dayCell && DAY_TO_IDX[dayCell] !== undefined) curDay = dayCell;
      if (!curDay || !secCell) continue;
      for (const sc of slotCols) {
        const subj = String(row[sc.colIdx] || "").trim();
        if (subj) timetableEntries.push({ day: curDay, section: secCell, subject: subj, startTime: sc.startTime, endTime: sc.endTime });
      }
    }

    const facultyMap = {};
    if (refStart > -1) {
      let dataStart = refStart + 1;
      for (let r = refStart; r < Math.min(refStart + 5, rows.length); r++) {
        if (String(rows[r]?.[0] || "").trim() === "#") { dataStart = r + 1; break; }
      }
      for (let r = dataStart; r < rows.length; r++) {
        const row = rows[r] || [];
        if (row[0] == null) continue;
        const name = String(row[1] || "").trim();
        const fac  = String(row[3] || "").trim();
        if (name) facultyMap[normSubjectName(name)] = { faculty: fac, originalName: name };
      }
    }

    parsed[sheetName] = { meta: sheetMeta[sheetName] || null, termStart, termEnd, timetableEntries, facultyMap };
  }
  return parsed;
}

   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TEMPLATE GENERATOR
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const STANDARD_SLOTS = [
  { label: "Slot 1", start: "08:30", end: "09:20" },
  { label: "Slot 2", start: "09:20", end: "10:10" },
  { label: "Slot 3", start: "10:10", end: "11:00" },
  { label: "Slot 4", start: "11:00", end: "11:50" },
  { label: "Slot 5", start: "11:50", end: "12:40" },
  { label: "Lunch",  start: "12:40", end: "13:10", isLunch: true },
  { label: "Slot 6", start: "13:10", end: "14:00" },
  { label: "Slot 7", start: "14:00", end: "14:50" },
  { label: "Slot 8", start: "14:50", end: "15:40" },
  { label: "Slot 9", start: "15:40", end: "16:30" },
];

function makeSheetName(tab) {
  const prog = tab.program.split(/[\s(]/)[0].toUpperCase();
  const offering = /flag/i.test(tab.offering) ? "Flag" : "Core";
  const degree = tab.degreeType ? tab.degreeType.replace(/[^A-Za-z]/g, "").substring(0, 5) : "";
  const raw = degree ? `${prog}${tab.batch}-${degree}-${offering}` : `${prog}${tab.batch}-${offering}`;
  return raw.substring(0, 31);
}

function addMinutes(t, mins) {
  const [h, m] = t.split(":").map(Number);
  const total = h * 60 + m + mins;
  return `${String(Math.floor(total / 60)).padStart(2,"0")}:${String(total % 60).padStart(2,"0")}`;
}

function buildSlotsFromConfig(cfg) {
  const { slotsBeforeLunch, slotsAfterLunch, slotDuration, startTime, lunchDuration } = cfg;
  const slots = [];
  let cur = startTime;
  for (let i = 0; i < slotsBeforeLunch; i++) {
    const end = addMinutes(cur, slotDuration);
    slots.push({ label: `Slot ${i + 1}`, start: cur, end });
    cur = end;
  }
  const lunchEnd = addMinutes(cur, lunchDuration);
  slots.push({ label: "Lunch", start: cur, end: lunchEnd, isLunch: true });
  cur = lunchEnd;
  for (let i = 0; i < slotsAfterLunch; i++) {
    const end = addMinutes(cur, slotDuration);
    slots.push({ label: `Slot ${slotsBeforeLunch + 1 + i}`, start: cur, end });
    cur = end;
  }
  return slots;
}

const DEFAULT_TPL_CFG = { slotsBeforeLunch: 5, slotsAfterLunch: 4, slotDuration: 50, startTime: "08:30", lunchDuration: 30, slotsOverride: null };

function getEffectiveSlots(cfg) {
  return cfg.slotsOverride || buildSlotsFromConfig(cfg);
}

function generateTimetableTemplate(tabs, campusName, getSlots, facultyList = []) {
  if (typeof XLSX === "undefined") {
    alert("XLSX library is still loading — please try again in a moment.");
    return;
  }
  const facultyById = new Map(facultyList.map(f => [String(f.id), (f.name || "").trim()]));
  const wb = XLSX.utils.book_new();
  const year = new Date().getFullYear();
  const validTabs = tabs.filter((t) => t.termDefined && t.rows.length > 0);
  const DAY_NAMES = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];

  /* Index sheet */
  const indexRows = [
    [campusName],
    [`Timetable — ${year}  |  One sheet per batch`],
    ["How to use:"],
    ["1. Open the sheet for your batch (e.g. BBA2025-Core)"],
    ["2. Each row = a weekday + section.  Each column = a time slot."],
    ["3. Type the subject name in the cell where that class is scheduled."],
    ["4. Greyed rows = non-working days (leave blank)."],
    ["5. Refer to the Subject Reference table at the bottom of each sheet for the full subject list."],
    [],
    ["Sheet", "Program", "Batch", "Offering", "Subjects", "Sections", "Term"],
  ];
  for (const tab of validTabs) {
    const name = makeSheetName(tab);
    const uniqueSubjs = [...new Map(tab.rows.map((r) => [r.subjectId, r])).values()];
    const uniqueSecs  = [...new Set(tab.rows.map((r) => r.sections[0] || "A"))];
    const termStr = tab.term ? `Sem ${tab.term.label?.match(/\d+/)?.[0] || 1}  ${tab.term.startDate} → ${tab.term.endDate}` : "";
    indexRows.push([name, tab.program, tab.batch, tab.offering, uniqueSubjs.length, uniqueSecs.length, termStr]);
  }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(indexRows), "Index");

  /* One sheet per program-batch-offering */
  for (const tab of validTabs) {
    const sheetName = makeSheetName(tab);
    const dateRange = tab.term ? `${tab.term.startDate} → ${tab.term.endDate}` : "";
    const slotMin   = tab.term?.slotMinutes || 60;

    const tabSlots = getSlots ? getSlots(tab) : STANDARD_SLOTS;
    const row0 = [`${tab.program} — Batch ${tab.batch} · ${tab.offering}   |   ${dateRange}   |   Slot = ${slotMin} min`];
    const row1 = ["Day", "Section", ...tabSlots.map((s) => s.label)];
    const row2 = ["", "",           ...tabSlots.map((s) => `${s.start}–${s.end}`)];

    /* Timetable grid rows */
    const wDays = (tab.term?.workingDays || [0, 1, 2, 3, 4, 5]).map((i) => DAY_NAMES[i]);
    const allSecs = [...new Set(tab.rows.map((r) => r.sections[0] || "A"))].sort();
    const secLabels = allSecs.length === 1 ? ["All"] : allSecs.map((s) => `Sec ${s}`);
    const gridRows = [];
    for (const day of wDays) {
      for (let i = 0; i < secLabels.length; i++) {
        gridRows.push([i === 0 ? day : null, secLabels[i], ...tabSlots.map(() => null)]);
      }
    }

    /* Subject Reference table */
    const uniqueSubjs = [...new Map(tab.rows.map((r) => [r.subjectId, r])).values()];
    const refRows = [
      [],
      ["  Subject Reference — enter subject names in the timetable grid above"],
      ["#", "Subject name", "Type", "Primary Faculty", "Co-Faculty", "Section(s)"],
      ...uniqueSubjs.map((row, i) => {
        const secLabel = tab.rows.filter((r) => r.subjectId === row.subjectId).map((r) => r.sections[0] || "A").join("/");
        const primaryFaculty   = row.facultyId          ? (facultyById.get(String(row.facultyId))          || "") : "";
        const secondaryFaculty = row.secondaryFacultyId ? (facultyById.get(String(row.secondaryFacultyId)) || "") : "";
        return [i + 1, row.subject, row.isLab ? "Lab" : (row.subjectType === "core" ? "Core" : row.subjectType || "Core"), primaryFaculty, secondaryFaculty, secLabel];
      }),
    ];

    const ws = XLSX.utils.aoa_to_sheet([row0, row1, row2, ...gridRows, ...refRows]);
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  }

  XLSX.writeFile(wb, `Timetable_Template_${campusName.replace(/[^A-Za-z0-9]/g, "_")}_${year}.xlsx`);
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   IMPORT VALIDATION
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function findMatchingTab(sheetData, tabs) {
  return tabs.find((tab) => {
    if (!sheetData.meta || !tab.termDefined) return false;
    const { program, batch, offering } = sheetData.meta;
    if (batch !== tab.batch) return false;
    const offerOk =
      offering.toLowerCase() === tab.offering.toLowerCase() ||
      (/flag/i.test(offering) && /flag/i.test(tab.offering));
    if (!offerOk) return false;
    const shortProg = program.split(/[\s(]/)[0].toUpperCase();
    return tab.program.toUpperCase().startsWith(shortProg);
  }) || null;
}

function validateImportData(parsed, tabs, facultyList) {
  const issues = [];

  for (const [sheetName, data] of Object.entries(parsed)) {
    const tab = findMatchingTab(data, tabs);

    /* Sheet not matched to any program in the system */
    if (!tab) {
      if (data.meta) {
        issues.push({
          type: "warning", category: "sheet_unmatched", sheet: sheetName,
          message: `Sheet not matched: ${sheetName}`,
          detail: `"${data.meta.program} ${data.meta.batch} · ${data.meta.offering}" has no corresponding program in this campus.`,
        });
      }
      continue;
    }

    const tabNormNames = new Set(tab.rows.map((r) => normSubjectName(r.subject)));

    /* Subject name mismatch — reference table entry doesn't match any system subject */
    for (const [normName, ref] of Object.entries(data.facultyMap)) {
      if (!tabNormNames.has(normName)) {
        issues.push({
          type: "error", category: "subject_mismatch", sheet: sheetName,
          message: `Subject mismatch — "${ref.originalName}"`,
          detail: `Not found in ${tab.program} ${tab.batch} · ${tab.offering}. The subject name may differ from what's configured in Academic Management.`,
        });
      }
    }

    /* Subject in timetable grid not in reference table (no faculty info) */
    const refNormNames = new Set(Object.keys(data.facultyMap));
    const timetableSubjects = new Set(data.timetableEntries.map((e) => normSubjectName(e.subject)));
    for (const normName of timetableSubjects) {
      if (!refNormNames.has(normName)) {
        const raw = data.timetableEntries.find((e) => normSubjectName(e.subject) === normName)?.subject || normName;
        issues.push({
          type: "warning", category: "missing_reference", sheet: sheetName,
          message: `No reference entry — "${raw}"`,
          detail: `Appears in the timetable grid but not in the Subject Reference table. Faculty cannot be determined.`,
        });
      }
    }

    /* Faculty not aligned — name in Excel doesn't match any faculty in system */
    for (const [normName, ref] of Object.entries(data.facultyMap)) {
      if (!ref.faculty) continue;
      const fid = matchFacultyByName(ref.faculty, facultyList);
      if (!fid) {
        issues.push({
          type: "warning", category: "faculty_unmatched", sheet: sheetName,
          message: `Faculty not found — "${ref.faculty}"`,
          detail: `Assigned to "${ref.originalName}" in ${tab.program} ${tab.batch}. The name may not match what's in the faculty directory.`,
        });
      }
    }

    /* Slot overlap — same section scheduled twice at the same day + time */
    const slotMap = {};
    for (const e of data.timetableEntries) {
      const key = `${e.day}||${e.section}||${e.startTime}`;
      if (!slotMap[key]) slotMap[key] = [];
      slotMap[key].push(e.subject);
    }
    for (const [key, subjects] of Object.entries(slotMap)) {
      if (subjects.length > 1) {
        const [day, section, time] = key.split("||");
        const unique = [...new Set(subjects)];
        issues.push({
          type: "error", category: "slot_overlap", sheet: sheetName,
          message: `Slot overlap — ${day} ${section} at ${time}`,
          detail: `${unique.join(", ")} are all scheduled in the same slot. Only the first will be used.`,
        });
      }
    }
  }

  /* Sort: errors first, then warnings */
  return issues.sort((a, b) => (a.type === "error" ? -1 : 1) - (b.type === "error" ? -1 : 1));
}

function computeModifyDiff(parsed, tabs) {
  const results = [];
  for (const tab of tabs) {
    if (!tab.termDefined || tab.rows.length === 0) continue;
    const sheetData = Object.values(parsed).find(s => {
      if (!s.meta) return false;
      const { program, batch, offering } = s.meta;
      if (batch !== tab.batch) return false;
      const offerOk = offering.toLowerCase() === tab.offering.toLowerCase() || (/flag/i.test(offering) && /flag/i.test(tab.offering));
      if (!offerOk) return false;
      return tab.program.toUpperCase().startsWith(program.split(/[\s(]/)[0].toUpperCase());
    });
    if (!sheetData) continue;

    // Build new schedule map aggregated by subject+section
    const rawMap = {};
    for (const e of sheetData.timetableEntries) {
      const key = `${normSubjectName(e.subject)}||${e.section}||${e.startTime}`;
      if (!rawMap[key]) rawMap[key] = { days: [], startTime: e.startTime, endTime: e.endTime, subject: e.subject, section: e.section };
      const dIdx = DAY_TO_IDX[e.day];
      if (dIdx !== undefined && !rawMap[key].days.includes(dIdx)) rawMap[key].days.push(dIdx);
    }
    // Index by subjectNorm||sectionVariant for fast lookup
    const newByKey = {};
    for (const entry of Object.values(rawMap)) {
      const secRaw = entry.section;
      const secStripped = secRaw.replace(/^Sec\s*/i, "").trim();
      for (const sv of [secRaw.toLowerCase(), secStripped.toLowerCase(), "all"]) {
        const k = `${normSubjectName(entry.subject)}||${sv}`;
        if (!newByKey[k]) newByKey[k] = { ...entry, days: [...entry.days].sort() };
      }
    }

    const changes = [];
    for (const row of tab.rows) {
      const sec = row.sections[0] || "A";
      let newEntry = null;
      for (const sv of [sec.toLowerCase(), `sec ${sec.toLowerCase()}`, "all"]) {
        const k = `${normSubjectName(row.subject)}||${sv}`;
        if (newByKey[k]) { newEntry = newByKey[k]; break; }
      }
      if (!newEntry) continue;

      const hasOld = !!(row.startTime || (row.days && row.days.length > 0));
      const oldDaysStr = (row.days || []).slice().sort().join(",");
      const newDaysStr = (newEntry.days || []).sort().join(",");
      const timeChanged = row.startTime !== newEntry.startTime || row.endTime !== newEntry.endTime;
      const daysChanged = oldDaysStr !== newDaysStr;
      const isNew = !hasOld;

      if (!isNew && !timeChanged && !daysChanged) continue;

      changes.push({
        subject: row.subject,
        section: sec,
        type: isNew ? "new" : "modified",
        old: hasOld ? { days: row.days || [], startTime: row.startTime, endTime: row.endTime } : null,
        next: { days: newEntry.days || [], startTime: newEntry.startTime, endTime: newEntry.endTime },
      });
    }

    if (changes.length > 0) {
      results.push({
        tab,
        changes,
        modifiedCount: changes.filter(c => c.type === "modified").length,
        newCount:      changes.filter(c => c.type === "new").length,
      });
    }
  }
  return results;
}

function ModifyDiffView({ parsed, tabs }) {
  const diffs = React.useMemo(() => computeModifyDiff(parsed, tabs), [parsed]);
  const [expanded, setExpanded] = React.useState(() =>
    diffs.length === 1 ? { [diffs[0].tab.id]: true } : {}
  );

  if (diffs.length === 0) return (
    <div className="alert alert-info" style={{ padding: "8px 14px" }}>
      <div className="alert-title" style={{ fontSize: 12 }}>No changes detected — uploaded timetable matches the current schedule.</div>
    </div>
  );

  const totalChanges = diffs.reduce((s, d) => s + d.changes.length, 0);

  return (
    <div>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 8 }}>
        <span className="tpl-section-label">Changes Preview</span>
        <span style={{ fontSize: 12, color: "var(--color-neutral-dark-2)" }}>
          {totalChanges} change{totalChanges !== 1 ? "s" : ""} across {diffs.length} batch{diffs.length !== 1 ? "es" : ""}
        </span>
      </div>
      <div className="diff-batch-wrap">
        {diffs.map(({ tab, changes, modifiedCount, newCount }) => {
          const isOpen = !!expanded[tab.id];
          const label = `${tab.program} · ${tab.batch}${tab.offering ? ` — ${tab.offering}` : ""}`;
          return (
            <div key={tab.id} className="diff-batch-item">
              <div className="diff-batch-header" onClick={() => setExpanded(e => ({ ...e, [tab.id]: !e[tab.id] }))}>
                <span style={{ fontSize: 13, fontWeight: 600, color: "var(--color-neutral-dark-1)" }}>{label}</span>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  {modifiedCount > 0 && <span className="tag-small tag-warning" style={{ fontSize: 10 }}>{modifiedCount} modified</span>}
                  {newCount > 0      && <span className="tag-small tag-success" style={{ fontSize: 10 }}>{newCount} new</span>}
                  <ChevronRight size={14} style={{ transform: isOpen ? "rotate(90deg)" : "none", transition: "transform 0.2s" }} />
                </div>
              </div>
              {isOpen && (
                <div className="diff-batch-body">
                  <table className="diff-table">
                    <thead>
                      <tr><th>Subject</th><th>Sec</th><th>Change</th><th>Before</th><th>After</th></tr>
                    </thead>
                    <tbody>
                      {changes.map((c, i) => (
                        <tr key={i} className={`diff-row-${c.type}`}>
                          <td className="diff-subject">{c.subject}</td>
                          <td className="diff-sec">{c.section}</td>
                          <td>
                            <span className={`tag-small ${c.type === "new" ? "tag-success" : "tag-warning"}`} style={{ fontSize: 10 }}>
                              {c.type === "new" ? "New" : "Modified"}
                            </span>
                          </td>
                          <td className="diff-old">
                            {c.old ? (
                              <>
                                <div>{c.old.startTime}–{c.old.endTime}</div>
                                {c.old.days.length > 0 && <div style={{ fontSize: 11 }}>{c.old.days.map(d => DAY_LABELS[d]?.slice(0,3) || "").join(", ")}</div>}
                              </>
                            ) : "—"}
                          </td>
                          <td className="diff-new">
                            <div>{c.next.startTime}–{c.next.endTime}</div>
                            {c.next.days.length > 0 && <div style={{ fontSize: 11 }}>{c.next.days.map(d => DAY_LABELS[d]?.slice(0,3) || "").join(", ")}</div>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function tomorrow() {
  const d = new Date(); d.setDate(d.getDate() + 1);
  return d.toISOString().slice(0, 10);
}

function ImportStep({ onImport, onSkip, tabs, facultyList, campusName = "Campus", onParsedChange, onModeChange, onEffectiveDateChange, onDownloadTemplate }) {
  const [importMode, setImportMode]       = useState("fresh"); // "fresh" | "modify"
  const [dragging, setDragging]           = useState(false);
  const [parsed, setParsed]               = useState(null);
  const [issues, setIssues]               = useState([]);
  const [error, setError]                 = useState("");
  const [loading, setLoading]             = useState(false);
  const [effectiveDateType, setEffectiveDateType] = useState("tomorrow"); // "tomorrow" | "custom"
  const [customDate, setCustomDate]       = useState(tomorrow());
  const fileInputRef                      = useRef(null);

  const effectiveDate = effectiveDateType === "tomorrow" ? tomorrow() : customDate;

  useEffect(() => { onParsedChange?.(parsed); }, [parsed]);
  useEffect(() => { onModeChange?.(importMode); }, [importMode]);
  useEffect(() => { onEffectiveDateChange?.(effectiveDate); }, [effectiveDate]);

  const selectMode = (mode) => {
    if (mode !== importMode) { setParsed(null); setIssues([]); setError(""); setEffectiveDateType("tomorrow"); setCustomDate(tomorrow()); }
    setImportMode(mode);
  };

  const handleFile = (file) => {
    if (!file) return;
    if (!/\.(xlsx|xls)$/i.test(file.name)) { setError("Please upload an .xlsx or .xls file."); return; }
    setLoading(true); setError(""); setParsed(null); setIssues([]);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: "array" });
        const result = parseXlsxTimetable(wb);
        setParsed(result);
        setIssues(validateImportData(result, tabs, facultyList));
      } catch (err) { setError("Could not parse: " + err.message); }
      setLoading(false);
    };
    reader.readAsArrayBuffer(file);
  };

  const summary = parsed
    ? Object.entries(parsed).map(([sheet, data]) => ({
        sheet, meta: data.meta,
        subjects: Object.keys(data.facultyMap).length,
        entries: data.timetableEntries.length,
      }))
    : [];
  const totalEntries  = summary.reduce((s, x) => s + x.entries, 0);
  const totalSubjects = summary.reduce((s, x) => s + x.subjects, 0);
  const errorCount    = issues.filter((i) => i.type === "error").length;
  const warnCount     = issues.filter((i) => i.type === "warning").length;

  return (
    <div className="import-step">
      {!parsed && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "#f8f9fa", border: "1px solid #e2e8f0", borderRadius: 8, padding: "10px 14px" }}>
          <div>
            <div style={{ fontSize: 13, fontWeight: 600, color: "var(--color-neutral-dark-1)" }}>Download Timetable Template</div>
            <div style={{ fontSize: 12, color: "var(--color-neutral-dark-2)", marginTop: 2 }}>Pre-filled with subjects — configure slot timings before downloading</div>
          </div>
          <button className="btn-medium btn-secondary-light" style={{ flexShrink: 0 }} onClick={onDownloadTemplate}>
            <Download size={14} /> Download
          </button>
        </div>
      )}

      {/* Mode selector */}
      <div>
        <div className="tpl-section-label" style={{ marginBottom: 8 }}>What are you importing?</div>
        <div className="import-mode-grid">
          <div className={`import-mode-card${importMode === "fresh" ? " selected" : ""}`} onClick={() => selectMode("fresh")}>
            <div className="import-mode-icon"><FileSpreadsheet size={18} /></div>
            <div className="import-mode-title">Fresh Timetable</div>
            <div className="import-mode-desc">Upload a brand new timetable for your programs — populates all sessions from scratch.</div>
          </div>
          <div className={`import-mode-card${importMode === "modify" ? " selected" : ""}`} onClick={() => selectMode("modify")}>
            <div className="import-mode-icon"><Edit3 size={18} /></div>
            <div className="import-mode-title">Modify Timetable</div>
            <div className="import-mode-desc">New entries and time slot changes will be updated program-wise as per the uploaded file.</div>
          </div>
        </div>
      </div>

      {!parsed ? (
        <div
          className={`import-dropzone${dragging ? " drag-over" : ""}`}
          onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
          onDragLeave={() => setDragging(false)}
          onDrop={(e) => { e.preventDefault(); setDragging(false); handleFile(e.dataTransfer.files[0]); }}
          onClick={() => !loading && fileInputRef.current?.click()}
        >
          <input ref={fileInputRef} type="file" accept=".xlsx,.xls" style={{ display: "none" }}
            onChange={(e) => handleFile(e.target.files[0])} />
          <div className="import-dropzone-icon">
            {loading ? <Loader2 size={22} className="spin" /> : <Upload size={22} />}
          </div>
          <div className="import-dropzone-title">
            {loading ? "Parsing file…" : "Click or drag your .xlsx here"}
          </div>
          {error && <div style={{ marginTop: 10, color: "var(--color-error-2)", fontSize: 13 }}>{error}</div>}
        </div>
      ) : (
        <>
          <div className={`alert ${errorCount > 0 ? "alert-warning" : "alert-success"}`}>
            <div className="alert-title">
              {summary.length} sheet{summary.length !== 1 ? "s" : ""} parsed
              {issues.length > 0 && ` · ${errorCount > 0 ? `${errorCount} error${errorCount > 1 ? "s" : ""}` : ""}${errorCount > 0 && warnCount > 0 ? ", " : ""}${warnCount > 0 ? `${warnCount} warning${warnCount > 1 ? "s" : ""}` : ""}`}
            </div>
            <div className="alert-description">
              {totalEntries > 0 ? `${totalEntries} slot entries` : "Template is blank — no slot entries"}{totalSubjects > 0 ? `, ${totalSubjects} subjects with faculty` : ""}.
            </div>
          </div>

          <table className="import-summary-table">
            <thead>
              <tr>
                <th>Sheet</th><th>Program · Batch</th><th>Offering</th><th>Subjects</th><th>Slot entries</th>
              </tr>
            </thead>
            <tbody>
              {summary.map((s) => (
                <tr key={s.sheet}>
                  <td><code style={{ fontSize: 11, background: "var(--color-primary-3)", padding: "2px 6px", borderRadius: 3 }}>{s.sheet}</code></td>
                  <td>{s.meta ? `${s.meta.program} · ${s.meta.batch}` : <span style={{ color: "var(--color-neutral-dark-3)" }}>—</span>}</td>
                  <td>{s.meta?.offering || "—"}</td>
                  <td>{s.subjects}</td>
                  <td>{s.entries > 0
                    ? <span className="tag-small tag-success">{s.entries} filled</span>
                    : <span className="tag-small tag-warning">blank</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>

          {issues.length > 0 && (
            <div>
              <div className="import-issues-header">
                {errorCount > 0 && <span style={{ color: "var(--color-error-2)" }}>{errorCount} Error{errorCount > 1 ? "s" : ""}</span>}
                {errorCount > 0 && warnCount > 0 && <span style={{ color: "var(--color-neutral-dark-3)", margin: "0 6px" }}>·</span>}
                {warnCount > 0 && <span style={{ color: "var(--color-warning-2)" }}>{warnCount} Warning{warnCount > 1 ? "s" : ""}</span>}
              </div>
              <div className="import-issues">
                {issues.map((issue, idx) => (
                  <div key={idx} className={`import-issue import-issue-${issue.type}`}>
                    <div className="import-issue-icon">
                      {issue.type === "error"
                        ? <AlertCircle size={13} color="var(--color-error-2)" />
                        : <Info size={13} color="var(--color-warning-2)" />}
                    </div>
                    <div>
                      <div className="import-issue-msg">{issue.message}</div>
                      {issue.detail && <div className="import-issue-detail">{issue.detail}</div>}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {issues.length === 0 && (
            <div className="alert alert-success" style={{ padding: "8px 14px" }}>
              <div className="alert-title" style={{ fontSize: 12 }}>All subjects and faculty matched — no issues found</div>
            </div>
          )}

          {importMode === "modify" && (
            <div style={{ background: "#f8f9fa", border: "1px solid #e2e8f0", borderRadius: 8, padding: "12px 14px" }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: "#374151", marginBottom: 8 }}>Effective from</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", fontSize: 13 }}>
                  <input type="radio" name="effectiveDateType" value="tomorrow"
                    checked={effectiveDateType === "tomorrow"}
                    onChange={() => setEffectiveDateType("tomorrow")}
                    style={{ accentColor: "#4f46e5" }} />
                  <span>Tomorrow <span style={{ color: "#6b7280", fontSize: 12 }}>({tomorrow()})</span></span>
                </label>
                <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", fontSize: 13 }}>
                  <input type="radio" name="effectiveDateType" value="custom"
                    checked={effectiveDateType === "custom"}
                    onChange={() => setEffectiveDateType("custom")}
                    style={{ accentColor: "#4f46e5" }} />
                  <span>Choose a date</span>
                  {effectiveDateType === "custom" && (
                    <input type="date" value={customDate} min={tomorrow()}
                      onChange={e => setCustomDate(e.target.value)}
                      style={{ fontSize: 12, padding: "3px 8px", border: "1px solid #d1d5db", borderRadius: 6, color: "#1f2937" }} />
                  )}
                </label>
              </div>
            </div>
          )}

          {importMode === "modify" && (
            <ModifyDiffView parsed={parsed} tabs={tabs} />
          )}
        </>
      )}

    </div>
  );
}

function CfgFields({ cfg, onChange }) {
  const setGlobal = (k, v) => onChange({ ...cfg, [k]: v, slotsOverride: null });
  const slots = getEffectiveSlots(cfg);
  const hasOverride = !!cfg.slotsOverride;

  const editSlot = (idx, field, val) => {
    const base = cfg.slotsOverride || buildSlotsFromConfig(cfg);
    const updated = base.map((s, i) => i === idx ? { ...s, [field]: val } : s);
    onChange({ ...cfg, slotsOverride: updated });
  };

  return (
    <>
      <div className="tpl-cfg-grid">
        <div className="tpl-cfg-field">
          <span className="field-label">Day Start Time</span>
          <input type="time" className="text-input" value={cfg.startTime} onChange={e => setGlobal("startTime", e.target.value)} />
        </div>
        <div className="tpl-cfg-field">
          <span className="field-label">Slot Duration</span>
          <select className="tpl-cfg-select" value={cfg.slotDuration} onChange={e => setGlobal("slotDuration", Number(e.target.value))}>
            {[40,45,50,55,60,75,90].map(m => <option key={m} value={m}>{m} min</option>)}
          </select>
        </div>
        <div className="tpl-cfg-field">
          <span className="field-label">Lunch Duration</span>
          <select className="tpl-cfg-select" value={cfg.lunchDuration} onChange={e => setGlobal("lunchDuration", Number(e.target.value))}>
            {[20,25,30,35,40,45,60].map(m => <option key={m} value={m}>{m} min</option>)}
          </select>
        </div>
        <div className="tpl-cfg-field">
          <span className="field-label">Slots Before Lunch</span>
          <select className="tpl-cfg-select" value={cfg.slotsBeforeLunch} onChange={e => setGlobal("slotsBeforeLunch", Number(e.target.value))}>
            {[1,2,3,4,5,6,7,8].map(n => <option key={n} value={n}>{n}</option>)}
          </select>
        </div>
        <div className="tpl-cfg-field">
          <span className="field-label">Slots After Lunch</span>
          <select className="tpl-cfg-select" value={cfg.slotsAfterLunch} onChange={e => setGlobal("slotsAfterLunch", Number(e.target.value))}>
            {[1,2,3,4,5,6].map(n => <option key={n} value={n}>{n}</option>)}
          </select>
        </div>
      </div>

      <div style={{ marginTop: 12 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
          <span className="tpl-section-label">Slot Timings</span>
          {hasOverride && (
            <button
              className="btn-text-14"
              style={{ fontSize: 11, color: "var(--color-neutral-dark-2)" }}
              onClick={() => onChange({ ...cfg, slotsOverride: null })}
            >
              Reset to auto
            </button>
          )}
        </div>
        <table className="tpl-slot-table">
          <thead>
            <tr>
              <th>Slot</th>
              <th>Start</th>
              <th>End</th>
            </tr>
          </thead>
          <tbody>
            {slots.map((s, i) => (
              <tr key={i} className={s.isLunch ? "is-lunch" : ""}>
                <td className="tpl-slot-label">{s.label}</td>
                <td>
                  <input
                    type="time"
                    className="tpl-slot-time-input"
                    value={s.start}
                    onChange={e => editSlot(i, "start", e.target.value)}
                  />
                </td>
                <td>
                  <input
                    type="time"
                    className="tpl-slot-time-input"
                    value={s.end}
                    onChange={e => editSlot(i, "end", e.target.value)}
                  />
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </>
  );
}

function TemplateConfigModal({ tabs, campusName, facultyList, onClose }) {
  const validTabs = tabs.filter(t => t.termDefined && t.rows.length > 0);
  const [globalCfg, setGlobalCfg] = useState({ ...DEFAULT_TPL_CFG });
  const [programCfgs, setProgramCfgs] = useState({});
  const [expanded, setExpanded] = useState({});

  const isCustom = (tabId) => !!programCfgs[tabId];
  const getProgramCfg = (tabId) => programCfgs[tabId] || { ...globalCfg, slotsOverride: null };
  const customCount = Object.keys(programCfgs).length;

  const handleDownload = () => {
    const getSlots = (tab) => getEffectiveSlots(isCustom(tab.id) ? programCfgs[tab.id] : globalCfg);
    generateTimetableTemplate(tabs, campusName, getSlots, facultyList);
    onClose();
  };

  return (
    <div className="tpl-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="tpl-modal">
        <div className="tpl-modal-header">
          <div className="tpl-modal-title">Configure Timetable Template</div>
          <button className="btn-square-small" onClick={onClose} aria-label="Close"><X size={18} /></button>
        </div>
        <div className="tpl-modal-body">

          {/* Global settings */}
          <div>
            <div style={{ marginBottom: 12 }}>
              <div className="tpl-section-label" style={{ marginBottom: 3 }}>Global Settings</div>
              <div style={{ fontSize: 12, color: "var(--color-neutral-dark-2)" }}>Applies to all programs — override individually below if needed.</div>
            </div>
            <CfgFields cfg={globalCfg} onChange={setGlobalCfg} />
          </div>

          {/* Per-program overrides */}
          {validTabs.length > 0 && (
            <div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                <div>
                  <div className="tpl-section-label" style={{ marginBottom: 2 }}>Program Overrides</div>
                  <div style={{ fontSize: 12, color: "var(--color-neutral-dark-2)" }}>
                    {customCount === 0 ? "All programs use global settings" : `${customCount} program${customCount > 1 ? "s" : ""} with custom settings`}
                  </div>
                </div>
                {customCount > 0 && (
                  <button className="btn-text-14" style={{ fontSize: 11, color: "var(--color-neutral-dark-2)" }}
                    onClick={() => setProgramCfgs({})}>
                    Reset all
                  </button>
                )}
              </div>
              <div className="tpl-program-list">
                {validTabs.map(tab => {
                  const custom = isCustom(tab.id);
                  const isOpen = !!expanded[tab.id];
                  const cfg = getProgramCfg(tab.id);
                  const label = `${tab.program} · ${tab.batch}${tab.offering ? ` — ${tab.offering}` : ""}`;
                  return (
                    <div key={tab.id} className={`tpl-program-item${custom ? " is-custom" : ""}`}>
                      <div className="tpl-program-header" onClick={() => setExpanded(e => ({ ...e, [tab.id]: !e[tab.id] }))}>
                        <span>{label}</span>
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <span className={`tag-small ${custom ? "tag-info" : "tag-neutral"}`} style={{ fontSize: 10 }}>
                            {custom ? "Custom" : "Global"}
                          </span>
                          <ChevronRight size={14} style={{ transform: isOpen ? "rotate(90deg)" : "none", transition: "transform 0.2s" }} />
                        </div>
                      </div>
                      {isOpen && (
                        <div className="tpl-program-body">
                          {custom && (
                            <div style={{ display: "flex", justifyContent: "flex-end" }}>
                              <button className="btn-text-14" style={{ fontSize: 11, color: "var(--color-neutral-dark-2)" }}
                                onClick={() => setProgramCfgs(pc => { const n = { ...pc }; delete n[tab.id]; return n; })}>
                                Reset to global
                              </button>
                            </div>
                          )}
                          {!custom && (
                            <div className="alert alert-info" style={{ padding: "7px 12px" }}>
                              <div className="alert-title" style={{ fontSize: 11 }}>Using global settings — any change here will create a custom override for this program only.</div>
                            </div>
                          )}
                          <CfgFields
                            cfg={cfg}
                            onChange={newCfg => setProgramCfgs(pc => ({ ...pc, [tab.id]: newCfg }))}
                          />
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
        <div className="tpl-modal-footer">
          <button className="btn-medium btn-secondary-light" onClick={onClose}>Cancel</button>
          <button className="btn-medium btn-primary-light" onClick={handleDownload}>
            <Download size={14} /> Generate &amp; Download
          </button>
        </div>
      </div>
    </div>
  );
}

/**
 * Get faculty for a specific subject × section combination from PUSSM.
 */
function getFacultyForRow(campusId, subjectId, sectionId) {
  const secMap = PUSSM[subjectId];
  const campusFaculty = getFacultyForCampus(campusId);
  if (!secMap) return campusFaculty;
  const ids = secMap[sectionId];
  if (!ids || ids.length === 0) return campusFaculty;
  const result = [];
  const seen = new Set();
  for (const fid of ids) {
    if (seen.has(fid)) continue;
    seen.add(fid);
    const f = ALL_FACULTY[fid] || campusFaculty.find((x) => x.id === fid);
    if (f) result.push({ id: f.id, name: (f.name || "").trim() || `Faculty ${f.id}` });
  }
  return result.length > 0 ? result : campusFaculty;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TAB BUILDER
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function buildTabsForCampus(campusId) {
  const campus = CAMPUS_DATA.campuses.find((c) => c.id === campusId);
  if (!campus) return [];

  const builtTabs = campus.programs.map((p) => {
    const degreeType = p.degree || null;
    const baseId = `${p.pcbm_id}`;
    const tabLabel = `${p.program} ${p.batch}${degreeType ? " · " + degreeType : ""} · ${p.offering}`;

    const TODAY = new Date().toISOString().slice(0, 10);
    const termsWithSubjects = (p.terms || []).filter((t) => (t.subjects || []).length > 0);
    const futureTerm =
      termsWithSubjects.find((t) => t.end_date && t.end_date >= TODAY) ||
      (p.terms || []).find((t) => t.end_date && t.end_date >= TODAY) ||
      termsWithSubjects.sort((a, b) => (b.number || 0) - (a.number || 0))[0];
    const activeTerm = futureTerm;

    const sortedTerms = (p.terms || []).filter((t) => t.number != null).sort((a, b) => (a.number || 0) - (b.number || 0));
    const hasTrueFuture = sortedTerms.some((t) => t.end_date && t.end_date >= TODAY);
    const maxNumber = sortedTerms.length ? sortedTerms[sortedTerms.length - 1].number : null;
    const allTerms = sortedTerms.map((t) => {
        const typeLabel = t.type === "trimester" ? "Trimester" : "Semester";
        const isFallbackUpcoming = !hasTrueFuture && t.number === maxNumber;
        const status = isFallbackUpcoming ? "Upcoming"
          : !t.end_date ? "Upcoming"
          : t.end_date < TODAY ? "Past"
          : (!t.start_date || t.start_date > TODAY) ? "Upcoming"
          : "Current";
        const wDays = (t.working_days || [])
          .map((d) => DAY_NAME_TO_INDEX[d.toLowerCase()])
          .filter((i) => i !== undefined)
          .sort();
        return {
          number: t.number,
          label: `${typeLabel} ${t.number} — ${status}`,
          startDate: t.start_date || "",
          endDate: t.end_date || "",
          slotMinutes: t.slot_duration_minutes || 0,
          workingDays: wDays,
          status,
        };
      });

    if (!activeTerm) {
      return {
        id: baseId,
        program: p.program,
        batch: String(p.batch),
        degreeType,
        offering: p.offering,
        termDefined: false,
        term: null,
        allTerms,
        rows: [],
      };
    }

    const workingDays = (activeTerm.working_days || [])
      .map((d) => DAY_NAME_TO_INDEX[d.toLowerCase()])
      .filter((i) => i !== undefined)
      .sort();

    const termTypeLabel = activeTerm.type === "trimester" ? "Trimester" : "Semester";
    const termLabel = `${termTypeLabel} ${activeTerm.number} — Upcoming`;

    const rows = [];
    for (const subj of activeTerm.subjects) {
      const isPrime = PRIME_SUBJECT_IDS.has(subj.id);
      const specialisationName = subj.specialization_id
        ? (SPECIALIZATION_MAP[subj.specialization_id] || null)
        : null;
      const subjectType = subj.subject_type || "core";
      for (const sec of subj.sections) {
        rows.push(mkRow({
          subjectId: subj.id,
          sectionId: sec.id || null,
          subject: subj.name || "Untitled",
          subjectType,
          specialisation: specialisationName,
          isPrime,
          isLab: !!subj.is_lab,
          numGroups: 2,
          sections: [sec.section || "A"],
          studentCount: sec.students || 0,
          startDate: activeTerm.start_date || "",
          endDate: activeTerm.end_date || "",
          startTime: "",
          endTime: "",
          days: [],
          facultyId: sec.primary_faculty_id ? String(sec.primary_faculty_id) : "",
          secondaryFacultyId: sec.secondary_faculty_id ? String(sec.secondary_faculty_id) : "",
          isPrimeEvent: isPrime,
        }));
      }
    }

    return {
      id: baseId,
      program: p.program,
      batch: String(p.batch),
      degreeType,
      offering: p.offering,
      campusId: campus.id,
      termDefined: true,
      term: {
        label: termLabel,
        startDate: activeTerm.start_date,
        endDate: activeTerm.end_date,
        slotMinutes: activeTerm.slot_duration_minutes || 60,
        workingDays,
      },
      allTerms,
      rows,
    };
  });

  return builtTabs.sort((a, b) => {
    if (a.termDefined === b.termDefined) return 0;
    return a.termDefined ? -1 : 1;
  });
}
