/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   CONFLICT DETECTION
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
/** How many session occurrences fall in [startDate..endDate] on the selected days. */
function countSessions(row) {
  if (!row.startDate || !row.endDate || !row.days?.length) return 0;
  const start = new Date(row.startDate);
  const end   = new Date(row.endDate);
  if (isNaN(start) || isNaN(end) || start > end) return 0;
  const picked = new Set(row.days); // Mon=0 … Sun=6
  let count = 0;
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const ourDay = (d.getDay() + 6) % 7; // JS Sun=0 → our Sun=6
    if (picked.has(ourDay)) count++;
  }
  return count;
}

/** A row is "intended for this submit" iff any of startTime / endTime / days is filled.
    An all-empty-timing row is treated as not-being-scheduled-this-round — no errors,
    and startSubmission will skip it. */
function isRowIntended(row) {
  return !!(row.startTime || row.endTime || (row.days && row.days.length));
}

function detectFieldErrors(row) {
  const errs = [];
  const hasStart = !!row.startTime;
  const hasEnd   = !!row.endTime;
  const hasDays  = !!(row.days && row.days.length);
  const intended = hasStart || hasEnd || hasDays;
  const completeTiming = hasStart && hasEnd && hasDays;

  // Skip entirely if user hasn't engaged with this row's timing.
  if (!intended) return [];

  // All-or-nothing rule for the time triple.
  if (!completeTiming) {
    const msg = "Fill start time, end time, and days together — or clear all three.";
    if (!hasStart) errs.push({ field: "startTime", message: msg });
    if (!hasEnd)   errs.push({ field: "endTime",   message: msg });
    if (!hasDays)  errs.push({ field: "days",      message: msg });
  }
  if (hasStart && hasEnd && row.startTime >= row.endTime) {
    errs.push({ field: "endTime", message: "End time must be after start time." });
  }

  // Other required fields apply only once this row is being scheduled.
  if (!row.subject)   errs.push({ field: "subject",   message: "Subject is required." });
  if (!row.facultyId) errs.push({ field: "facultyId", message: "Primary faculty is required." });
  if (!row.startDate) errs.push({ field: "startDate", message: "Start date is required." });
  if (!row.endDate)   errs.push({ field: "endDate",   message: "End date is required." });

  const seen = new Set();
  return errs.filter((c) => { if (seen.has(c.message)) return false; seen.add(c.message); return true; });
}

function detectSheetConflicts(targetRow, targetTab, allTabs) {
  const conflicts = [];
  const tRow = targetRow;
  const timesOverlap = (a, b) => {
    if (!a.startTime || !a.endTime || !b.startTime || !b.endTime) return false;
    return a.startTime < b.endTime && a.endTime > b.startTime;
  };

  for (const tab of allTabs) {
    for (const r of tab.rows) {
      if (r.id === tRow.id) continue;
      if (!r.startTime || !r.endTime || !r.days?.length) continue;
      if (!tRow.startTime || !tRow.endTime || !tRow.days?.length) continue;
      const overlapDays = r.days.filter((d) => tRow.days.includes(d));
      if (!overlapDays.length) continue;
      if (!timesOverlap(tRow, r)) continue;

      const rowFaculty = [tRow.facultyId, tRow.secondaryFacultyId].filter(Boolean);
      const otherFaculty = [r.facultyId, r.secondaryFacultyId].filter(Boolean);
      const sharedFac = rowFaculty.find((f) => otherFaculty.includes(f));
      if (sharedFac) {
        const fName = (ALL_FACULTY[sharedFac]?.name || String(sharedFac)).trim();
        conflicts.push({
          field: "facultyId",
          message: `${fName} is already scheduled for "${r.subject}" in ${tab.program} ${tab.batch}${tab.degreeType ? " " + tab.degreeType : ""}${tab.offering ? " · " + tab.offering : ""} at an overlapping time.`,
        });
      }

      const sameLabFamily = tRow.groupParentKey && r.groupParentKey && tRow.groupParentKey === r.groupParentKey;
      if (
        !sameLabFamily &&
        tab.program === targetTab.program &&
        tab.batch === targetTab.batch &&
        (tab.degreeType || "") === (targetTab.degreeType || "") &&
        (tab.offering || "") === (targetTab.offering || "")
      ) {
        const sharedSection = (r.sections || []).some((s) => (tRow.sections || []).includes(s));
        if (sharedSection) {
          conflicts.push({
            field: "startTime",
            message: `Section ${(tRow.sections || []).join(", ")} already has "${r.subject}" at an overlapping time on the same day.`,
          });
        }
      }
    }
  }

  const seen = new Set();
  return conflicts.filter((c) => { if (seen.has(c.message)) return false; seen.add(c.message); return true; });
}

function detectRowConflicts(targetRow, targetTab, allTabs) {
  return [...detectFieldErrors(targetRow), ...detectSheetConflicts(targetRow, targetTab, allTabs)];
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   MAIN MODAL COMPONENT
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function BulkScheduleDrawer({ open, onClose, campusId = DEFAULT_CAMPUS_ID, campusName = "Hi-Tech Institute of Technology", openPhase = "import" }) {
  const [tabs, setTabs] = useState(() => buildTabsForCampus(campusId));
  const [activeTabId, setActiveTabId] = useState(() => {
    const first = buildTabsForCampus(campusId)[0];
    return first ? first.id : null;
  });
  const [phase, setPhase] = useState("import");
  const [showTplConfig, setShowTplConfig] = useState(false);
  const [pendingImportData, setPendingImportData] = useState(null);
  const [importParsed, setImportParsed] = useState(null);
  const [importModeState, setImportModeState] = useState("fresh");
  const [importEffectiveDate, setImportEffectiveDate] = useState(null);
  const [importResetKey, setImportResetKey] = useState(0);
  const [tabSchedulingStatus, setTabSchedulingStatus] = useState({});
  const [processingRowId, setProcessingRowId] = useState(null);
  const actionResolverRef = useRef(null);
  const waitForBulkAction = () => new Promise(resolve => { actionResolverRef.current = resolve; });
  const resolveBulkAction = (action) => { actionResolverRef.current?.(action); actionResolverRef.current = null; };
  const [pausedOnErrorRowId, setPausedOnErrorRowId] = useState(null);
  const cancelRef = useRef(false);
  const doneFromImportRef = useRef(false);

  useEffect(() => {
    if (open) setPhase(openPhase);
  }, [open]);

  const [selectedProgram, setSelectedProgram] = useState("");
  const [selectedBatch, setSelectedBatch] = useState("");

  const tabsScrollRef = useRef(null);
  const [canScrollLeft, setCanScrollLeft] = useState(false);
  const [canScrollRight, setCanScrollRight] = useState(false);

  const checkTabsScroll = () => {
    const el = tabsScrollRef.current;
    if (!el) return;
    setCanScrollLeft(el.scrollLeft > 2);
    setCanScrollRight(el.scrollLeft < el.scrollWidth - el.clientWidth - 2);
  };

  const scrollTabsBy = (dir) => {
    const el = tabsScrollRef.current;
    if (!el) return;
    el.scrollBy({ left: dir * 200, behavior: "smooth" });
    setTimeout(checkTabsScroll, 350);
  };

  useEffect(() => {
    const fresh = buildTabsForCampus(campusId);
    setTabs(fresh);
    setActiveTabId(null);
    setSelectedProgram("");
    setSelectedBatch("");
    setPhase("edit");
    setProcessingRowId(null);
    setPausedOnErrorRowId(null);
  }, [campusId]);

  const activeTab = useMemo(() => tabs.find((t) => t.id === activeTabId), [tabs, activeTabId]);

  const tabErrorCounts = useMemo(() => {
    const map = {};
    for (const t of tabs) {
      if (!t.termDefined) { map[t.id] = 0; continue; }
      let c = 0;
      for (const r of t.rows) {
        const hasTouched = Object.keys(r.touched || {}).length > 0;
        const isActivelyBad = r.status === "error";
        if (!hasTouched && !isActivelyBad) continue;
        const errs = detectFieldErrors(r);
        if (errs.length) c += 1;
      }
      map[t.id] = c;
    }
    return map;
  }, [tabs]);

  const uniquePrograms = useMemo(() => [...new Set(tabs.map((t) => t.program))], [tabs]);
  const batchesForProgram = useMemo(() => [...new Set(tabs.filter((t) => t.program === selectedProgram).map((t) => t.batch))], [tabs, selectedProgram]);
  const filteredTabs = useMemo(() => tabs.filter((t) => t.program === selectedProgram && t.batch === selectedBatch), [tabs, selectedProgram, selectedBatch]);

  useEffect(() => {
    setTimeout(checkTabsScroll, 50);
  }, [filteredTabs]);

  const totalRows = useMemo(() => tabs.reduce((s, t) => s + (t.termDefined ? t.rows.length : 0), 0), [tabs]);
  const scheduledRows = useMemo(() => tabs.reduce((s, t) => s + t.rows.filter((r) => r.status === "scheduled").length, 0), [tabs]);
  const hasAnyRows = totalRows > 0;
  const allScheduled = totalRows > 0 && scheduledRows === totalRows;

  const updateRow = (tabId, rowId, patch) => {
    setTabs((prev) =>
      prev.map((t) =>
        t.id !== tabId
          ? t
          : {
              ...t,
              rows: t.rows.map((r) => {
                if (r.id !== rowId) return r;
                const newTouched = { ...(r.touched || {}) };
                for (const k of Object.keys(patch)) newTouched[k] = true;
                return { ...r, ...patch, touched: newTouched, errors: {}, errorMessage: "" };
              }),
            }
      )
    );
  };
  const addGroupToSection = (tabId, rowId) => {
    setTabs((prev) => prev.map((t) => {
      if (t.id !== tabId) return t;
      const idx = t.rows.findIndex((r) => r.id === rowId);
      if (idx === -1) return t;
      const anchor = t.rows[idx];
      if (!anchor.isLab) return t;

      const family = anchor.groupParentKey
        ? t.rows.filter((r) => r.groupParentKey === anchor.groupParentKey)
        : [anchor];
      const parentKey = anchor.groupParentKey || `lab-${anchor.id}`;
      const nextCount = family.length + 1;

      const totalStudents = anchor.groupParentKey
        ? family.reduce((s, r) => s + (r.studentCount || 0), 0)
        : (anchor.studentCount || 0);
      const perGroup = Math.floor(totalStudents / nextCount);
      const remainder = totalStudents - perGroup * nextCount;

      let groupIdx = 0;
      const updatedRows = t.rows.map((r) => {
        const inFamily = anchor.groupParentKey
          ? r.groupParentKey === anchor.groupParentKey
          : r.id === anchor.id;
        if (!inFamily) return r;
        const i = groupIdx++;
        return {
          ...r,
          groupParentKey: parentKey,
          groupLabel: `Group ${i + 1}`,
          numGroups: nextCount,
          splitIntoGroups: true,
          studentCount: perGroup + (i < remainder ? 1 : 0),
        };
      });

      const newGroupIndex = nextCount - 1;
      const newRow = mkRow({
        subject: anchor.subject,
        subjectType: anchor.subjectType,
        specialisation: anchor.specialisation,
        isPrime: anchor.isPrime,
        isLab: true,
        sections: [...anchor.sections],
        studentCount: perGroup + (newGroupIndex < remainder ? 1 : 0),
        startDate: anchor.startDate,
        endDate: anchor.endDate,
        groupParentKey: parentKey,
        groupLabel: `Group ${nextCount}`,
        numGroups: nextCount,
        splitIntoGroups: true,
      });

      const familyIds = new Set(family.map((r) => r.id));
      let lastFamilyIdx = -1;
      updatedRows.forEach((r, i) => {
        if (familyIds.has(r.id) || (anchor.groupParentKey === null && r.id === anchor.id)) {
          lastFamilyIdx = i;
        }
      });
      const insertAt = lastFamilyIdx + 1;
      const nextRows = [...updatedRows.slice(0, insertAt), newRow, ...updatedRows.slice(insertAt)];
      return { ...t, rows: nextRows };
    }));
  };

  const removeGroupFromSection = (tabId, familyParentKey) => {
    setTabs((prev) => prev.map((t) => {
      if (t.id !== tabId) return t;
      const family = t.rows.filter((r) => r.groupParentKey === familyParentKey);
      if (family.length < 2) return t;

      const lastRow = family[family.length - 1];
      const survivors = t.rows.filter((r) => r.id !== lastRow.id);
      const newFamilySize = family.length - 1;

      const totalStudents = family.reduce((s, r) => s + (r.studentCount || 0), 0);
      const perGroup = Math.floor(totalStudents / newFamilySize);
      const remainder = totalStudents - perGroup * newFamilySize;

      let i = 0;
      const rebalanced = survivors.map((r) => {
        if (r.groupParentKey !== familyParentKey) return r;
        const idx = i++;
        if (newFamilySize === 1) {
          return {
            ...r,
            groupParentKey: null,
            groupLabel: null,
            splitIntoGroups: false,
            numGroups: 2,
            studentCount: totalStudents,
          };
        }
        return {
          ...r,
          groupLabel: `Group ${idx + 1}`,
          numGroups: newFamilySize,
          studentCount: perGroup + (idx < remainder ? 1 : 0),
        };
      });

      return { ...t, rows: rebalanced };
    }));
  };

  const ALL_FIELDS_TOUCHED = {
    startDate: true, endDate: true, startTime: true, endTime: true,
    days: true, facultyId: true, subject: true,
  };

  /** Submit ONLY the currently active tab. */
  const startSubmission = async () => {
    const tabId = activeTabId;
    const currentTab = tabsRef.current.find((t) => t.id === tabId);
    if (!currentTab || !currentTab.termDefined || currentTab.rows.length === 0) return;

    // ── Pre-flight: run full conflict + field-error sweep across every intended row.
    // If anything comes back, mark every affected row as error at once and bail —
    // don't start the submit loop. This surfaces all problems upfront instead of
    // pausing midway through.
    const latestTabs = tabsRef.current;
    const intendedRows = currentTab.rows.filter(
      (r) => isRowIntended(r) && r.status !== "scheduled"
    );
    const preflightErrors = new Map(); // rowId -> combined message
    for (const row of intendedRows) {
      const issues = detectRowConflicts(row, currentTab, latestTabs);
      if (issues.length) {
        preflightErrors.set(row.id, issues.map((c) => c.message).join(" "));
      }
    }
    if (preflightErrors.size > 0) {
      setTabs((prev) => prev.map((t) => {
        if (t.id !== tabId) return t;
        return {
          ...t,
          rows: t.rows.map((r) => {
            const msg = preflightErrors.get(r.id);
            if (!msg) {
              // still mark intended rows as touched so field-level errors show
              if (r.status !== "scheduled" && isRowIntended(r)) {
                return { ...r, touched: ALL_FIELDS_TOUCHED };
              }
              return r;
            }
            return {
              ...r,
              status: "error",
              errorMessage: msg,
              touched: ALL_FIELDS_TOUCHED,
            };
          }),
        };
      }));
      return; // phase stays at "edit"
    }

    setPhase("submitting");
    cancelRef.current = false;
    setTabs((prev) =>
      prev.map((t) => {
        if (t.id !== tabId) return t;
        return {
          ...t,
          rows: t.rows.map((r) => {
            if (r.status === "scheduled") return r;
            if (!isRowIntended(r)) return r; // all-empty-timing row: leave untouched
            return {
              ...r,
              status: "pending",
              errorMessage: "",
              touched: ALL_FIELDS_TOUCHED,
            };
          }),
        };
      })
    );

    for (const row of currentTab.rows) {
      if (cancelRef.current) return;
      const current = tabsRef.current.find((t) => t.id === tabId).rows.find((r) => r.id === row.id);
      if (!current || current.status === "scheduled") continue;
      if (!isRowIntended(current)) continue; // skip rows with no timing

      setProcessingRowId(row.id);

      const isGroupRow = !!row.groupParentKey;
      if (isGroupRow) {
        updateRowStatus(tabId, row.id, "creating");
        await wait(450);
      }

      updateRowStatus(tabId, row.id, "processing");
      await wait(550);

      const latestTabs = tabsRef.current;
      const latestTab = latestTabs.find((t) => t.id === tabId);
      const latestRow = latestTab.rows.find((r) => r.id === row.id);
      const conflicts = detectRowConflicts(latestRow, latestTab, latestTabs);

      if (conflicts.length) {
        const msg = conflicts.map((c) => c.message).join(" ");
        updateRowStatus(tabId, row.id, "error", msg);
        setPausedOnErrorRowId(row.id);
        setProcessingRowId(null);
        setPhase("edit");
        return;
      }

      updateRowStatus(tabId, row.id, "scheduled");
      await wait(180);
    }
    setProcessingRowId(null);

    // All tabs with a term now fully scheduled? Only then show the done screen.
    const latest = tabsRef.current;
    const everythingDone = latest.every((t) =>
      !t.termDefined || t.rows.length === 0 || t.rows.every((r) => r.status === "scheduled")
    );
    setPhase(everythingDone ? "done" : "edit");
  };

  const tabsRef = useRef(tabs);
  useEffect(() => { tabsRef.current = tabs; }, [tabs]);

  const updateRowStatus = (tabId, rowId, status, errorMessage = "") => {
    setTabs((prev) =>
      prev.map((t) =>
        t.id !== tabId
          ? t
          : { ...t, rows: t.rows.map((r) => (r.id === rowId ? { ...r, status, errorMessage } : r)) }
      )
    );
  };

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  /** A row counts as "unsaved work" if the user touched any field AND it's not yet scheduled. */
  const tabHasUnsavedWork = (t) =>
    !!t && t.termDefined && t.rows.some((r) =>
      r.status !== "scheduled" && Object.keys(r.touched || {}).length > 0
    );

  const handleProgramChange = (prog) => {
    setSelectedProgram(prog);
    setSelectedBatch("");
    setActiveTabId(null);
  };

  const handleBatchChange = (batch) => {
    setSelectedBatch(batch);
    const first = tabs.find((t) => t.program === selectedProgram && t.batch === batch);
    if (first) setActiveTabId(first.id);
  };

  /** Tab click: if the current tab has unsaved work, confirm and discard it. */
  const switchToTab = (newTabId) => {
    if (newTabId === activeTabId || phase === "submitting") return;
    const current = tabs.find((t) => t.id === activeTabId);
    if (tabHasUnsavedWork(current)) {
      const ok = window.confirm(
        "You have unsaved changes in this semester that have not been submitted. " +
        "If you switch tabs, they will be lost. Submit this semester first, or continue anyway?"
      );
      if (!ok) return;
      // Reset non-scheduled rows in the current tab to pristine state from CAMPUS_DATA.
      const fresh = buildTabsForCampus(campusId).find((ft) => ft.id === current.id);
      if (fresh) {
        setTabs((prev) => prev.map((t) => {
          if (t.id !== current.id) return t;
          const scheduled = t.rows.filter((r) => r.status === "scheduled");
          // Keep scheduled rows in place; everything else gets swapped for fresh rows.
          // Match by subjectId+sectionId+groupLabel so duplicates from split-lab groups line up.
          const keyOf = (r) => `${r.subjectId}::${r.sectionId}::${r.groupLabel || ""}`;
          const scheduledByKey = new Map(scheduled.map((r) => [keyOf(r), r]));
          const nextRows = fresh.rows.map((fr) => scheduledByKey.get(keyOf(fr)) || fr);
          return { ...t, rows: nextRows };
        }));
      }
    }
    setActiveTabId(newTabId);
  };

  const handleFinish = () => {
    doneFromImportRef.current = false;
    onClose?.();
    setTimeout(() => {
      setPhase("import");
      const fresh = buildTabsForCampus(campusId);
      setTabs(fresh);
      setActiveTabId(fresh[0] ? fresh[0].id : null);
    }, 300);
  };

  const computeUpdatedTabs = (parsed, baseTabs) => {
    const campus = CAMPUS_DATA.campuses.find((c) => c.id === campusId);
    const facultyList = campus ? campus.faculty : [];
    return baseTabs.map((tab) => {
      if (!tab.termDefined) return tab;
      const sheetData = Object.values(parsed).find((s) => {
        if (!s.meta) return false;
        const { program, batch, offering } = s.meta;
        if (batch !== tab.batch) return false;
        const offerOk = offering.toLowerCase() === tab.offering.toLowerCase() || (/flag/i.test(offering) && /flag/i.test(tab.offering));
        if (!offerOk) return false;
        const shortProg = program.split(/[\s(]/)[0].toUpperCase();
        return tab.program.toUpperCase().startsWith(shortProg);
      });
      if (!sheetData) return tab;
      const schedMap = {};
      for (const e of sheetData.timetableEntries) {
        const key = `${normSubjectName(e.subject)}||${e.section}||${e.startTime}`;
        if (!schedMap[key]) schedMap[key] = { days: [], startTime: e.startTime, endTime: e.endTime, subject: e.subject, section: e.section };
        const dIdx = DAY_TO_IDX[e.day];
        if (dIdx !== undefined && !schedMap[key].days.includes(dIdx)) schedMap[key].days.push(dIdx);
      }
      const newRows = tab.rows.map((row) => {
        const updates = {};
        const ref = sheetData.facultyMap[normSubjectName(row.subject)];
        if (ref?.faculty) { const fid = matchFacultyByName(ref.faculty, facultyList); if (fid && !row.facultyId) updates.facultyId = fid; }
        const rowSec = row.sections[0] || "A";
        const matched = Object.values(schedMap).filter((e) => {
          if (normSubjectName(e.subject) !== normSubjectName(row.subject)) return false;
          return e.section === "All" || e.section.replace(/Sec\s*/i, "").trim() === rowSec || e.section === `Sec ${rowSec}`;
        });
        if (matched.length > 0) { const first = matched[0]; updates.days = [...first.days].sort(); updates.startTime = first.startTime; updates.endTime = first.endTime; }
        return Object.keys(updates).length > 0 ? { ...row, ...updates } : row;
      });
      return { ...tab, rows: newRows };
    });
  };

  const applyImportedData = (parsed) => {
    const updatedTabs = computeUpdatedTabs(parsed, tabs);
    setTabs(updatedTabs);
    const firstTab = updatedTabs.find((t) => t.termDefined && t.rows.length > 0);
    if (firstTab) { setSelectedProgram(firstTab.program); setSelectedBatch(firstTab.batch); setActiveTabId(firstTab.id); }
    setPhase("edit");
  };

  const handleImport = (parsed, importMode, effectiveDate) => {
    if (importMode === "fresh") {
      setPendingImportData(parsed);
      setPhase("confirm-import");
    } else {
      applyImportedData(parsed);
      if (effectiveDate) {
        console.info("[TimetableImport] Modify effective from:", effectiveDate);
      }
    }
  };

  const startBulkScheduling = async (updatedTabs) => {
    const validTabs = updatedTabs.filter(t => t.termDefined && t.rows.length > 0 && t.rows.some(isRowIntended));
    const initStatus = {};
    validTabs.forEach(t => { initStatus[t.id] = { status: "pending", scheduled: 0, total: t.rows.filter(isRowIntended).length, error: "" }; });
    setTabSchedulingStatus(initStatus);
    setPhase("bulk-scheduling");
    cancelRef.current = false;

    for (const tab of validTabs) {
      if (cancelRef.current) break;
      setTabSchedulingStatus(prev => ({ ...prev, [tab.id]: { ...prev[tab.id], status: "scheduling" } }));
      setTabs(prev => prev.map(t => t.id !== tab.id ? t : {
        ...t, rows: t.rows.map(r => isRowIntended(r) ? { ...r, status: "pending", errorMessage: "" } : r)
      }));
      await wait(60);

      let retry = false;
      do {
        retry = false;
        const currentTab = tabsRef.current.find(t => t.id === tab.id);
        const toSchedule = currentTab.rows.filter(r => isRowIntended(r) && r.status !== "scheduled");
        let scheduledCount = currentTab.rows.filter(r => r.status === "scheduled").length;
        let hadError = false;

        for (const row of toSchedule) {
          if (cancelRef.current) return;
          setProcessingRowId(row.id);
          updateRowStatus(tab.id, row.id, "processing");
          await wait(500);
          const latestTab = tabsRef.current.find(t => t.id === tab.id);
          const latestRow = latestTab.rows.find(r => r.id === row.id);
          const conflicts = detectRowConflicts(latestRow, latestTab, tabsRef.current);
          if (conflicts.length) {
            const msg = conflicts.map(c => c.message).join(" ");
            updateRowStatus(tab.id, row.id, "error", msg);
            setProcessingRowId(null);
            setTabSchedulingStatus(prev => ({ ...prev, [tab.id]: { ...prev[tab.id], status: "error", error: msg } }));
            const action = await waitForBulkAction();
            if (action === "retry") {
              retry = true;
              setTabs(prev => prev.map(t => t.id !== tab.id ? t : {
                ...t, rows: t.rows.map(r => r.status === "error" ? { ...r, status: "pending", errorMessage: "" } : r)
              }));
              await wait(60);
            }
            hadError = true;
            break;
          }
          updateRowStatus(tab.id, row.id, "scheduled");
          scheduledCount++;
          setTabSchedulingStatus(prev => ({ ...prev, [tab.id]: { ...prev[tab.id], scheduled: scheduledCount } }));
          await wait(160);
        }

        if (!hadError) {
          const total = tabsRef.current.find(t => t.id === tab.id).rows.filter(isRowIntended).length;
          setTabSchedulingStatus(prev => ({ ...prev, [tab.id]: { ...prev[tab.id], status: "done", scheduled: total } }));
        }
      } while (retry);
    }

    setProcessingRowId(null);
    doneFromImportRef.current = true;
    setPhase("done");
  };

  if (!open) return null;

  return (
    <>
      <SunstoneStyles />
      <style>{`.spin { animation: sunspin 0.9s linear infinite; } @keyframes sunspin { to { transform: rotate(360deg); } }`}</style>
      <div className="sun-root">
        {showTplConfig && (
          <TemplateConfigModal tabs={tabs} campusName={campusName} facultyList={(CAMPUS_DATA.campuses.find(c => c.id === campusId) || {}).faculty || []} onClose={() => setShowTplConfig(false)} />
        )}
        <div className="drawer-backdrop" onClick={phase === "submitting" ? undefined : onClose} />
        <aside className={`drawer${(["import","confirm-import","bulk-scheduling"].includes(phase) || (phase === "done" && doneFromImportRef.current)) ? " drawer--import" : ""}`} role="dialog" aria-modal="true" aria-label="Bulk Schedule">
          <div className="drawer-header">
            <div className="drawer-title-block">
              <div className="drawer-title">
                {phase === "import" ? "Import Timetable"
                  : phase === "confirm-import" ? "Review & Confirm"
                  : phase === "bulk-scheduling" ? "Scheduling Timetable"
                  : "Bulk Schedule"}
              </div>
              <div className="drawer-subtitle">
                {phase === "import"
                  ? <>Upload your campus timetable or apply changes — use an <strong style={{ color: "var(--color-neutral-dark-1)" }}>.xlsx</strong> file for <strong style={{ color: "var(--color-neutral-dark-1)" }}>{campusName}</strong>.</>
                  : phase === "confirm-import"
                  ? <>Review the parsed entries below before scheduling begins for <strong style={{ color: "var(--color-neutral-dark-1)" }}>{campusName}</strong>.</>
                  : phase === "bulk-scheduling"
                  ? <>Scheduling programs one by one for <strong style={{ color: "var(--color-neutral-dark-1)" }}>{campusName}</strong>.</>
                  : <>Plan recurring classes for every program × batch in <strong style={{ color: "var(--color-neutral-dark-1)" }}>{campusName}</strong> for the upcoming semester.</>
                }
              </div>
            </div>
            <button className="btn-square-small" onClick={onClose} aria-label="Close">
              <X size={20} />
            </button>
          </div>

          {!["import","confirm-import","bulk-scheduling"].includes(phase) && !(phase === "done" && doneFromImportRef.current) && <div className="drawer-nav">
            <div className="drawer-filters">
              <div className="filter-group">
                <span className="field-label">Program</span>
                <select
                  className="filter-select"
                  value={selectedProgram}
                  onChange={(e) => handleProgramChange(e.target.value)}
                  disabled={phase === "submitting"}
                >
                  <option value="" disabled>Select program</option>
                  {uniquePrograms.map((p) => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>
              <div className="filter-group">
                <span className="field-label">Batch Year</span>
                <select
                  className="filter-select"
                  value={selectedBatch}
                  onChange={(e) => handleBatchChange(e.target.value)}
                  disabled={phase === "submitting" || !selectedProgram}
                >
                  <option value="" disabled>Select batch year</option>
                  {batchesForProgram.map((b) => <option key={b} value={b}>{b}</option>)}
                </select>
              </div>
            </div>
            <div className="tabs-scroll-wrap">
              {canScrollLeft && (
                <button className="tabs-arrow-btn left" onClick={() => scrollTabsBy(-1)} aria-label="Scroll tabs left">
                  <ChevronLeft size={14} />
                </button>
              )}
              <div className="drawer-tabs" ref={tabsScrollRef} role="tablist" onScroll={checkTabsScroll}>
                {filteredTabs.map((t) => {
                  const label = [t.degreeType, t.offering].filter(Boolean).join(" · ") || "Default";
                  const errCount = tabErrorCounts[t.id] || 0;
                  const doneCount = t.rows.filter((r) => r.status === "scheduled").length;
                  const allDone = t.rows.length > 0 && doneCount === t.rows.length;
                  return (
                    <button
                      key={t.id}
                      className={`tab-line ${activeTabId === t.id ? "active" : ""}`}
                      onClick={() => switchToTab(t.id)}
                      role="tab"
                      aria-selected={activeTabId === t.id}
                    >
                      {label}
                      {t.termDefined && errCount > 0 && phase !== "done" && (
                        <span title={`${errCount} row(s) need attention`} className="tab-error-dot" />
                      )}
                      {t.termDefined && allDone && <span title="All scheduled" className="tab-done-dot" />}
                    </button>
                  );
                })}
              </div>
              {canScrollRight && (
                <button className="tabs-arrow-btn right" onClick={() => scrollTabsBy(1)} aria-label="Scroll tabs right">
                  <ChevronRight size={14} />
                </button>
              )}
            </div>
          </div>}

          <div className="drawer-body">
            {phase === "import" ? (
              <ImportStep
                key={importResetKey}
                onImport={handleImport}
                onSkip={() => setPhase("edit")}
                tabs={tabs}
                facultyList={(CAMPUS_DATA.campuses.find((c) => c.id === campusId) || {}).faculty || []}
                campusName={campusName}
                onParsedChange={setImportParsed}
                onModeChange={setImportModeState}
                onEffectiveDateChange={setImportEffectiveDate}
                onDownloadTemplate={() => setShowTplConfig(true)}
              />
            ) : phase === "confirm-import" ? (() => {
              const validTabs = computeUpdatedTabs(pendingImportData, tabs).filter(t => t.termDefined && t.rows.length > 0 && t.rows.some(isRowIntended));
              const totalEntries = validTabs.reduce((s, t) => s + t.rows.filter(isRowIntended).length, 0);
              return (
                <div className="confirm-import-wrap">
                  <div className="alert alert-warning" style={{ padding: "10px 14px" }}>
                    <div className="alert-title">Existing scheduled events will be overridden</div>
                    <div className="alert-description" style={{ marginTop: 3 }}>If any events are already scheduled for these programs, they will be replaced with the new entries from this file.</div>
                  </div>
                  <div>
                    <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 8 }}>
                      <div className="tpl-section-label">Programs to be scheduled</div>
                      {totalEntries > 0 && <div style={{ fontSize: 12, color: "var(--color-neutral-dark-2)" }}>{totalEntries} total entries</div>}
                    </div>
                    <div className="confirm-program-list">
                      {validTabs.map(tab => {
                        const intended = tab.rows.filter(isRowIntended);
                        return (
                          <div key={tab.id} className="confirm-program-row">
                            <div>
                              <div className="confirm-program-name">{tab.program} · {tab.batch}{tab.offering ? ` — ${tab.offering}` : ""}</div>
                              <div className="confirm-program-meta">{tab.rows.length} subjects · {intended.length} entries</div>
                            </div>
                            <span className="tag-small tag-info" style={{ fontSize: 11 }}>{intended.length} entries</span>
                          </div>
                        );
                      })}
                      {validTabs.length === 0 && (
                        <div className="alert alert-warning"><div className="alert-title">No schedulable entries found in the uploaded file.</div></div>
                      )}
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 8, justifyContent: "space-between", marginTop: 4 }}>
                    <button className="btn-medium btn-secondary-light" onClick={() => setPhase("import")}>
                      <ChevronLeft size={14} /> Back
                    </button>
                    <button className="btn-medium btn-primary-light" disabled={validTabs.length === 0}
                      onClick={() => {
                        const updated = computeUpdatedTabs(pendingImportData, tabs);
                        setTabs(updated);
                        tabsRef.current = updated;
                        startBulkScheduling(updated);
                      }}>
                      <Check size={14} /> Confirm and Submit
                    </button>
                  </div>
                </div>
              );
            })() : phase === "bulk-scheduling" ? (() => {
              const validTabs = tabs.filter(t => t.termDefined && t.rows.length > 0 && t.rows.some(isRowIntended));
              return (
                <div className="bulk-sched-wrap">
                  {validTabs.map(tab => {
                    const st = tabSchedulingStatus[tab.id] || { status: "pending", scheduled: 0, total: tab.rows.filter(isRowIntended).length };
                    const isScheduling = st.status === "scheduling";
                    const isDone = st.status === "done";
                    const isError = st.status === "error";
                    return (
                      <div key={tab.id} className={`bulk-sched-item${isScheduling ? " is-scheduling" : isDone ? " is-done" : isError ? " is-error" : ""}`}>
                        <div className="bulk-sched-icon">
                          {isDone   && <CheckCircle2 size={18} color="var(--color-success-2)" />}
                          {isError  && <AlertCircle  size={18} color="var(--color-error-2)" />}
                          {isScheduling && <Loader2 size={18} color="var(--color-primary)" className="spin" />}
                          {st.status === "pending" && <div style={{ width: 18, height: 18, borderRadius: "50%", border: "2px solid var(--color-neutral-dark-4)", boxSizing: "border-box" }} />}
                        </div>
                        <div className="bulk-sched-body">
                          <div className="bulk-sched-name">{tab.program} · {tab.batch}{tab.offering ? ` — ${tab.offering}` : ""}</div>
                          <div className="bulk-sched-status">
                            {isDone      && `Scheduled — ${st.scheduled} events`}
                            {isScheduling && `Scheduling… ${st.scheduled} / ${st.total}`}
                            {isError     && "Paused — error encountered"}
                            {st.status === "pending" && "Waiting…"}
                          </div>
                          {isError && <>
                            <div className="bulk-sched-error-msg">{st.error}</div>
                            <div className="bulk-sched-actions">
                              <button className="btn-medium btn-secondary-light" style={{ fontSize: 12, padding: "5px 10px" }} onClick={() => resolveBulkAction("skip")}>Skip program</button>
                              <button className="btn-medium btn-primary-light"   style={{ fontSize: 12, padding: "5px 10px" }} onClick={() => resolveBulkAction("retry")}>Retry</button>
                            </div>
                          </>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })() : phase === "done" ? (
              <div className="success-wrap">
                <div className="success-icon"><CheckCircle2 size={40} /></div>
                <div className="success-title">All classes scheduled</div>
                <div className="success-desc">
                  {scheduledRows} recurring {scheduledRows === 1 ? "event" : "events"} across {tabs.filter((t) => t.termDefined && t.rows.length).length} program{tabs.filter((t) => t.termDefined && t.rows.length).length === 1 ? "" : "s"} have been placed on the academic calendar. Students and faculty will see the updated timetable immediately.
                </div>
                <button className="btn-medium btn-primary-light" onClick={handleFinish}>
                  <Check size={16} /> Finish
                </button>
              </div>
            ) : !activeTab ? (
              <div className="initial-state">
                <div className="empty-state-icon" style={{ background: "var(--color-primary-3)", color: "var(--color-primary)" }}><Calendar size={28} /></div>
                <div className="empty-state-title">Select a program and batch to get started</div>
                <div className="empty-state-desc">Use the dropdowns above to choose a program and batch year combination. You'll then see all subjects and sections for the upcoming semester ready to schedule.</div>
              </div>
            ) : !activeTab.termDefined ? (
              <>
                <TermMetaStrip tab={activeTab} />
                <div className="empty-state">
                  <div className="empty-state-icon"><AlertCircle size={28} /></div>
                  <div className="empty-state-title">Term details aren't entered in Academic Management</div>
                  <div className="empty-state-desc">
                    You can't schedule {activeTab.program} {activeTab.batch}{activeTab.degreeType ? ` ${activeTab.degreeType}` : ""}{activeTab.offering ? ` · ${activeTab.offering}` : ""} yet. Go to Academic Management and configure the upcoming term — start date, end date, session slot duration and weekly off — then come back here.
                  </div>
                  <button className="btn-medium btn-secondary-light">
                    Open Academic Management <ChevronRight size={14} />
                  </button>
                </div>
              </>
            ) : (
              <>
                <TermMetaStrip tab={activeTab} onChangeSemester={(s) => {}} />
                <ScheduleTable
                  tab={activeTab}
                  allTabs={tabs}
                  onUpdateRow={(rowId, patch) => updateRow(activeTab.id, rowId, patch)}
                  onAddGroup={(rowId) => addGroupToSection(activeTab.id, rowId)}
                  onRemoveGroup={(parentKey) => removeGroupFromSection(activeTab.id, parentKey)}
                  processingRowId={processingRowId}
                  pausedOnErrorRowId={pausedOnErrorRowId}
                  phase={phase}
                />
              </>
            )}
          </div>

          {phase === "import" && importParsed && (
            <div className="drawer-footer" style={{ justifyContent: "flex-end", gap: 8 }}>
              <button className="btn-medium btn-secondary-light" onClick={() => { setImportParsed(null); setImportResetKey(k => k + 1); }}>Re-upload</button>
              <button className="btn-medium btn-primary-light" onClick={() => handleImport(importParsed, importModeState, importEffectiveDate)}>
                <Play size={14} /> Submit and Start Scheduling
              </button>
            </div>
          )}

          {!["done","import","confirm-import","bulk-scheduling"].includes(phase) && (() => {
            const activeRows = activeTab && activeTab.termDefined ? activeTab.rows : [];
            const activeTotal = activeRows.length;
            const activeScheduled = activeRows.filter((r) => r.status === "scheduled").length;
            const activeSubmittable = activeRows.filter((r) => r.status !== "scheduled" && isRowIntended(r)).length;
            const activeErrs = tabErrorCounts[activeTabId] || 0;
            const activeLabel = activeTab ? `${activeTab.program} ${activeTab.batch}${activeTab.degreeType ? " · " + activeTab.degreeType : ""}${activeTab.offering ? " · " + activeTab.offering : ""}` : "";
            return (
            <div className="drawer-footer">
              <div style={{ display: "flex", alignItems: "center", gap: 16, flex: 1, minWidth: 0 }}>
                {phase === "submitting" ? (
                  <>
                    <div style={{ display: "flex", flexDirection: "column", gap: 4, flex: 1, minWidth: 0 }}>
                      <div className="label-small-primary" style={{ display: "flex", justifyContent: "space-between", gap: 12 }}>
                        <span>Scheduling {activeLabel}</span>
                        <span style={{ color: "var(--color-neutral-dark-2)", fontWeight: 400 }}>
                          {activeScheduled} / {activeTotal} events placed
                        </span>
                      </div>
                      <div className="progress-bar">
                        <div className="progress-fill" style={{ width: `${activeTotal ? (activeScheduled / activeTotal) * 100 : 0}%` }} />
                      </div>
                    </div>
                  </>
                ) : (
                  <div className="label-small-secondary" style={{ display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap" }}>
                    <span>
                      <strong style={{ color: "var(--color-neutral-dark-1)" }}>{activeScheduled}</strong> / <strong style={{ color: "var(--color-neutral-dark-1)" }}>{activeTotal}</strong> events scheduled in this semester
                    </span>
                    {activeErrs > 0 && (
                      <span className="tag-small tag-error">
                        <AlertCircle size={11} />
                        {activeErrs} row(s) need attention
                      </span>
                    )}
                  </div>
                )}
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                <button className="btn-medium btn-secondary-light" onClick={onClose} disabled={phase === "submitting"}>
                  Cancel
                </button>
                <button
                  className="btn-medium btn-primary-light"
                  onClick={startSubmission}
                  disabled={activeSubmittable === 0 || phase === "submitting"}
                  title={activeSubmittable === 0 ? "Fill start time, end time and days for at least one row" : undefined}
                >
                  {phase === "submitting" ? (
                    <><Loader2 size={14} className="spin" /> Scheduling…</>
                  ) : (
                    <><Play size={14} /> Submit & Schedule</>
                  )}
                </button>
              </div>
            </div>
            );
          })()}
        </aside>
      </div>
    </>
  );
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TERM META STRIP
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function TermMetaStrip({ tab }) {
  const allTerms = tab.allTerms || [];
  const defaultIdx = Math.max(0, allTerms.findIndex((t) => t.status === "Upcoming"));
  const [selIdx, setSelIdx] = useState(defaultIdx);

  const dt = allTerms[selIdx] || null;
  const workingDayLabels = dt ? dt.workingDays.map((i) => DAY_LABELS[i]).join(", ") : "—";
  const offDays = dt ? (DAY_LABELS.filter((_, i) => !dt.workingDays.includes(i)).join(", ") || "None") : "—";
  const fmt = (iso) => {
    if (!iso) return "—";
    return new Date(iso).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  };

  return (
    <div className="term-strip">
      <div className="term-meta-list">
        <div className="term-meta-item">
          <div className="term-meta-label">Semester</div>
          <select
            className="cascader-trigger"
            style={{ minWidth: 220, fontWeight: 600 }}
            value={selIdx}
            onChange={(e) => setSelIdx(Number(e.target.value))}
            disabled={allTerms.length === 0}
          >
            {allTerms.length === 0
              ? <option value={0}>Upcoming Semester</option>
              : allTerms.map((t, i) => <option key={i} value={i}>{t.label}</option>)
            }
          </select>
        </div>
        <div className="term-meta-item">
          <div className="term-meta-label"><Calendar size={14} /> Term Start</div>
          <div className="term-meta-value">{fmt(dt?.startDate)}</div>
        </div>
        <div className="term-meta-item">
          <div className="term-meta-label"><Calendar size={14} /> Term End</div>
          <div className="term-meta-value">{fmt(dt?.endDate)}</div>
        </div>
        <div className="term-meta-item">
          <div className="term-meta-label"><Clock size={14} /> Session Slot</div>
          <div className="term-meta-value">{dt ? `${dt.slotMinutes} min` : "—"}</div>
        </div>
        <div className="term-meta-item">
          <div className="term-meta-label"><Calendar size={14} /> Working Days</div>
          <div className="term-meta-value">{workingDayLabels}</div>
        </div>
        <div className="term-meta-item">
          <div className="term-meta-label"><Calendar size={14} /> Weekly Off</div>
          <div className="term-meta-value">{offDays}</div>
        </div>
      </div>
      <span className="tag-small tag-info term-strip-info-tag">
        <Info size={12} /> Defaults pulled from Academic Management
      </span>
    </div>
  );
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TIME PICKER
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function TimePicker({ value, onChange, disabled, hasError, placeholder = "––:––" }) {
  const parse = (v) => {
    if (!v) return null;
    const [h, m] = v.split(":").map(Number);
    if (isNaN(h) || isNaN(m)) return null;
    return { h, m };
  };

  const parsed = parse(value);
  const [focused, setFocused] = useState(null);
  const [pendingDigit, setPendingDigit] = useState(null);
  const wrapRef = useRef(null);

  const emit = (h, m) => {
    const hh = Math.max(0, Math.min(23, h));
    const mm = Math.max(0, Math.min(59, m));
    onChange(`${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`);
  };

  const curH = parsed?.h ?? 9;
  const curM = parsed?.m ?? 0;

  const stepH = (delta) => { emit(curH + delta, curM); setPendingDigit(null); };
  const stepM = (delta) => { emit(curH, curM + delta); setPendingDigit(null); };

  const handleKey = (seg, e) => {
    if (e.key === "ArrowUp")   { e.preventDefault(); seg === "h" ? stepH(1)  : stepM(1);  return; }
    if (e.key === "ArrowDown") { e.preventDefault(); seg === "h" ? stepH(-1) : stepM(-1); return; }
    if (e.key === "Tab") { setFocused(null); setPendingDigit(null); return; }
    if (!/^\d$/.test(e.key)) return;
    e.preventDefault();
    const digit = parseInt(e.key, 10);
    if (seg === "h") {
      if (pendingDigit === null) {
        if (digit >= 3) { emit(digit, curM); setPendingDigit(null); setFocused("m"); }
        else            { setPendingDigit(digit); }
      } else {
        const combined = pendingDigit * 10 + digit;
        emit(Math.min(23, combined), curM);
        setPendingDigit(null);
        setFocused("m");
      }
    } else {
      if (pendingDigit === null) {
        if (digit >= 6) { emit(curH, digit); setPendingDigit(null); }
        else            { setPendingDigit(digit); }
      } else {
        const combined = pendingDigit * 10 + digit;
        emit(curH, Math.min(59, combined));
        setPendingDigit(null);
        setFocused(null);
      }
    }
  };

  const handleSegFocus = (seg) => {
    if (!value) emit(9, 0);
    setFocused(seg);
    setPendingDigit(null);
  };

  const displayH = parsed ? String(parsed.h).padStart(2, "0") : "--";
  const displayM = parsed ? String(parsed.m).padStart(2, "0") : "--";

  return (
    <div
      ref={wrapRef}
      className={`tp-wrap${hasError ? " tp-error" : ""}${disabled ? " tp-disabled" : ""}`}
      onMouseDown={(e) => { if (disabled) e.preventDefault(); }}
    >
      <button
        type="button"
        className={`tp-seg${focused === "h" ? " tp-seg-focused" : ""}${!parsed ? " tp-seg-empty" : ""}`}
        disabled={disabled}
        tabIndex={disabled ? -1 : 0}
        onFocus={() => handleSegFocus("h")}
        onBlur={() => { setFocused(null); setPendingDigit(null); }}
        onKeyDown={(e) => handleKey("h", e)}
        aria-label="Hours"
      >
        {pendingDigit !== null && focused === "h" ? `${pendingDigit}_` : displayH}
      </button>

      <span className="tp-colon">:</span>

      <button
        type="button"
        className={`tp-seg${focused === "m" ? " tp-seg-focused" : ""}${!parsed ? " tp-seg-empty" : ""}`}
        disabled={disabled}
        tabIndex={disabled ? -1 : 0}
        onFocus={() => handleSegFocus("m")}
        onBlur={() => { setFocused(null); setPendingDigit(null); }}
        onKeyDown={(e) => handleKey("m", e)}
        aria-label="Minutes"
      >
        {pendingDigit !== null && focused === "m" ? `${pendingDigit}_` : displayM}
      </button>

      <div className="tp-steppers">
        <button
          type="button"
          className="tp-step"
          disabled={disabled}
          tabIndex={-1}
          onMouseDown={(e) => { e.preventDefault(); focused === "m" ? stepM(1) : stepH(1); }}
          aria-label="Increment"
        >▲</button>
        <button
          type="button"
          className="tp-step"
          disabled={disabled}
          tabIndex={-1}
          onMouseDown={(e) => { e.preventDefault(); focused === "m" ? stepM(-1) : stepH(-1); }}
          aria-label="Decrement"
        >▼</button>
      </div>
    </div>
  );
}

function DaysMultiSelect({ value, onChange, workingDays, disabled, hasError }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    const handler = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, [open]);

  const short = (v) => {
    if (!v?.length) return "Pick days";
    if (v.length === workingDays.length) return "Every working day";
    return v.map((i) => DAY_LABELS[i].slice(0, 3)).join(", ");
  };

  const toggle = (i) => {
    const next = value.includes(i) ? value.filter((x) => x !== i) : [...value, i].sort();
    onChange(next);
  };

  const selectAll = () => onChange([...workingDays]);
  const clearAll = () => onChange([]);

  return (
    <div ref={wrapRef} className="days-ms-wrap">
      <button
        type="button"
        className={`cascader-trigger ${hasError ? "error" : ""} ${open ? "open" : ""}`}
        disabled={disabled}
        onClick={() => setOpen((v) => !v)}
        style={{ textAlign: "left", width: "100%" }}
      >
        <span style={{
          overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
          color: value.length ? "var(--color-neutral-dark-1)" : "var(--color-neutral-dark-4)",
        }}>
          {short(value)}
        </span>
        <ChevronDown size={14} style={{ transition: "transform 0.15s", transform: open ? "rotate(180deg)" : "none", color: "var(--color-neutral-dark-3)" }} />
      </button>
      {open && (
        <div className="days-ms-panel">
          <div className="days-ms-actions">
            <button type="button" className="btn-text-14" style={{ fontSize: 11 }} onClick={selectAll}>Select all</button>
            <button type="button" className="btn-text-14" style={{ fontSize: 11, color: "var(--color-neutral-dark-2)" }} onClick={clearAll}>Clear</button>
          </div>
          <div className="days-ms-list">
            {DAY_LABELS.map((d, i) => {
              if (!workingDays.includes(i)) return null;
              const checked = value.includes(i);
              return (
                <label key={d} className="days-ms-option" onClick={(e) => { e.preventDefault(); toggle(i); }}>
                  <span className={`checkbox-input ${checked ? "checked" : ""}`} style={{ width: 14, height: 14 }}>
                    {checked && <Check size={10} strokeWidth={3.2} color="#fff" />}
                  </span>
                  <span style={{ fontSize: 13 }}>{d}</span>
                </label>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   SCHEDULE TABLE
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

function ScheduleTable({
  tab,
  allTabs,
  onUpdateRow,
  onAddGroup,
  onRemoveGroup,
  processingRowId,
  pausedOnErrorRowId,
  phase,
}) {
  const rowErrors = useMemo(() => {
    const map = {};
    for (const r of tab.rows) {
      if (r.status === "scheduled") { map[r.id] = []; continue; }
      map[r.id] = detectFieldErrors(r);
    }
    return map;
  }, [tab]);

  const termDays = tab.term.workingDays;

  const groups = useMemo(() => {
    const order = [];
    const map = {};
    for (const r of tab.rows) {
      const key = r.subject || `__untitled_${r.id}`;
      if (!(key in map)) {
        order.push(key);
        map[key] = {
          key,
          subject: r.subject,
          subjectType: r.subjectType,
          specialisation: r.specialisation,
          isPrime: r.isPrime,
          isLab: r.isLab,
          rows: [],
        };
      }
      map[key].rows.push(r);
    }
    return order.map((k) => map[k]);
  }, [tab.rows]);

  return (
    <div className="sched-table-wrap">
      <table className="sched-table">
        <colgroup>
          <col style={{ width: 230 }} />
          <col style={{ width: 115 }} />
          <col style={{ width: 115 }} />
          <col style={{ width: 105 }} />
          <col style={{ width: 105 }} />
          <col style={{ width: 170 }} />
          <col style={{ width: 200 }} />
          <col style={{ width: 200 }} />
        </colgroup>
        <thead>
          <tr>
            <th>Subject / Section</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>Days Repeated</th>
            <th>Faculty</th>
            <th>Faculty 2</th>
          </tr>
        </thead>
        <tbody>
          {tab.rows.length === 0 && (
            <tr>
              <td colSpan={8} style={{ textAlign: "center", padding: "40px 16px", color: "var(--color-neutral-dark-3)", background: "#FFFFFF" }}>
                No subjects have been added to Academic Management for this term yet.
              </td>
            </tr>
          )}
          {groups.map((group, gi) => {
            const totalStudents = group.rows.reduce((s, r) => {
              return s + (r.studentCount || 0);
            }, 0);
            const sectionCount = new Set(group.rows.flatMap((r) => r.sections || [])).size;

            return (
              <React.Fragment key={group.key}>
                <tr className="group-head-row">
                  <td colSpan={8} className="group-head-cell">
                    <div className="group-head">
                      <div className="group-head-left">
                        <div className="group-head-title">{group.subject || <span style={{ color: "var(--color-neutral-dark-4)" }}>Untitled subject</span>}</div>
                        <div className="group-head-tags">
                          <SubjectTypeTag type={group.subjectType} specialisation={group.specialisation} />
                          {group.isPrime && <span className="tag-small tag-accent-a">PRIME</span>}
                          {group.isLab && <span className="tag-small tag-accent-d">Lab</span>}
                          <span className="group-head-meta">
                            <Users size={11} />
                            {totalStudents} student{totalStudents === 1 ? "" : "s"} · {sectionCount} section{sectionCount === 1 ? "" : "s"}
                          </span>
                        </div>
                      </div>
                    </div>
                  </td>
                </tr>

                {group.rows.map((row, ri) => {
                  const errs = rowErrors[row.id] || [];
                  const errByField = errs.reduce((acc, e) => { acc[e.field] = e.message; return acc; }, {});
                  const touched = row.touched || {};
                  const fieldErr = (field) => touched[field] ? (errByField[field] || null) : null;
                  const rowStatusClass = row.status === "error"
                    ? "row-error"
                    : row.status === "processing"
                    ? "row-processing"
                    : row.status === "creating"
                    ? "row-creating"
                    : row.status === "scheduled"
                    ? "row-scheduled"
                    : row.status === "pending"
                    ? "row-pending"
                    : "";
                  const isLocked = row.status === "scheduled" || row.status === "processing" || row.status === "creating" || phase === "submitting";
                  const isLast = ri === group.rows.length - 1;

                  const isPartOfFamily = !!row.groupParentKey;
                  const sectionLabel = (row.sections || []).join(", ");
                  const familySize = isPartOfFamily
                    ? group.rows.filter((r) => r.groupParentKey === row.groupParentKey).length
                    : 1;
                  const isSectionHead = !isPartOfFamily ||
                    group.rows.findIndex((r) => r.groupParentKey === row.groupParentKey) === ri;

                  return (
                    <React.Fragment key={row.id}>
                      <tr className={`group-body-row ${rowStatusClass} ${isLast ? "group-last" : ""} ${isPartOfFamily ? "is-group-row" : ""} ${isPartOfFamily && !isSectionHead ? "is-group-child" : ""}`}>
                        <td className="section-cell">
                          <div className="section-pill">
                            {isPartOfFamily ? (
                              <>
                                {isSectionHead && (
                                  <span className="section-pill-context">Section {sectionLabel}</span>
                                )}
                                <span className="section-pill-label">
                                  <span className="section-group-glyph" aria-hidden>└</span>
                                  {row.groupLabel}
                                </span>
                              </>
                            ) : (
                              <span className="section-pill-label">Section {sectionLabel}</span>
                            )}
                            <span className="section-pill-sub">
                              <Users size={10} /> {row.studentCount} student{row.studentCount === 1 ? "" : "s"}
                            </span>
                            {(() => {
                              const scheduled = row.status === "scheduled" ? countSessions(row) : 0;
                              return (
                                <span className="section-pill-sub">
                                  <Calendar size={10} /> {scheduled} class{scheduled === 1 ? "" : "es"} scheduled
                                  <span className="sched-ext-wrap">
                                    <a className="sched-ext-link" href="#" target="_blank" rel="noopener noreferrer" onClick={(e) => e.preventDefault()}>
                                      <ExternalLink size={10} />
                                    </a>
                                    <span className="sched-ext-tooltip">View scheduled classes for this section in Scheduler</span>
                                  </span>
                                </span>
                              );
                            })()}
                          </div>

                          {group.isLab && isSectionHead && !isLocked && (
                            <div className="groups-stepper" title={familySize === 1 ? "Split this lab section into parallel groups" : "Adjust the number of parallel groups"}>
                              <span className="groups-stepper-label">Groups</span>
                              <button
                                type="button"
                                className="groups-stepper-btn"
                                disabled={familySize <= 1}
                                onClick={() => {
                                  if (familySize <= 1) return;
                                  onRemoveGroup(row.groupParentKey);
                                }}
                                aria-label="Remove last group"
                              >
                                <Minus size={12} strokeWidth={2.5} />
                              </button>
                              <span className="groups-stepper-count">{familySize}</span>
                              <button
                                type="button"
                                className="groups-stepper-btn"
                                disabled={familySize >= 6}
                                onClick={() => onAddGroup(row.id)}
                                aria-label="Add another group"
                              >
                                <Plus size={12} strokeWidth={2.5} />
                              </button>
                            </div>
                          )}
                        </td>

                        <td>
                          <input
                            type="date"
                            className={`text-input ${fieldErr("startDate") ? "error" : ""}`}
                            value={row.startDate}
                            min={tab.term.startDate}
                            max={tab.term.endDate}
                            disabled={isLocked}
                            onChange={(e) => onUpdateRow(row.id, { startDate: e.target.value })}
                          />
                        </td>
                        <td>
                          <input
                            type="date"
                            className={`text-input ${fieldErr("endDate") ? "error" : ""}`}
                            value={row.endDate}
                            min={row.startDate || tab.term.startDate}
                            max={tab.term.endDate}
                            disabled={isLocked}
                            onChange={(e) => onUpdateRow(row.id, { endDate: e.target.value })}
                          />
                        </td>

                        <td>
                          <TimePicker
                            value={row.startTime}
                            onChange={(v) => onUpdateRow(row.id, { startTime: v })}
                            disabled={isLocked}
                            hasError={!!fieldErr("startTime")}
                            placeholder="Start"
                          />
                        </td>
                        <td>
                          <TimePicker
                            value={row.endTime}
                            onChange={(v) => onUpdateRow(row.id, { endTime: v })}
                            disabled={isLocked}
                            hasError={!!fieldErr("endTime")}
                            placeholder="End"
                          />
                        </td>

                        <td>
                          <DaysMultiSelect
                            value={row.days}
                            onChange={(next) => onUpdateRow(row.id, { days: next })}
                            workingDays={termDays}
                            disabled={isLocked}
                            hasError={!!fieldErr("days")}
                          />
                        </td>

                        <td>
                          <select
                            className={`cascader-trigger ${fieldErr("facultyId") ? "error" : ""}`}
                            value={row.facultyId}
                            disabled={isLocked}
                            onChange={(e) => onUpdateRow(row.id, { facultyId: e.target.value })}
                          >
                            <option value="">Select faculty</option>
                            {getFacultyForRow(tab.campusId, row.subjectId, row.sectionId).map((f) => (
                              <option key={f.id} value={String(f.id)}>{f.name}</option>
                            ))}
                          </select>
                        </td>

                        <td>
                          <select
                            className="cascader-trigger"
                            value={row.secondaryFacultyId}
                            disabled={isLocked}
                            onChange={(e) => onUpdateRow(row.id, { secondaryFacultyId: e.target.value })}
                          >
                            <option value="">Optional</option>
                            {getFacultyForRow(tab.campusId, row.subjectId, row.sectionId).map((f) => (
                              <option key={f.id} value={String(f.id)}>{f.name}</option>
                            ))}
                          </select>
                        </td>
                      </tr>

                      {row.status === "error" && row.errorMessage && (
                        <tr>
                          <td colSpan={8} style={{ padding: 0 }}>
                            <div className="row-error-banner">
                              <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                                <AlertCircle size={16} color="var(--color-error-1)" style={{ flexShrink: 0, marginTop: 1 }} />
                                <div>
                                  <div style={{ fontSize: 12, fontWeight: 700, color: "var(--color-error-2)", marginBottom: 2 }}>
                                    Conflict detected
                                  </div>
                                  <div className="row-error-text">{row.errorMessage}</div>
                                </div>
                              </div>
                            </div>
                          </td>
                        </tr>
                      )}

                      {phase === "edit" && row.status !== "error" && errs.length > 0 && Object.keys(row.touched || {}).length > 0 && (
                        <tr>
                          <td colSpan={8} style={{ padding: "0 14px 8px" }}>
                            <div style={{ fontSize: 11, color: "var(--color-error-2)", display: "flex", alignItems: "flex-start", gap: 6 }}>
                              <AlertCircle size={12} style={{ marginTop: 1, flexShrink: 0 }} />
                              <span>{errs.filter(e => (row.touched || {})[e.field]).map((e) => e.message).join("  •  ")}</span>
                            </div>
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  );
                })}

                {gi < groups.length - 1 && (
                  <tr className="group-spacer"><td colSpan={8} /></tr>
                )}
              </React.Fragment>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   DEMO LAUNCHER
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function App() {
  const [open, setOpen] = useState(false);
  const [openPhase, setOpenPhase] = useState("import");
  const [campusId, setCampusId] = useState(DEFAULT_CAMPUS_ID);

  const selectedCampus = CAMPUS_DATA.campuses.find((c) => c.id === campusId) || CAMPUS_DATA.campuses[0];

  const weekDays = [
    { name: "MON", num: 26 },
    { name: "TUE", num: 27 },
    { name: "WED", num: 28 },
    { name: "THU", num: 29 },
    { name: "FRI", num: 30 },
    { name: "SAT", num: "01", today: true },
    { name: "SUN", num: "02", sunday: true },
  ];
  const timeRows = Array.from({ length: 13 }, (_, i) => ({ label: "1 AM", id: i }));
  const nowRowIndex = 0;
  const nowDayIndex = 5;

  return (
    <div className="demo-page sun-root">
      <SunstoneStyles />
      <style>{`.spin { animation: sunspin 0.9s linear infinite; } @keyframes sunspin { to { transform: rotate(360deg); } }`}</style>

      <div className="demo-brand">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
          <path d="M3 18 L9 10 L13 14 L18 8 L23 18 Z" fill="var(--color-primary)" />
          <path d="M3 20 L23 20 L21 23 L5 23 Z" fill="var(--color-primary)" opacity="0.6" />
        </svg>
        <span className="demo-brand-logo">SUNSTONE</span>
      </div>

      <div className="demo-layout">
        <aside className="demo-rail">
          <div className="demo-rail-tabs">
            <button className="demo-rail-tab">Groups</button>
            <button className="demo-rail-tab active">Bulk Schedule</button>
          </div>
          <div className="demo-rail-body">
            <h2 className="demo-rail-title">Bulk Schedule</h2>
            <p className="demo-rail-desc">
              Plan every recurring class for the upcoming semester across all program × batch combinations on your campus in one flow. The system auto-detects faculty and group conflicts before anything touches the live academic calendar — so modifications after the fact stay low.
            </p>
            <div className="demo-rail-divider" />
            <label className="demo-rail-label">Campus<span className="req">*</span></label>
            <select
              className="cascader-trigger demo-rail-campus"
              value={campusId}
              onChange={(e) => setCampusId(parseInt(e.target.value, 10))}
            >
              {CAMPUS_DATA.campuses.map((c) => (
                <option key={c.id} value={c.id}>
                  {c.full_name || c.name}
                </option>
              ))}
            </select>
            <button
              className="btn-primary-light demo-rail-cta"
              onClick={() => { setOpenPhase("edit"); setOpen(true); }}
            >
              Start Scheduling <ChevronRight size={16} />
            </button>
            <button
              className="btn-secondary-light demo-rail-import-btn"
              onClick={() => { setOpenPhase("import"); setOpen(true); }}
            >
              <Upload size={16} /> Import Timetable
            </button>
            <div className="demo-rail-note">
              <strong>Term defaults are picked up automatically</strong>
              Start date, end date, session slot duration and weekly off come from Academic Management. Tabs without a configured term will show an empty state.
            </div>
          </div>
        </aside>

        <section className="demo-cal">
          <div className="demo-cal-toolbar">
            <div className="demo-cal-toolbar-left">
              <button className="demo-cal-schedule-btn" onClick={() => setOpen(true)}>
                <Plus size={16} strokeWidth={2.2} /> Schedule
              </button>
            </div>
            <div className="demo-cal-nav">
              <button className="demo-cal-nav-btn" aria-label="Previous week">
                <ChevronRight size={14} style={{ transform: "rotate(180deg)" }} />
              </button>
              <span className="demo-cal-range">26 Oct - 02 Nov</span>
              <button className="demo-cal-nav-btn" aria-label="Next week">
                <ChevronRight size={14} />
              </button>
            </div>
            <div className="demo-cal-toolbar-right">
              <button className="demo-cal-pill">Today</button>
              <select className="demo-cal-select" defaultValue="week">
                <option value="day">Day</option>
                <option value="week">Week</option>
                <option value="month">Month</option>
              </select>
              <select className="demo-cal-select" defaultValue="2026">
                <option value="2024">2024</option>
                <option value="2025">2025</option>
                <option value="2026">2026</option>
              </select>
            </div>
          </div>

          <div className="demo-cal-grid">
            <div className="demo-cal-timehead" />
            {weekDays.map((d, i) => (
              <div
                key={d.name}
                className={`demo-cal-dayhead ${d.today ? "is-today" : ""} ${d.sunday ? "is-sunday" : ""}`}
              >
                <div className="demo-cal-dayname">{d.name}</div>
                <div className="demo-cal-daynum">{d.num}</div>
              </div>
            ))}

            {timeRows.map((row, ri) => (
              <React.Fragment key={row.id}>
                <div className="demo-cal-timecell">{row.label}</div>
                {weekDays.map((d, di) => (
                  <div
                    key={di}
                    className={`demo-cal-slot ${d.sunday ? "is-sunday" : ""}`}
                  >
                    {ri === nowRowIndex && di === nowDayIndex && (
                      <div className="demo-cal-now" />
                    )}
                    {ri === nowRowIndex && di > nowDayIndex && (
                      <div className="demo-cal-now demo-cal-now-continue" />
                    )}
                  </div>
                ))}
              </React.Fragment>
            ))}
          </div>
        </section>
      </div>

      <BulkScheduleDrawer
        open={open}
        onClose={() => setOpen(false)}
        campusId={campusId}
        campusName={selectedCampus?.full_name || selectedCampus?.name || "Campus"}
        openPhase={openPhase}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
