}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TIME PICKER
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function TimePicker({ value, onChange, disabled, hasError, placeholder = "––:––" }) {
  const parse = (v) => {
    if (!v) return null;
    const [h, m] = v.split(":").map(Number);
    if (isNaN(h) || isNaN(m)) return null;
    return { h, m };
  };

  const parsed = parse(value);
  const [focused, setFocused] = useState(null);
  const [pendingDigit, setPendingDigit] = useState(null);
  const wrapRef = useRef(null);

  const emit = (h, m) => {
    const hh = Math.max(0, Math.min(23, h));
    const mm = Math.max(0, Math.min(59, m));
    onChange(`${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`);
  };

  const curH = parsed?.h ?? 9;
  const curM = parsed?.m ?? 0;

  const stepH = (delta) => { emit(curH + delta, curM); setPendingDigit(null); };
  const stepM = (delta) => { emit(curH, curM + delta); setPendingDigit(null); };

  const handleKey = (seg, e) => {
    if (e.key === "ArrowUp")   { e.preventDefault(); seg === "h" ? stepH(1)  : stepM(1);  return; }
    if (e.key === "ArrowDown") { e.preventDefault(); seg === "h" ? stepH(-1) : stepM(-1); return; }
    if (e.key === "Tab") { setFocused(null); setPendingDigit(null); return; }
    if (!/^\d$/.test(e.key)) return;
    e.preventDefault();
    const digit = parseInt(e.key, 10);
    if (seg === "h") {
      if (pendingDigit === null) {
        if (digit >= 3) { emit(digit, curM); setPendingDigit(null); setFocused("m"); }
        else            { setPendingDigit(digit); }
      } else {
        const combined = pendingDigit * 10 + digit;
        emit(Math.min(23, combined), curM);
        setPendingDigit(null);
        setFocused("m");
      }
    } else {
      if (pendingDigit === null) {
        if (digit >= 6) { emit(curH, digit); setPendingDigit(null); }
        else            { setPendingDigit(digit); }
      } else {
        const combined = pendingDigit * 10 + digit;
        emit(curH, Math.min(59, combined));
        setPendingDigit(null);
        setFocused(null);
      }
    }
  };

  const handleSegFocus = (seg) => {
    if (!value) emit(9, 0);
    setFocused(seg);
    setPendingDigit(null);
  };

  const displayH = parsed ? String(parsed.h).padStart(2, "0") : "--";
  const displayM = parsed ? String(parsed.m).padStart(2, "0") : "--";

  return (
    <div
      ref={wrapRef}
      className={`tp-wrap${hasError ? " tp-error" : ""}${disabled ? " tp-disabled" : ""}`}
      onMouseDown={(e) => { if (disabled) e.preventDefault(); }}
    >
      <button
        type="button"
        className={`tp-seg${focused === "h" ? " tp-seg-focused" : ""}${!parsed ? " tp-seg-empty" : ""}`}
        disabled={disabled}
        tabIndex={disabled ? -1 : 0}
        onFocus={() => handleSegFocus("h")}
        onBlur={() => { setFocused(null); setPendingDigit(null); }}
        onKeyDown={(e) => handleKey("h", e)}
        aria-label="Hours"
      >
        {pendingDigit !== null && focused === "h" ? `${pendingDigit}_` : displayH}
      </button>

      <span className="tp-colon">:</span>

      <button
        type="button"
        className={`tp-seg${focused === "m" ? " tp-seg-focused" : ""}${!parsed ? " tp-seg-empty" : ""}`}
        disabled={disabled}
        tabIndex={disabled ? -1 : 0}
        onFocus={() => handleSegFocus("m")}
        onBlur={() => { setFocused(null); setPendingDigit(null); }}
        onKeyDown={(e) => handleKey("m", e)}
        aria-label="Minutes"
      >
        {pendingDigit !== null && focused === "m" ? `${pendingDigit}_` : displayM}
      </button>

      <div className="tp-steppers">
        <button
          type="button"
          className="tp-step"
          disabled={disabled}
          tabIndex={-1}
          onMouseDown={(e) => { e.preventDefault(); focused === "m" ? stepM(1) : stepH(1); }}
          aria-label="Increment"
        >▲</button>
        <button
          type="button"
          className="tp-step"
          disabled={disabled}
          tabIndex={-1}
          onMouseDown={(e) => { e.preventDefault(); focused === "m" ? stepM(-1) : stepH(-1); }}
          aria-label="Decrement"
        >▼</button>
      </div>
    </div>
  );
}

function DaysMultiSelect({ value, onChange, workingDays, disabled, hasError }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    const handler = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, [open]);

  const short = (v) => {
    if (!v?.length) return "Pick days";
    if (v.length === workingDays.length) return "Every working day";
    return v.map((i) => DAY_LABELS[i].slice(0, 3)).join(", ");
  };

  const toggle = (i) => {
    const next = value.includes(i) ? value.filter((x) => x !== i) : [...value, i].sort();
    onChange(next);
  };

  const selectAll = () => onChange([...workingDays]);
  const clearAll = () => onChange([]);

  return (
    <div ref={wrapRef} className="days-ms-wrap">
      <button
        type="button"
        className={`cascader-trigger ${hasError ? "error" : ""} ${open ? "open" : ""}`}
        disabled={disabled}
        onClick={() => setOpen((v) => !v)}
        style={{ textAlign: "left", width: "100%" }}
      >
        <span style={{
          overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
          color: value.length ? "var(--color-neutral-dark-1)" : "var(--color-neutral-dark-4)",
        }}>
          {short(value)}
        </span>
        <ChevronDown size={14} style={{ transition: "transform 0.15s", transform: open ? "rotate(180deg)" : "none", color: "var(--color-neutral-dark-3)" }} />
      </button>
      {open && (
        <div className="days-ms-panel">
          <div className="days-ms-actions">
            <button type="button" className="btn-text-14" style={{ fontSize: 11 }} onClick={selectAll}>Select all</button>
            <button type="button" className="btn-text-14" style={{ fontSize: 11, color: "var(--color-neutral-dark-2)" }} onClick={clearAll}>Clear</button>
          </div>
          <div className="days-ms-list">
            {DAY_LABELS.map((d, i) => {
              if (!workingDays.includes(i)) return null;
              const checked = value.includes(i);
              return (
                <label key={d} className="days-ms-option" onClick={(e) => { e.preventDefault(); toggle(i); }}>
                  <span className={`checkbox-input ${checked ? "checked" : ""}`} style={{ width: 14, height: 14 }}>
                    {checked && <Check size={10} strokeWidth={3.2} color="#fff" />}
                  </span>
                  <span style={{ fontSize: 13 }}>{d}</span>
                </label>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   SCHEDULE TABLE
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

function ScheduleTable({
  tab,
  allTabs,
  onUpdateRow,
  onAddGroup,
  onRemoveGroup,
  processingRowId,
  pausedOnErrorRowId,
  phase,
}) {
  const rowErrors = useMemo(() => {
    const map = {};
    for (const r of tab.rows) {
      if (r.status === "scheduled") { map[r.id] = []; continue; }
      map[r.id] = detectFieldErrors(r);
    }
    return map;
  }, [tab]);

  const termDays = tab.term.workingDays;

  const groups = useMemo(() => {
    const order = [];
    const map = {};
    for (const r of tab.rows) {
      const key = r.subject || `__untitled_${r.id}`;
      if (!(key in map)) {
        order.push(key);
        map[key] = {
          key,
          subject: r.subject,
          subjectType: r.subjectType,
          specialisation: r.specialisation,
          isPrime: r.isPrime,
          isLab: r.isLab,
          rows: [],
        };
      }
      map[key].rows.push(r);
    }
    return order.map((k) => map[k]);
  }, [tab.rows]);

  return (
    <div className="sched-table-wrap">
      <table className="sched-table">
        <colgroup>
          <col style={{ width: 230 }} />
          <col style={{ width: 115 }} />
          <col style={{ width: 115 }} />
          <col style={{ width: 105 }} />
          <col style={{ width: 105 }} />
          <col style={{ width: 170 }} />
          <col style={{ width: 200 }} />
          <col style={{ width: 200 }} />
        </colgroup>
        <thead>
          <tr>
            <th>Subject / Section</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>Days Repeated</th>
            <th>Faculty</th>
            <th>Faculty 2</th>
          </tr>
        </thead>
        <tbody>
          {tab.rows.length === 0 && (
            <tr>
              <td colSpan={8} style={{ textAlign: "center", padding: "40px 16px", color: "var(--color-neutral-dark-3)", background: "#FFFFFF" }}>
                No subjects have been added to Academic Management for this term yet.
              </td>
            </tr>
          )}
          {groups.map((group, gi) => {
            const totalStudents = group.rows.reduce((s, r) => {
              return s + (r.studentCount || 0);
            }, 0);
            const sectionCount = new Set(group.rows.flatMap((r) => r.sections || [])).size;

            return (
              <React.Fragment key={group.key}>
                <tr className="group-head-row">
                  <td colSpan={8} className="group-head-cell">
                    <div className="group-head">
                      <div className="group-head-left">
                        <div className="group-head-title">{group.subject || <span style={{ color: "var(--color-neutral-dark-4)" }}>Untitled subject</span>}</div>
                        <div className="group-head-tags">
                          <SubjectTypeTag type={group.subjectType} specialisation={group.specialisation} />
                          {group.isPrime && <span className="tag-small tag-accent-a">PRIME</span>}
                          {group.isLab && <span className="tag-small tag-accent-d">Lab</span>}
                          <span className="group-head-meta">
                            <Users size={11} />
                            {totalStudents} student{totalStudents === 1 ? "" : "s"} · {sectionCount} section{sectionCount === 1 ? "" : "s"}
                          </span>
                        </div>
                      </div>
                    </div>
                  </td>
                </tr>

                {group.rows.map((row, ri) => {
                  const errs = rowErrors[row.id] || [];
                  const errByField = errs.reduce((acc, e) => { acc[e.field] = e.message; return acc; }, {});
                  const touched = row.touched || {};
                  const fieldErr = (field) => touched[field] ? (errByField[field] || null) : null;
                  const rowStatusClass = row.status === "error"
                    ? "row-error"
                    : row.status === "processing"
                    ? "row-processing"
                    : row.status === "creating"
                    ? "row-creating"
                    : row.status === "scheduled"
                    ? "row-scheduled"
                    : row.status === "pending"
                    ? "row-pending"
                    : "";
                  const isLocked = row.status === "scheduled" || row.status === "processing" || row.status === "creating" || phase === "submitting";
                  const isLast = ri === group.rows.length - 1;

                  const isPartOfFamily = !!row.groupParentKey;
                  const sectionLabel = (row.sections || []).join(", ");
                  const familySize = isPartOfFamily
                    ? group.rows.filter((r) => r.groupParentKey === row.groupParentKey).length
                    : 1;
                  const isSectionHead = !isPartOfFamily ||
                    group.rows.findIndex((r) => r.groupParentKey === row.groupParentKey) === ri;

                  return (
                    <React.Fragment key={row.id}>
                      <tr className={`group-body-row ${rowStatusClass} ${isLast ? "group-last" : ""} ${isPartOfFamily ? "is-group-row" : ""} ${isPartOfFamily && !isSectionHead ? "is-group-child" : ""}`}>
                        <td className="section-cell">
                          <div className="section-pill">
                            {isPartOfFamily ? (
                              <>
                                {isSectionHead && (
                                  <span className="section-pill-context">Section {sectionLabel}</span>
                                )}
                                <span className="section-pill-label">
                                  <span className="section-group-glyph" aria-hidden>└</span>
                                  {row.groupLabel}
                                </span>
                              </>
                            ) : (
                              <span className="section-pill-label">Section {sectionLabel}</span>
                            )}
                            <span className="section-pill-sub">
                              <Users size={10} /> {row.studentCount} student{row.studentCount === 1 ? "" : "s"}
                            </span>
                            {(() => {
                              const scheduled = row.status === "scheduled" ? countSessions(row) : 0;
                              return (
                                <span className="section-pill-sub">
                                  <Calendar size={10} /> {scheduled} class{scheduled === 1 ? "" : "es"} scheduled
                                  <span className="sched-ext-wrap">
                                    <a className="sched-ext-link" href="#" target="_blank" rel="noopener noreferrer" onClick={(e) => e.preventDefault()}>
                                      <ExternalLink size={10} />
                                    </a>
                                    <span className="sched-ext-tooltip">View scheduled classes for this section in Scheduler</span>
                                  </span>
                                </span>
                              );
                            })()}
                          </div>

                          {group.isLab && isSectionHead && !isLocked && (
                            <div className="groups-stepper" title={familySize === 1 ? "Split this lab section into parallel groups" : "Adjust the number of parallel groups"}>
                              <span className="groups-stepper-label">Groups</span>
                              <button
                                type="button"
                                className="groups-stepper-btn"
                                disabled={familySize <= 1}
                                onClick={() => {
                                  if (familySize <= 1) return;
                                  onRemoveGroup(row.groupParentKey);
                                }}
                                aria-label="Remove last group"
                              >
                                <Minus size={12} strokeWidth={2.5} />
                              </button>
                              <span className="groups-stepper-count">{familySize}</span>
                              <button
                                type="button"
                                className="groups-stepper-btn"
                                disabled={familySize >= 6}
                                onClick={() => onAddGroup(row.id)}
                                aria-label="Add another group"
                              >
                                <Plus size={12} strokeWidth={2.5} />
                              </button>
                            </div>
                          )}
                        </td>

                        <td>
                          <input
                            type="date"
                            className={`text-input ${fieldErr("startDate") ? "error" : ""}`}
                            value={row.startDate}
                            min={tab.term.startDate}
                            max={tab.term.endDate}
                            disabled={isLocked}
                            onChange={(e) => onUpdateRow(row.id, { startDate: e.target.value })}
                          />
                        </td>
                        <td>
                          <input
                            type="date"
                            className={`text-input ${fieldErr("endDate") ? "error" : ""}`}
                            value={row.endDate}
                            min={row.startDate || tab.term.startDate}
                            max={tab.term.endDate}
                            disabled={isLocked}
                            onChange={(e) => onUpdateRow(row.id, { endDate: e.target.value })}
                          />
                        </td>

                        <td>
                          <TimePicker
                            value={row.startTime}
                            onChange={(v) => onUpdateRow(row.id, { startTime: v })}
                            disabled={isLocked}
                            hasError={!!fieldErr("startTime")}
                            placeholder="Start"
                          />
                        </td>
                        <td>
                          <TimePicker
                            value={row.endTime}
                            onChange={(v) => onUpdateRow(row.id, { endTime: v })}
                            disabled={isLocked}
                            hasError={!!fieldErr("endTime")}
                            placeholder="End"
                          />
                        </td>

                        <td>
                          <DaysMultiSelect
                            value={row.days}
                            onChange={(next) => onUpdateRow(row.id, { days: next })}
                            workingDays={termDays}
                            disabled={isLocked}
                            hasError={!!fieldErr("days")}
                          />
                        </td>

                        <td>
                          <select
                            className={`cascader-trigger ${fieldErr("facultyId") ? "error" : ""}`}
                            value={row.facultyId}
                            disabled={isLocked}
                            onChange={(e) => onUpdateRow(row.id, { facultyId: e.target.value })}
                          >
                            <option value="">Select faculty</option>
                            {getFacultyForRow(tab.campusId, row.subjectId, row.sectionId).map((f) => (
                              <option key={f.id} value={String(f.id)}>{f.name}</option>
                            ))}
                          </select>
                        </td>

                        <td>
                          <select
                            className="cascader-trigger"
                            value={row.secondaryFacultyId}
                            disabled={isLocked}
                            onChange={(e) => onUpdateRow(row.id, { secondaryFacultyId: e.target.value })}
                          >
                            <option value="">Optional</option>
                            {getFacultyForRow(tab.campusId, row.subjectId, row.sectionId).map((f) => (
                              <option key={f.id} value={String(f.id)}>{f.name}</option>
                            ))}
                          </select>
                        </td>
                      </tr>

                      {row.status === "error" && row.errorMessage && (
                        <tr>
                          <td colSpan={8} style={{ padding: 0 }}>
                            <div className="row-error-banner">
                              <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                                <AlertCircle size={16} color="var(--color-error-1)" style={{ flexShrink: 0, marginTop: 1 }} />
                                <div>
                                  <div style={{ fontSize: 12, fontWeight: 700, color: "var(--color-error-2)", marginBottom: 2 }}>
                                    Conflict detected
                                  </div>
                                  <div className="row-error-text">{row.errorMessage}</div>
                                </div>
                              </div>
                            </div>
                          </td>
                        </tr>
                      )}

                      {phase === "edit" && row.status !== "error" && errs.length > 0 && Object.keys(row.touched || {}).length > 0 && (
                        <tr>
                          <td colSpan={8} style={{ padding: "0 14px 8px" }}>
                            <div style={{ fontSize: 11, color: "var(--color-error-2)", display: "flex", alignItems: "flex-start", gap: 6 }}>
                              <AlertCircle size={12} style={{ marginTop: 1, flexShrink: 0 }} />
                              <span>{errs.filter(e => (row.touched || {})[e.field]).map((e) => e.message).join("  •  ")}</span>
                            </div>
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  );
                })}

                {gi < groups.length - 1 && (
                  <tr className="group-spacer"><td colSpan={8} /></tr>
                )}
              </React.Fragment>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   DEMO LAUNCHER
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function App() {
  const [open, setOpen] = useState(false);
  const [campusId, setCampusId] = useState(DEFAULT_CAMPUS_ID);

  const selectedCampus = CAMPUS_DATA.campuses.find((c) => c.id === campusId) || CAMPUS_DATA.campuses[0];

  const weekDays = [
    { name: "MON", num: 26 },
    { name: "TUE", num: 27 },
    { name: "WED", num: 28 },
    { name: "THU", num: 29 },
    { name: "FRI", num: 30 },
    { name: "SAT", num: "01", today: true },
    { name: "SUN", num: "02", sunday: true },
  ];
  const timeRows = Array.from({ length: 13 }, (_, i) => ({ label: "1 AM", id: i }));
  const nowRowIndex = 0;
  const nowDayIndex = 5;

  return (
    <div className="demo-page sun-root">
      <SunstoneStyles />
      <style>{`.spin { animation: sunspin 0.9s linear infinite; } @keyframes sunspin { to { transform: rotate(360deg); } }`}</style>

      <div className="demo-brand">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
          <path d="M3 18 L9 10 L13 14 L18 8 L23 18 Z" fill="var(--color-primary)" />
          <path d="M3 20 L23 20 L21 23 L5 23 Z" fill="var(--color-primary)" opacity="0.6" />
        </svg>
        <span className="demo-brand-logo">SUNSTONE</span>
      </div>

      <div className="demo-layout">
        <aside className="demo-rail">
          <div className="demo-rail-tabs">
            <button className="demo-rail-tab">Groups</button>
            <button className="demo-rail-tab active">Bulk Schedule</button>
          </div>
          <div className="demo-rail-body">
            <h2 className="demo-rail-title">Bulk Schedule</h2>
            <p className="demo-rail-desc">
              Plan every recurring class for the upcoming semester across all program × batch combinations on your campus in one flow. The system auto-detects faculty and group conflicts before anything touches the live academic calendar — so modifications after the fact stay low.
            </p>
            <div className="demo-rail-divider" />
            <label className="demo-rail-label">Campus<span className="req">*</span></label>
            <select
              className="cascader-trigger demo-rail-campus"
              value={campusId}
              onChange={(e) => setCampusId(parseInt(e.target.value, 10))}
            >
              {CAMPUS_DATA.campuses.map((c) => (
                <option key={c.id} value={c.id}>
                  {c.full_name || c.name}
                </option>
              ))}
            </select>
            <button
              className="btn-primary-light demo-rail-cta"
              onClick={() => setOpen(true)}
            >
              Start Scheduling <ChevronRight size={16} />
            </button>
            <div className="demo-rail-note">
              <strong>Term defaults are picked up automatically</strong>
              Start date, end date, session slot duration and weekly off come from Academic Management. Tabs without a configured term will show an empty state.
            </div>
          </div>
        </aside>

        <section className="demo-cal">
          <div className="demo-cal-toolbar">
            <div className="demo-cal-toolbar-left">
              <button className="demo-cal-schedule-btn" onClick={() => setOpen(true)}>
                <Plus size={16} strokeWidth={2.2} /> Schedule
              </button>
            </div>
            <div className="demo-cal-nav">
              <button className="demo-cal-nav-btn" aria-label="Previous week">
                <ChevronRight size={14} style={{ transform: "rotate(180deg)" }} />
              </button>
              <span className="demo-cal-range">26 Oct - 02 Nov</span>
              <button className="demo-cal-nav-btn" aria-label="Next week">
                <ChevronRight size={14} />
              </button>
            </div>
            <div className="demo-cal-toolbar-right">
              <button className="demo-cal-pill">Today</button>
              <select className="demo-cal-select" defaultValue="week">
                <option value="day">Day</option>
                <option value="week">Week</option>
                <option value="month">Month</option>
              </select>
              <select className="demo-cal-select" defaultValue="2026">
                <option value="2024">2024</option>
                <option value="2025">2025</option>
                <option value="2026">2026</option>
              </select>
            </div>
          </div>

          <div className="demo-cal-grid">
            <div className="demo-cal-timehead" />
            {weekDays.map((d, i) => (
              <div
                key={d.name}
                className={`demo-cal-dayhead ${d.today ? "is-today" : ""} ${d.sunday ? "is-sunday" : ""}`}
              >
                <div className="demo-cal-dayname">{d.name}</div>
                <div className="demo-cal-daynum">{d.num}</div>
              </div>
            ))}

            {timeRows.map((row, ri) => (
              <React.Fragment key={row.id}>
                <div className="demo-cal-timecell">{row.label}</div>
                {weekDays.map((d, di) => (
                  <div
                    key={di}
                    className={`demo-cal-slot ${d.sunday ? "is-sunday" : ""}`}
                  >
                    {ri === nowRowIndex && di === nowDayIndex && (
                      <div className="demo-cal-now" />
                    )}
                    {ri === nowRowIndex && di > nowDayIndex && (
                      <div className="demo-cal-now demo-cal-now-continue" />
                    )}
                  </div>
                ))}
              </React.Fragment>
            ))}
          </div>
        </section>
      </div>

      <BulkScheduleDrawer
        open={open}
        onClose={() => setOpen(false)}
        campusId={campusId}
        campusName={selectedCampus?.full_name || selectedCampus?.name || "Campus"}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
