   lucide UMD exposes each icon at window.lucide[Name] as [tagName, attrs, children].
   Attrs use SVG kebab-case (stroke-width, stroke-linecap, …) which React needs as camelCase. */
function kebabToCamelProps(obj) {
  const out = {};
  for (const k of Object.keys(obj || {})) {
    const ck = k.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    out[ck] = obj[k];
  }
  return out;
}
function makeLucideIcon(name) {
  return function LucideIconWrap({ size = 24, color, strokeWidth, className = '', style, ...rest }) {
    const src = window.lucide || {};
    const node = (src.icons && src.icons[name]) || src[name] || null;
    if (!node) return null;
    const [tag, attrs, children = []] = node;
    const svgProps = {
      ...kebabToCamelProps(attrs),
      width: size,
      height: size,
      ...(color != null ? { stroke: color } : {}),
      ...(strokeWidth != null ? { strokeWidth } : {}),
      className,
      style,
      ...rest,
    };
    return React.createElement(
      tag,
      svgProps,
      children.map(([t, a], i) =>
        React.createElement(t, { key: i, ...kebabToCamelProps(a) })
      )
    );
  };
}

    }

    /* Row error banner */
    .row-error-banner {
      padding: 10px 12px;
      background: var(--color-error-5);
      border-left: 3px solid var(--color-error-1);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .row-error-text {
      font-size: 12px;
      line-height: 16px;
      color: var(--color-error-2);
      font-weight: 500;
    }

    /* ── GROUP HEAD (subject banner) ────── */
    .group-head-row td.group-head-cell {
      padding: 0;
      background: transparent;
      border-bottom: none;
    }
    .group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px;
      background: linear-gradient(180deg, rgba(34, 54, 106, 0.09) 0%, rgba(34, 54, 106, 0.05) 100%);
      border-left: 3px solid var(--color-primary);
      border-top: 1px solid rgba(34, 54, 106, 0.14);
      border-bottom: 1px solid rgba(34, 54, 106, 0.14);
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
      margin: 0 0 0 0;
    }
    .group-head-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .group-head-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 0.005em;
      line-height: 1.25;
    }
    .group-head-tags {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .group-head-meta {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--color-neutral-dark-2);
      padding-left: 2px;
      white-space: nowrap;
      font-weight: 500;
    }

    /* ── GROUP BODY ROWS ─────────────────── */
    .group-body-row td {
      background: #FFFFFF;
      border-bottom: 1px solid var(--color-neutral-dark-6);
      border-left: 3px solid transparent;
    }
    .group-body-row td:first-child {
      border-left: 3px solid var(--color-primary-2);
    }
    .group-body-row.group-last td {
      border-bottom: 1px solid var(--color-neutral-dark-5);
    }
    .group-body-row.group-last td:first-child {
      border-bottom-left-radius: 6px;
    }
    .group-body-row.group-last td:last-child {
      border-bottom-right-radius: 6px;
    }

    /* Status-specific row tinting — keep the left border accent */
    .group-body-row.row-error td      { background: #FFFAFA; }
    .group-body-row.row-processing td { background: #FFF9EC; }
    .group-body-row.row-creating td   { background: #F6F4FB; }
    .group-body-row.row-scheduled td  { background: #F3FBF6; }
    .group-body-row.row-scheduled td:first-child  { border-left-color: var(--color-success-1); }
    .group-body-row.row-error td:first-child      { border-left-color: var(--color-error-1); }
    .group-body-row.row-processing td:first-child { border-left-color: var(--color-warning-1); }
    .group-body-row.row-creating td:first-child   { border-left-color: var(--color-accent-b-2); }
    .group-body-row.row-pending td    { background: #F9FAFF; }

    /* Spacer row between groups */
    .group-spacer td {
      padding: 0;
      height: 12px;
      background: transparent;
      border-bottom: none;
    }

    /* ── SECTION CELL (inside a group) ───── */
    .section-cell {
      vertical-align: middle !important;
    }
    .section-pill {
      display: inline-flex;
      flex-direction: column;
      gap: 2px;
      padding: 6px 10px;
      background: var(--color-primary-3);
      border-radius: 4px;
      border: 1px solid rgba(34, 54, 106, 0.08);
      min-width: 140px;
    }
    .section-pill-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    /* The small "Section A" breadcrumb shown above a group label on the section head */
    .section-pill-context {
      font-size: 10px;
      font-weight: 600;
      color: var(--color-neutral-dark-3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      line-height: 1.2;
    }
    /* Tree-glyph leading a group label, e.g. "└ Group 2" */
    .section-group-glyph {
      color: var(--color-primary-2);
      font-weight: 400;
      font-size: 13px;
      opacity: 0.75;
    }
    .section-pill-sub {
      font-size: 11px;
      color: var(--color-neutral-dark-3);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .sched-ext-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .sched-ext-link {
      display: inline-flex;
      align-items: center;
      color: var(--color-primary-2);
      text-decoration: none;
      transition: color 0.12s;
      line-height: 1;
    }
    .sched-ext-link:hover { color: var(--color-primary); }
    .sched-ext-tooltip {
      display: none;
      position: absolute;
      bottom: calc(100% + 5px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--color-primary-4);
      color: #fff;
      font-size: 11px;
      font-weight: 400;
      white-space: nowrap;
      padding: 4px 8px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 200;
    }
    .sched-ext-wrap:hover .sched-ext-tooltip { display: block; }

    /* Rows that belong to a group family — subtler pill, indented */
    .group-body-row.is-group-row .section-cell {
      padding-left: 28px !important;
    }
    .group-body-row.is-group-row .section-pill {
      background: #FFFFFF;
      border-color: rgba(65, 50, 114, 0.20);
    }
    .group-body-row.is-group-row .section-pill-label {
      color: var(--color-accent-b-2);
      font-weight: 600;
    }
    /* Child rows (non-head groups) get a lighter left-border accent */
    .group-body-row.is-group-child td:first-child {
      border-left: 3px solid rgba(34, 54, 106, 0.15);
    }

    /* ── GROUPS STEPPER ──────────────────── */
    .groups-stepper {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      padding: 3px 6px 3px 8px;
      background: #FFFFFF;
      border: 1px solid var(--color-neutral-dark-5);
      border-radius: 18px;
      width: fit-content;
    }
    .groups-stepper-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-neutral-dark-2);
      padding-right: 4px;
      border-right: 1px solid var(--color-neutral-dark-6);
      margin-right: 2px;
      letter-spacing: 0.02em;
    }
    .groups-stepper-count {
      font-size: 12px;
      font-weight: 700;
      color: var(--color-primary);
      min-width: 14px;
      text-align: center;
    }
    .groups-stepper-btn {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      background: var(--color-primary-3);
      color: var(--color-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.12s ease, color 0.12s ease;
      font-family: inherit;
      padding: 0;
    }
    .groups-stepper-btn:hover:not(:disabled) {
      background: var(--color-primary);
      color: #FFFFFF;
    }
    .groups-stepper-btn:active:not(:disabled) {
      background: var(--color-primary-4);
      color: #FFFFFF;
    }
    .groups-stepper-btn:disabled {
      background: transparent;
      color: var(--color-neutral-dark-4);
      cursor: not-allowed;
    }

    /* ── DAYS MULTI-SELECT ───────────────── */
    .days-ms-wrap {
      position: relative;
      width: 100%;
    }

    /* ── TIME PICKER ─────────────────────── */
    .tp-wrap {
      display: inline-flex;
      align-items: center;
      gap: 0;
      border: 1px solid var(--color-neutral-dark-5);
      border-radius: 4px;
      background: #fff;
      width: 100%;
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .tp-wrap:focus-within {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(34,54,106,0.08);
    }
    .tp-wrap.tp-error { border-color: var(--color-error-1); background: #FFFAFA; }
    .tp-wrap.tp-disabled { opacity: 0.5; background: var(--color-neutral-dark-6); pointer-events: none; }
    .tp-seg {
      flex: 1;
      padding: 6px 4px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      text-align: center;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--color-neutral-dark-1);
      border-radius: 0;
      min-width: 28px;
      letter-spacing: 0.02em;
      transition: background 0.1s;
    }
    .tp-seg:focus { outline: none; background: var(--color-primary-3); color: var(--color-primary); }
    .tp-seg.tp-seg-focused { background: var(--color-primary-3); color: var(--color-primary); }
    .tp-seg.tp-seg-empty { color: var(--color-neutral-dark-3); }
    .tp-colon {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-neutral-dark-2);
      padding: 0 1px;
      user-select: none;
    }
    .tp-steppers {
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--color-neutral-dark-6);
      flex-shrink: 0;
    }
    .tp-step {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 15px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 8px;
      color: var(--color-neutral-dark-3);
      padding: 0;
      line-height: 1;
      transition: background 0.1s, color 0.1s;
    }
    .tp-step:hover { background: var(--color-neutral-dark-6); color: var(--color-primary); }
    .tp-step:first-child { border-bottom: 1px solid var(--color-neutral-dark-6); }
    .days-ms-panel {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 100%;
      min-width: 180px;
      background: #FFFFFF;
      border: 1px solid var(--color-neutral-dark-5);
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(12, 12, 12, 0.10), 0 2px 4px rgba(12, 12, 12, 0.04);
      z-index: 40;
      overflow: hidden;
      animation: dmsPop 0.12s ease;
    }
    @keyframes dmsPop {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .days-ms-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-bottom: 1px solid var(--color-neutral-dark-6);
      background: #FAFBFC;
    }
    .days-ms-actions .btn-text-14 {
      padding: 2px 0;
    }
    .days-ms-list {
      display: flex;
      flex-direction: column;
      max-height: 240px;
      overflow-y: auto;
    }
    .days-ms-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.1s ease;
      color: var(--color-neutral-dark-1);
    }
    .days-ms-option:hover {
      background-color: var(--color-primary-3);
    }
    .cascader-trigger.open {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(34, 54, 106, 0.08);
    }

    /* Progress bar */
    .progress-bar {
      height: 4px;
      background: var(--color-neutral-dark-6);
      border-radius: 2px;
      overflow: hidden;
      flex: 1;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--color-primary) 0%, var(--color-primary-5) 100%);
      transition: width 0.4s ease;
    }

    /* Empty state for missing term */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 32px;
      text-align: center;
      gap: 12px;
    }
    .empty-state-icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--color-warning-5);
      color: var(--color-warning-2);
      display: inline-flex;
      align-items: center; justify-content: center;
    }
    .empty-state-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-neutral-dark-1);
    }
    .empty-state-desc {
      font-size: 13px;
      color: var(--color-neutral-dark-2);
      max-width: 400px;
    }

    /* Success screen */
    .success-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 32px;
      text-align: center;
      gap: 16px;
      flex: 1;
    }
    .success-icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--color-success-5);
      color: var(--color-success-2);
      display: inline-flex;
      align-items: center; justify-content: center;
    }
    .success-title { font-size: 22px; font-weight: 700; color: var(--color-neutral-dark-1); }
    .success-desc  { font-size: 14px; color: var(--color-neutral-dark-2); max-width: 520px; }

    /* Launcher (demo page) — two-column layout matching screenshot */
    .demo-page {
      min-height: 100vh;
      background: #F5F6FA;
      padding: 24px 32px 32px;
      font-family: 'Public Sans', sans-serif;
      color: var(--color-neutral-dark-1);
    }
    .demo-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-left: 4px;
    }
    .demo-brand-logo {
      font-family: 'Public Sans', sans-serif;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--color-primary);
    }

    .demo-layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      align-items: start;
    }

    /* LEFT RAIL ---------------------------- */
    .demo-rail {
      background: #FFFFFF;
      border-radius: 10px;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(12, 12, 12, 0.04);
    }
    .demo-rail-tabs {
      display: flex;
      padding: 0 24px;
      border-bottom: 1px solid var(--color-neutral-dark-5);
    }
    .demo-rail-tab {
      padding: 16px 4px;
      margin-right: 28px;
      font-size: 15px;
      font-weight: 500;
      color: var(--color-neutral-dark-3);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .demo-rail-tab:hover { color: var(--color-neutral-dark-2); }
    .demo-rail-tab.active {
      color: var(--color-primary);
      font-weight: 700;
      border-bottom-color: var(--color-primary);
    }

    .demo-rail-body {
      padding: 24px;
    }
    .demo-rail-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--color-neutral-dark-1);
      margin: 0 0 12px;
      letter-spacing: -0.01em;
    }
    .demo-rail-desc {
      font-size: 14px;
      line-height: 22px;
      color: var(--color-neutral-dark-2);
      margin: 0 0 24px;
    }
    .demo-rail-divider {
      height: 1px;
      background: var(--color-neutral-dark-5);
      margin: 0 0 20px;
    }
    .demo-rail-label {
      display: block;
      font-size: 13px;
      color: var(--color-neutral-dark-2);
      margin-bottom: 6px;
    }
    .demo-rail-label .req { color: var(--color-error-1); }

    .demo-rail-campus {
      padding: 10px 14px;
      font-size: 14px;
      min-height: 42px;
      margin-bottom: 20px;
      width: 100%;
    }
    .demo-rail-cta {
      width: 100%;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .demo-rail-note {
      background: #E4F1FC;
      border-radius: 4px;
      padding: 12px 14px;
      font-size: 12.5px;
      line-height: 18px;
      color: var(--color-neutral-dark-2);
    }
    .demo-rail-note strong {
      display: block;
      color: var(--color-neutral-dark-1);
      font-weight: 700;
      margin-bottom: 3px;
    }

    /* RIGHT CALENDAR ----------------------- */
    .demo-cal {
      background: #FFFFFF;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(12, 12, 12, 0.04);
    }
    .demo-cal-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      gap: 16px;
    }
    .demo-cal-toolbar-left,
    .demo-cal-toolbar-right {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .demo-cal-schedule-btn {
      padding: 10px 18px;
      background: var(--color-primary);
      color: #FFFFFF;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
    }
    .demo-cal-schedule-btn:hover { background: var(--color-primary-5); }
    .demo-cal-nav {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .demo-cal-nav-btn {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: none;
      background: var(--color-neutral-dark-6);
      color: var(--color-neutral-dark-2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .demo-cal-nav-btn:hover { background: var(--color-neutral-dark-5); }
    .demo-cal-range {
      font-size: 16px;
      font-weight: 700;
      color: var(--color-neutral-dark-1);
      letter-spacing: 0.01em;
    }
    .demo-cal-pill {
      padding: 6px 14px;
      font-size: 13px;
      color: var(--color-neutral-dark-2);
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-family: inherit;
    }
    .demo-cal-pill:hover { background: var(--color-neutral-dark-6); }
    .demo-cal-select {
      padding: 6px 10px;
      font-size: 13px;
      border: none;
      background: none;
      color: var(--color-neutral-dark-2);
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%230C0C0C' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 4px center;
      padding-right: 20px;
      font-family: inherit;
    }

    /* Week grid */
    .demo-cal-grid {
      display: grid;
      grid-template-columns: 50px repeat(7, 1fr);
      border-top: 1px solid var(--color-neutral-dark-6);
    }
    .demo-cal-dayhead {
      padding: 14px 12px 18px;
      border-right: 1px solid var(--color-neutral-dark-6);
      border-bottom: 1px solid var(--color-neutral-dark-5);
      text-align: center;
    }
    .demo-cal-dayhead:last-child { border-right: none; }
    .demo-cal-dayhead.is-sunday { background: #FAFBFC; }
    .demo-cal-dayhead.is-today .demo-cal-daynum {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--color-primary);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center; justify-content: center;
    }
    .demo-cal-dayhead.is-sunday .demo-cal-dayname,
    .demo-cal-dayhead.is-sunday .demo-cal-daynum {
      color: var(--color-neutral-dark-3);
    }
    .demo-cal-dayname {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--color-neutral-dark-3);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .demo-cal-daynum {
      font-size: 20px;
      font-weight: 400;
      color: var(--color-neutral-dark-1);
    }

    .demo-cal-timehead {
      border-right: 1px solid var(--color-neutral-dark-6);
      border-bottom: 1px solid var(--color-neutral-dark-5);
    }
    .demo-cal-timecell {
      padding: 22px 8px 0 0;
      text-align: right;
      font-size: 11px;
      color: var(--color-neutral-dark-3);
      border-right: 1px solid var(--color-neutral-dark-6);
      border-bottom: 1px solid var(--color-neutral-dark-6);
      min-height: 72px;
      box-sizing: border-box;
    }
    .demo-cal-slot {
      border-right: 1px solid var(--color-neutral-dark-6);
      border-bottom: 1px solid var(--color-neutral-dark-6);
      min-height: 72px;
      position: relative;
    }
    .demo-cal-slot:last-child { border-right: none; }
    .demo-cal-slot.is-sunday { background: #FAFBFC; }

    /* Current-time red indicator line */
    .demo-cal-now {
      position: absolute;
      left: 0; right: 0;
      top: 28%;
      height: 1px;
      background: var(--color-error-1);
      pointer-events: none;
      z-index: 1;
    }
    .demo-cal-now::before {
      content: "";
      position: absolute;
      left: -6px;
      top: -5px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--color-error-1);
    }
    .demo-cal-now-continue::before {
      display: none;
    }

    /* Scrollbar refinement */
    .drawer-body::-webkit-scrollbar,
    .drawer-tabs::-webkit-scrollbar { height: 6px; width: 6px; }
    .drawer-body::-webkit-scrollbar-thumb,
    .drawer-tabs::-webkit-scrollbar-thumb {
      background: var(--color-neutral-dark-4);
      border-radius: 3px;
    }

    /* tab error dot */
    .tab-error-dot {
      display: inline-block;
      width: 8px; height: 8px;

/** All faculty across all campuses — keyed by id for quick lookup */
const ALL_FACULTY = (() => {
  const out = {};
  for (const c of CAMPUS_DATA.campuses) {
    for (const f of c.faculty) out[f.id] = f;
  }
  return out;
})();

/** Get the faculty list for a campus (for the Faculty dropdown options) */
function getFacultyForCampus(campusId) {
  const c = CAMPUS_DATA.campuses.find((x) => x.id === campusId);
  return c ? c.faculty.map((f) => ({ id: f.id, name: (f.name || "").trim() || `Faculty ${f.id}` })) : [];
}

/**
 * Suggest faculty ordering for a subject within a campus: put the faculty
 * already mapped to any section of this subject at the top, then the rest.
 * This mirrors how Academic Management's mapping would feed the dropdown.
 */
function facultySuggestionsForSubject(campusId, subjectId) {
  const c = CAMPUS_DATA.campuses.find((x) => x.id === campusId);
  if (!c) return [];
  const mappedIds = new Set();
  for (const p of c.programs) {
    for (const t of p.terms || []) {
      for (const s of t.subjects) {
        if (s.id !== subjectId) continue;
        for (const sec of s.sections) {
          if (sec.primary_faculty_id) mappedIds.add(sec.primary_faculty_id);
          if (sec.secondary_faculty_id) mappedIds.add(sec.secondary_faculty_id);
        }
      }
    }
  }
  const ordered = [];
  for (const fid of mappedIds) {
    const f = ALL_FACULTY[fid];
    if (f) ordered.push({ id: f.id, name: (f.name || "").trim() || `Faculty ${f.id}` });
  }
  for (const f of c.faculty) {
    if (!mappedIds.has(f.id)) ordered.push({ id: f.id, name: (f.name || "").trim() || `Faculty ${f.id}` });
  }
  return ordered;
}

/**
 * Get faculty for a specific subject × section combination from PUSSM.
 */
function getFacultyForRow(campusId, subjectId, sectionId) {
  const secMap = PUSSM[subjectId];
  const campusFaculty = getFacultyForCampus(campusId);
  if (!secMap) return campusFaculty;
  const ids = secMap[sectionId];
  if (!ids || ids.length === 0) return campusFaculty;
  const result = [];
  const seen = new Set();
  for (const fid of ids) {
    if (seen.has(fid)) continue;
    seen.add(fid);
    const f = ALL_FACULTY[fid] || campusFaculty.find((x) => x.id === fid);
    if (f) result.push({ id: f.id, name: (f.name || "").trim() || `Faculty ${f.id}` });
  }
  return result.length > 0 ? result : campusFaculty;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   TAB BUILDER
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function buildTabsForCampus(campusId) {
  const campus = CAMPUS_DATA.campuses.find((c) => c.id === campusId);
  if (!campus) return [];

  const builtTabs = campus.programs.map((p) => {
    const degreeType = p.degree || null;
    const baseId = `${p.pcbm_id}`;
    const tabLabel = `${p.program} ${p.batch}${degreeType ? " · " + degreeType : ""} · ${p.offering}`;

    const TODAY = new Date().toISOString().slice(0, 10);
    const futureTerm = (p.terms || []).find(
      (t) => t.end_date && t.end_date >= TODAY && (t.subjects || []).length > 0
    ) || (p.terms || []).find((t) => t.end_date && t.end_date >= TODAY);
    const activeTerm = futureTerm;
    if (!activeTerm) {
      return {
        id: baseId,
        program: p.program,
        batch: String(p.batch),
        degreeType,
        offering: p.offering,
        termDefined: false,
        term: null,
        rows: [],
      };
    }

    const workingDays = (activeTerm.working_days || [])
      .map((d) => DAY_NAME_TO_INDEX[d.toLowerCase()])
      .filter((i) => i !== undefined)
      .sort();

    const termTypeLabel = activeTerm.type === "trimester" ? "Trimester" : "Semester";
    const termLabel = `${termTypeLabel} ${activeTerm.number} — Upcoming`;

    const rows = [];
    for (const subj of activeTerm.subjects) {
      const isPrime = PRIME_SUBJECT_IDS.has(subj.id);
      const specialisationName = subj.specialization_id
        ? (SPECIALIZATION_MAP[subj.specialization_id] || null)
        : null;
      const subjectType = subj.subject_type || "core";
      for (const sec of subj.sections) {
        rows.push(mkRow({
          subjectId: subj.id,
          sectionId: sec.id || null,
          subject: subj.name || "Untitled",
          subjectType,
          specialisation: specialisationName,
          isPrime,
          isLab: !!subj.is_lab,
          numGroups: 2,
          sections: [sec.section || "A"],
          studentCount: sec.students || 0,
          startDate: activeTerm.start_date || "",
          endDate: activeTerm.end_date || "",
          startTime: "",
          endTime: "",
          days: [],
          facultyId: sec.primary_faculty_id ? String(sec.primary_faculty_id) : "",
          secondaryFacultyId: sec.secondary_faculty_id ? String(sec.secondary_faculty_id) : "",
          isPrimeEvent: isPrime,
        }));
      }
    }

    return {
      id: baseId,
      program: p.program,
      batch: String(p.batch),
      degreeType,
      offering: p.offering,
      campusId: campus.id,
      termDefined: true,
      term: {
        label: termLabel,
        startDate: activeTerm.start_date,
        endDate: activeTerm.end_date,
        slotMinutes: activeTerm.slot_duration_minutes || 60,
        workingDays,
      },
      rows,
    };
  });

  return builtTabs.sort((a, b) => {
    if (a.termDefined === b.termDefined) return 0;
    return a.termDefined ? -1 : 1;
  });
}

   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
/** How many session occurrences fall in [startDate..endDate] on the selected days. */
function countSessions(row) {
  if (!row.startDate || !row.endDate || !row.days?.length) return 0;
  const start = new Date(row.startDate);
  const end   = new Date(row.endDate);
  if (isNaN(start) || isNaN(end) || start > end) return 0;
  const picked = new Set(row.days); // Mon=0 … Sun=6
  let count = 0;
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const ourDay = (d.getDay() + 6) % 7; // JS Sun=0 → our Sun=6
    if (picked.has(ourDay)) count++;
  }
  return count;
}

/** A row is "intended for this submit" iff any of startTime / endTime / days is filled.
    An all-empty-timing row is treated as not-being-scheduled-this-round — no errors,
    and startSubmission will skip it. */
function isRowIntended(row) {
  return !!(row.startTime || row.endTime || (row.days && row.days.length));
}

function detectFieldErrors(row) {
  const errs = [];
  const hasStart = !!row.startTime;
  const hasEnd   = !!row.endTime;
  const hasDays  = !!(row.days && row.days.length);
  const intended = hasStart || hasEnd || hasDays;
  const completeTiming = hasStart && hasEnd && hasDays;

  // Skip entirely if user hasn't engaged with this row's timing.
  if (!intended) return [];

  // All-or-nothing rule for the time triple.
  if (!completeTiming) {
    const msg = "Fill start time, end time, and days together — or clear all three.";
    if (!hasStart) errs.push({ field: "startTime", message: msg });
    if (!hasEnd)   errs.push({ field: "endTime",   message: msg });
    if (!hasDays)  errs.push({ field: "days",      message: msg });
  }
  if (hasStart && hasEnd && row.startTime >= row.endTime) {
    errs.push({ field: "endTime", message: "End time must be after start time." });
  }

  // Other required fields apply only once this row is being scheduled.
  if (!row.subject)   errs.push({ field: "subject",   message: "Subject is required." });
  if (!row.facultyId) errs.push({ field: "facultyId", message: "Primary faculty is required." });
  if (!row.startDate) errs.push({ field: "startDate", message: "Start date is required." });
  if (!row.endDate)   errs.push({ field: "endDate",   message: "End date is required." });

  const seen = new Set();
  return errs.filter((c) => { if (seen.has(c.message)) return false; seen.add(c.message); return true; });
}

function detectSheetConflicts(targetRow, targetTab, allTabs) {
  const conflicts = [];
  const tRow = targetRow;
  const timesOverlap = (a, b) => {
    if (!a.startTime || !a.endTime || !b.startTime || !b.endTime) return false;
    return a.startTime < b.endTime && a.endTime > b.startTime;
  };

  for (const tab of allTabs) {
    for (const r of tab.rows) {
      if (r.id === tRow.id) continue;
      if (!r.startTime || !r.endTime || !r.days?.length) continue;
      if (!tRow.startTime || !tRow.endTime || !tRow.days?.length) continue;
      const overlapDays = r.days.filter((d) => tRow.days.includes(d));
      if (!overlapDays.length) continue;
      if (!timesOverlap(tRow, r)) continue;

      const rowFaculty = [tRow.facultyId, tRow.secondaryFacultyId].filter(Boolean);
      const otherFaculty = [r.facultyId, r.secondaryFacultyId].filter(Boolean);
      const sharedFac = rowFaculty.find((f) => otherFaculty.includes(f));
      if (sharedFac) {
        const fName = (ALL_FACULTY[sharedFac]?.name || String(sharedFac)).trim();
        conflicts.push({
          field: "facultyId",
          message: `${fName} is already scheduled for "${r.subject}" in ${tab.program} ${tab.batch}${tab.degreeType ? " " + tab.degreeType : ""}${tab.offering ? " · " + tab.offering : ""} at an overlapping time.`,
        });
      }

      const sameLabFamily = tRow.groupParentKey && r.groupParentKey && tRow.groupParentKey === r.groupParentKey;
      if (
        !sameLabFamily &&
        tab.program === targetTab.program &&
        tab.batch === targetTab.batch &&
        (tab.degreeType || "") === (targetTab.degreeType || "") &&
        (tab.offering || "") === (targetTab.offering || "")
      ) {
        const sharedSection = (r.sections || []).some((s) => (tRow.sections || []).includes(s));
        if (sharedSection) {
          conflicts.push({
            field: "startTime",
            message: `Section ${(tRow.sections || []).join(", ")} already has "${r.subject}" at an overlapping time on the same day.`,
          });
        }
      }
    }
  }

  const seen = new Set();
  return conflicts.filter((c) => { if (seen.has(c.message)) return false; seen.add(c.message); return true; });
}

function detectRowConflicts(targetRow, targetTab, allTabs) {
  return [...detectFieldErrors(targetRow), ...detectSheetConflicts(targetRow, targetTab, allTabs)];
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   MAIN MODAL COMPONENT
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
function BulkScheduleDrawer({ open, onClose, campusId = DEFAULT_CAMPUS_ID, campusName = "Hi-Tech Institute of Technology" }) {
  const [tabs, setTabs] = useState(() => buildTabsForCampus(campusId));
  const [activeTabId, setActiveTabId] = useState(() => {
    const first = buildTabsForCampus(campusId)[0];
    return first ? first.id : null;
  });
  const [phase, setPhase] = useState("edit");
  const [processingRowId, setProcessingRowId] = useState(null);
  const [pausedOnErrorRowId, setPausedOnErrorRowId] = useState(null);
  const cancelRef = useRef(false);

  const [selectedProgram, setSelectedProgram] = useState(() => {
    const t = buildTabsForCampus(campusId);
    return t[0]?.program || "";
  });
  const [selectedBatch, setSelectedBatch] = useState(() => {
    const t = buildTabsForCampus(campusId);
    return t[0]?.batch || "";
  });

  useEffect(() => {
    const fresh = buildTabsForCampus(campusId);
    setTabs(fresh);
    setActiveTabId(fresh[0] ? fresh[0].id : null);
    setSelectedProgram(fresh[0]?.program || "");
    setSelectedBatch(fresh[0]?.batch || "");
    setPhase("edit");
    setProcessingRowId(null);
    setPausedOnErrorRowId(null);
  }, [campusId]);

  const activeTab = useMemo(() => tabs.find((t) => t.id === activeTabId), [tabs, activeTabId]);

  const tabErrorCounts = useMemo(() => {
    const map = {};
    for (const t of tabs) {
      if (!t.termDefined) { map[t.id] = 0; continue; }
      let c = 0;
      for (const r of t.rows) {
        const hasTouched = Object.keys(r.touched || {}).length > 0;
        const isActivelyBad = r.status === "error";
        if (!hasTouched && !isActivelyBad) continue;
        const errs = detectFieldErrors(r);
        if (errs.length) c += 1;
      }
      map[t.id] = c;
    }
    return map;
  }, [tabs]);

  const uniquePrograms = useMemo(() => [...new Set(tabs.map((t) => t.program))], [tabs]);
  const batchesForProgram = useMemo(() => [...new Set(tabs.filter((t) => t.program === selectedProgram).map((t) => t.batch))], [tabs, selectedProgram]);
  const filteredTabs = useMemo(() => tabs.filter((t) => t.program === selectedProgram && t.batch === selectedBatch), [tabs, selectedProgram, selectedBatch]);

  const totalRows = useMemo(() => tabs.reduce((s, t) => s + (t.termDefined ? t.rows.length : 0), 0), [tabs]);
  const scheduledRows = useMemo(() => tabs.reduce((s, t) => s + t.rows.filter((r) => r.status === "scheduled").length, 0), [tabs]);
  const hasAnyRows = totalRows > 0;
  const allScheduled = totalRows > 0 && scheduledRows === totalRows;

  const updateRow = (tabId, rowId, patch) => {
    setTabs((prev) =>
      prev.map((t) =>
        t.id !== tabId
          ? t
          : {
              ...t,
              rows: t.rows.map((r) => {
                if (r.id !== rowId) return r;
                const newTouched = { ...(r.touched || {}) };
                for (const k of Object.keys(patch)) newTouched[k] = true;
                return { ...r, ...patch, touched: newTouched, errors: {}, errorMessage: "" };
              }),
            }
      )
    );
  };
  const addGroupToSection = (tabId, rowId) => {
    setTabs((prev) => prev.map((t) => {
      if (t.id !== tabId) return t;
      const idx = t.rows.findIndex((r) => r.id === rowId);
      if (idx === -1) return t;
      const anchor = t.rows[idx];
      if (!anchor.isLab) return t;

      const family = anchor.groupParentKey
        ? t.rows.filter((r) => r.groupParentKey === anchor.groupParentKey)
        : [anchor];
      const parentKey = anchor.groupParentKey || `lab-${anchor.id}`;
      const nextCount = family.length + 1;

      const totalStudents = anchor.groupParentKey
        ? family.reduce((s, r) => s + (r.studentCount || 0), 0)
        : (anchor.studentCount || 0);
      const perGroup = Math.floor(totalStudents / nextCount);
      const remainder = totalStudents - perGroup * nextCount;

      let groupIdx = 0;
      const updatedRows = t.rows.map((r) => {
        const inFamily = anchor.groupParentKey
          ? r.groupParentKey === anchor.groupParentKey
          : r.id === anchor.id;
        if (!inFamily) return r;
        const i = groupIdx++;
        return {
          ...r,
          groupParentKey: parentKey,
          groupLabel: `Group ${i + 1}`,
          numGroups: nextCount,
          splitIntoGroups: true,
          studentCount: perGroup + (i < remainder ? 1 : 0),
        };
      });

      const newGroupIndex = nextCount - 1;
      const newRow = mkRow({
        subject: anchor.subject,
        subjectType: anchor.subjectType,
        specialisation: anchor.specialisation,
        isPrime: anchor.isPrime,
        isLab: true,
        sections: [...anchor.sections],
        studentCount: perGroup + (newGroupIndex < remainder ? 1 : 0),
        startDate: anchor.startDate,
        endDate: anchor.endDate,
        groupParentKey: parentKey,
        groupLabel: `Group ${nextCount}`,
        numGroups: nextCount,
        splitIntoGroups: true,
      });

      const familyIds = new Set(family.map((r) => r.id));
      let lastFamilyIdx = -1;
      updatedRows.forEach((r, i) => {
        if (familyIds.has(r.id) || (anchor.groupParentKey === null && r.id === anchor.id)) {
          lastFamilyIdx = i;
        }
      });
      const insertAt = lastFamilyIdx + 1;
      const nextRows = [...updatedRows.slice(0, insertAt), newRow, ...updatedRows.slice(insertAt)];
      return { ...t, rows: nextRows };
    }));
  };

  const removeGroupFromSection = (tabId, familyParentKey) => {
    setTabs((prev) => prev.map((t) => {
      if (t.id !== tabId) return t;
      const family = t.rows.filter((r) => r.groupParentKey === familyParentKey);
      if (family.length < 2) return t;

      const lastRow = family[family.length - 1];
      const survivors = t.rows.filter((r) => r.id !== lastRow.id);
      const newFamilySize = family.length - 1;

      const totalStudents = family.reduce((s, r) => s + (r.studentCount || 0), 0);
      const perGroup = Math.floor(totalStudents / newFamilySize);
      const remainder = totalStudents - perGroup * newFamilySize;

      let i = 0;
      const rebalanced = survivors.map((r) => {
        if (r.groupParentKey !== familyParentKey) return r;
        const idx = i++;
        if (newFamilySize === 1) {
          return {
            ...r,
            groupParentKey: null,
            groupLabel: null,
            splitIntoGroups: false,
            numGroups: 2,
            studentCount: totalStudents,
          };
        }
        return {
          ...r,
          groupLabel: `Group ${idx + 1}`,
          numGroups: newFamilySize,
          studentCount: perGroup + (idx < remainder ? 1 : 0),
        };
      });

      return { ...t, rows: rebalanced };
    }));
  };

  const ALL_FIELDS_TOUCHED = {
    startDate: true, endDate: true, startTime: true, endTime: true,
    days: true, facultyId: true, subject: true,
  };

  /** Submit ONLY the currently active tab. */
  const startSubmission = async () => {
    const tabId = activeTabId;
    const currentTab = tabsRef.current.find((t) => t.id === tabId);
    if (!currentTab || !currentTab.termDefined || currentTab.rows.length === 0) return;

    // ── Pre-flight: run full conflict + field-error sweep across every intended row.
    // If anything comes back, mark every affected row as error at once and bail —
    // don't start the submit loop. This surfaces all problems upfront instead of
    // pausing midway through.
    const latestTabs = tabsRef.current;
    const intendedRows = currentTab.rows.filter(
      (r) => isRowIntended(r) && r.status !== "scheduled"
    );
    const preflightErrors = new Map(); // rowId -> combined message
    for (const row of intendedRows) {
      const issues = detectRowConflicts(row, currentTab, latestTabs);
      if (issues.length) {
        preflightErrors.set(row.id, issues.map((c) => c.message).join(" "));
      }
    }
    if (preflightErrors.size > 0) {
      setTabs((prev) => prev.map((t) => {
        if (t.id !== tabId) return t;
        return {
          ...t,
          rows: t.rows.map((r) => {
            const msg = preflightErrors.get(r.id);
            if (!msg) {
              // still mark intended rows as touched so field-level errors show
              if (r.status !== "scheduled" && isRowIntended(r)) {
                return { ...r, touched: ALL_FIELDS_TOUCHED };
              }
              return r;
            }
            return {
              ...r,
              status: "error",
              errorMessage: msg,
              touched: ALL_FIELDS_TOUCHED,
            };
          }),
        };
      }));
      return; // phase stays at "edit"
    }

    setPhase("submitting");
    cancelRef.current = false;
    setTabs((prev) =>
      prev.map((t) => {
        if (t.id !== tabId) return t;
        return {
          ...t,
          rows: t.rows.map((r) => {
            if (r.status === "scheduled") return r;
            if (!isRowIntended(r)) return r; // all-empty-timing row: leave untouched
            return {
              ...r,
              status: "pending",
              errorMessage: "",
              touched: ALL_FIELDS_TOUCHED,
            };
          }),
        };
      })
    );

    for (const row of currentTab.rows) {
      if (cancelRef.current) return;
      const current = tabsRef.current.find((t) => t.id === tabId).rows.find((r) => r.id === row.id);
      if (!current || current.status === "scheduled") continue;
      if (!isRowIntended(current)) continue; // skip rows with no timing

      setProcessingRowId(row.id);

      const isGroupRow = !!row.groupParentKey;
      if (isGroupRow) {
        updateRowStatus(tabId, row.id, "creating");
        await wait(450);
      }

      updateRowStatus(tabId, row.id, "processing");
      await wait(550);

      const latestTabs = tabsRef.current;
      const latestTab = latestTabs.find((t) => t.id === tabId);
      const latestRow = latestTab.rows.find((r) => r.id === row.id);
      const conflicts = detectRowConflicts(latestRow, latestTab, latestTabs);

      if (conflicts.length) {
        const msg = conflicts.map((c) => c.message).join(" ");
        updateRowStatus(tabId, row.id, "error", msg);
        setPausedOnErrorRowId(row.id);
        setProcessingRowId(null);
        setPhase("edit");
        return;
      }

      updateRowStatus(tabId, row.id, "scheduled");
      await wait(180);
    }
    setProcessingRowId(null);

    // All tabs with a term now fully scheduled? Only then show the done screen.
    const latest = tabsRef.current;
    const everythingDone = latest.every((t) =>
      !t.termDefined || t.rows.length === 0 || t.rows.every((r) => r.status === "scheduled")
    );
    setPhase(everythingDone ? "done" : "edit");
  };

  const tabsRef = useRef(tabs);
  useEffect(() => { tabsRef.current = tabs; }, [tabs]);

  const updateRowStatus = (tabId, rowId, status, errorMessage = "") => {
    setTabs((prev) =>
      prev.map((t) =>
        t.id !== tabId
          ? t
          : { ...t, rows: t.rows.map((r) => (r.id === rowId ? { ...r, status, errorMessage } : r)) }
      )
    );
  };

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  /** A row counts as "unsaved work" if the user touched any field AND it's not yet scheduled. */
  const tabHasUnsavedWork = (t) =>
    !!t && t.termDefined && t.rows.some((r) =>
      r.status !== "scheduled" && Object.keys(r.touched || {}).length > 0
    );

  const handleProgramChange = (prog) => {
    setSelectedProgram(prog);
    const newBatches = [...new Set(tabs.filter((t) => t.program === prog).map((t) => t.batch))];
    const newBatch = newBatches[0] || "";
    setSelectedBatch(newBatch);
    const first = tabs.find((t) => t.program === prog && t.batch === newBatch);
    if (first) setActiveTabId(first.id);
  };

  const handleBatchChange = (batch) => {
    setSelectedBatch(batch);
    const first = tabs.find((t) => t.program === selectedProgram && t.batch === batch);
    if (first) setActiveTabId(first.id);
  };

  /** Tab click: if the current tab has unsaved work, confirm and discard it. */
  const switchToTab = (newTabId) => {
    if (newTabId === activeTabId || phase === "submitting") return;
    const current = tabs.find((t) => t.id === activeTabId);
    if (tabHasUnsavedWork(current)) {
      const ok = window.confirm(
        "You have unsaved changes in this semester that have not been submitted. " +
        "If you switch tabs, they will be lost. Submit this semester first, or continue anyway?"
      );
      if (!ok) return;
      // Reset non-scheduled rows in the current tab to pristine state from CAMPUS_DATA.
      const fresh = buildTabsForCampus(campusId).find((ft) => ft.id === current.id);
      if (fresh) {
        setTabs((prev) => prev.map((t) => {
          if (t.id !== current.id) return t;
          const scheduled = t.rows.filter((r) => r.status === "scheduled");
          // Keep scheduled rows in place; everything else gets swapped for fresh rows.
          // Match by subjectId+sectionId+groupLabel so duplicates from split-lab groups line up.
          const keyOf = (r) => `${r.subjectId}::${r.sectionId}::${r.groupLabel || ""}`;
          const scheduledByKey = new Map(scheduled.map((r) => [keyOf(r), r]));
          const nextRows = fresh.rows.map((fr) => scheduledByKey.get(keyOf(fr)) || fr);
          return { ...t, rows: nextRows };
        }));
      }
    }
    setActiveTabId(newTabId);
  };

  const handleFinish = () => {
    onClose?.();
    setTimeout(() => {
      setPhase("edit");
      const fresh = buildTabsForCampus(campusId);
      setTabs(fresh);
      setActiveTabId(fresh[0] ? fresh[0].id : null);
    }, 300);
  };

  if (!open) return null;

  return (
    <>
      <SunstoneStyles />
      <style>{`.spin { animation: sunspin 0.9s linear infinite; } @keyframes sunspin { to { transform: rotate(360deg); } }`}</style>
      <div className="sun-root">
        <div className="drawer-backdrop" onClick={phase === "submitting" ? undefined : onClose} />
        <aside className="drawer" role="dialog" aria-modal="true" aria-label="Bulk Schedule">
          <div className="drawer-header">
            <div className="drawer-title-block">
              <div className="drawer-title">Bulk Schedule</div>
              <div className="drawer-subtitle">
                Plan recurring classes for every program × batch in <strong style={{ color: "var(--color-neutral-dark-1)" }}>{campusName}</strong> for the upcoming semester.
              </div>
            </div>
            <button className="btn-square-small" onClick={onClose} aria-label="Close">
              <X size={20} />
            </button>
          </div>

          <div className="drawer-nav">
            <div className="drawer-filters">
              <div className="filter-group">
                <span className="field-label">Program</span>
                <select
                  className="filter-select"
                  value={selectedProgram}
                  onChange={(e) => handleProgramChange(e.target.value)}
                  disabled={phase === "submitting"}
                >
                  {uniquePrograms.map((p) => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>
              <div className="filter-group">
                <span className="field-label">Batch Year</span>
                <select
                  className="filter-select"
                  value={selectedBatch}
                  onChange={(e) => handleBatchChange(e.target.value)}
                  disabled={phase === "submitting"}
                >
                  {batchesForProgram.map((b) => <option key={b} value={b}>{b}</option>)}
                </select>
              </div>
            </div>
            <div className="drawer-tabs" role="tablist">
              {filteredTabs.map((t) => {
                const label = [t.degreeType, t.offering].filter(Boolean).join(" · ") || "Default";
                const errCount = tabErrorCounts[t.id] || 0;
                const doneCount = t.rows.filter((r) => r.status === "scheduled").length;
                const allDone = t.rows.length > 0 && doneCount === t.rows.length;
                return (
                  <button
                    key={t.id}
                    className={`tab-line ${activeTabId === t.id ? "active" : ""}`}
                    onClick={() => switchToTab(t.id)}
                    role="tab"
                    aria-selected={activeTabId === t.id}
                  >
                    {label}
                    {!t.termDefined && <span className="tag-small tag-warning" style={{ padding: "0 6px" }}>No term</span>}
                    {t.termDefined && errCount > 0 && phase !== "done" && (
                      <span title={`${errCount} row(s) need attention`} className="tab-error-dot" />
                    )}
                    {t.termDefined && allDone && <span title="All scheduled" className="tab-done-dot" />}
                  </button>
                );
              })}
            </div>
          </div>

          <div className="drawer-body">
            {phase === "done" ? (
              <div className="success-wrap">
                <div className="success-icon"><CheckCircle2 size={40} /></div>
                <div className="success-title">All classes scheduled</div>
                <div className="success-desc">
                  {scheduledRows} recurring {scheduledRows === 1 ? "event" : "events"} across {tabs.filter((t) => t.termDefined && t.rows.length).length} program{tabs.filter((t) => t.termDefined && t.rows.length).length === 1 ? "" : "s"} have been placed on the academic calendar. Students and faculty will see the updated timetable immediately.
                </div>
                <button className="btn-medium btn-primary-light" onClick={handleFinish}>
                  <Check size={16} /> Finish
                </button>
              </div>
            ) : !activeTab.termDefined ? (
              <div className="empty-state">
                <div className="empty-state-icon"><AlertCircle size={28} /></div>
                <div className="empty-state-title">Term details aren't entered in Academic Management</div>
                <div className="empty-state-desc">
                  You can't schedule {activeTab.program} {activeTab.batch}{activeTab.degreeType ? ` ${activeTab.degreeType}` : ""}{activeTab.offering ? ` · ${activeTab.offering}` : ""} yet. Go to Academic Management and configure the upcoming term — start date, end date, session slot duration and weekly off — then come back here.
                </div>
                <button className="btn-medium btn-secondary-light">
                  Open Academic Management <ChevronRight size={14} />
                </button>
              </div>
            ) : (
              <>
                <TermMetaStrip tab={activeTab} onChangeSemester={(s) => {}} />
                <ScheduleTable
                  tab={activeTab}
                  allTabs={tabs}
                  onUpdateRow={(rowId, patch) => updateRow(activeTab.id, rowId, patch)}
                  onAddGroup={(rowId) => addGroupToSection(activeTab.id, rowId)}
                  onRemoveGroup={(parentKey) => removeGroupFromSection(activeTab.id, parentKey)}
                  processingRowId={processingRowId}
                  pausedOnErrorRowId={pausedOnErrorRowId}
                  phase={phase}
                />
              </>
            )}
          </div>

          {phase !== "done" && (() => {
            const activeRows = activeTab && activeTab.termDefined ? activeTab.rows : [];
            const activeTotal = activeRows.length;
            const activeScheduled = activeRows.filter((r) => r.status === "scheduled").length;
            const activeSubmittable = activeRows.filter((r) => r.status !== "scheduled" && isRowIntended(r)).length;
            const activeErrs = tabErrorCounts[activeTabId] || 0;
            const activeLabel = activeTab ? `${activeTab.program} ${activeTab.batch}${activeTab.degreeType ? " · " + activeTab.degreeType : ""}${activeTab.offering ? " · " + activeTab.offering : ""}` : "";
            return (
            <div className="drawer-footer">
              <div style={{ display: "flex", alignItems: "center", gap: 16, flex: 1, minWidth: 0 }}>
                {phase === "submitting" ? (
                  <>
                    <div style={{ display: "flex", flexDirection: "column", gap: 4, flex: 1, minWidth: 0 }}>
                      <div className="label-small-primary" style={{ display: "flex", justifyContent: "space-between", gap: 12 }}>
                        <span>Scheduling {activeLabel}</span>
                        <span style={{ color: "var(--color-neutral-dark-2)", fontWeight: 400 }}>
                          {activeScheduled} / {activeTotal} events placed
                        </span>
                      </div>
                      <div className="progress-bar">
                        <div className="progress-fill" style={{ width: `${activeTotal ? (activeScheduled / activeTotal) * 100 : 0}%` }} />
                      </div>
                    </div>
                  </>
                ) : (
                  <div className="label-small-secondary" style={{ display: "flex", alignItems: "center", gap: 16, flexWrap: "wrap" }}>
                    <span>
                      <strong style={{ color: "var(--color-neutral-dark-1)" }}>{activeScheduled}</strong> / <strong style={{ color: "var(--color-neutral-dark-1)" }}>{activeTotal}</strong> events scheduled in this semester
                    </span>
                    {activeErrs > 0 && (
                      <span className="tag-small tag-error">
                        <AlertCircle size={11} />
                        {activeErrs} row(s) need attention
                      </span>
                    )}
                  </div>
                )}
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                <button className="btn-medium btn-secondary-light" onClick={onClose} disabled={phase === "submitting"}>
                  Cancel
                </button>
                <button
                  className="btn-medium btn-primary-light"
                  onClick={startSubmission}
                  disabled={activeSubmittable === 0 || phase === "submitting"}
                  title={activeSubmittable === 0 ? "Fill start time, end time and days for at least one row" : undefined}
                >
                  {phase === "submitting" ? (
                    <><Loader2 size={14} className="spin" /> Scheduling…</>
                  ) : (
                    <><Play size={14} /> Submit & Schedule</>
                  )}
                </button>
              </div>
            </div>
            );
          })()}
        </aside>
      </div>
    </>
  );
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function TermMetaStrip({ tab }) {
  const term = tab.term;
  const workingDayLabels = term.workingDays.map((i) => DAY_LABELS[i]).join(", ");
  const offDays = DAY_LABELS.filter((_, i) => !term.workingDays.includes(i)).join(", ") || "None";
  const fmt = (iso) => {
    if (!iso) return "—";
    const d = new Date(iso);
    return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  };
  return (
    <div className="term-strip">
      <div className="term-meta-list">
        <div className="term-meta-item">
          <div className="term-meta-label">Semester</div>
          <select className="cascader-trigger" style={{ minWidth: 220, fontWeight: 600 }} defaultValue="upcoming">
            <option value="upcoming">{term.label}</option>
            <option value="current">Semester 2 — Current</option>
          </select>
        </div>
        <div className="term-meta-item">
          <div className="term-meta-label"><Calendar size={14} /> Term Start</div>
          <div className="term-meta-value">{fmt(term.startDate)}</div>
        </div>
        <div className="term-meta-item">
          <div className="term-meta-label"><Calendar size={14} /> Term End</div>
          <div className="term-meta-value">{fmt(term.endDate)}</div>
        </div>
        <div className="term-meta-item">
          <div className="term-meta-label"><Clock size={14} /> Session Slot</div>
          <div className="term-meta-value">{term.slotMinutes} min</div>

        <div className="term-meta-item">
          <div className="term-meta-label"><Calendar size={14} /> Working Days</div>
          <div className="term-meta-value">{workingDayLabels}</div>
